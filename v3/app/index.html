// approved in the lab on twelve static seeded artworks; the first time that
// combination was seen in a live rally at 1000×630 with a moving ball, it
// produced a 57.6px worst case — a bar, not a brush stroke. Brief 23 cut the
// range (worst case → 23px); still too heavy, so brief 24 cuts the BASE
// instead (6.0 → 3.5, worst case → ~13px) — no longer even importing
// PAINT_WIDTH_BASE, since the game never uses it now. Reference point: the
// lab's own BASE WIDTH slider sits at 4.5, not 6.0 — paint.js's frozen
// constant already didn't match the lab, before it's compared to the game.
// These three are the live PRODUCT'S OWN values, and paint.js's pair is the
// one that's stale and pending reconciliation (BACKLOG.md, extended briefs
// 23 and 24) — not the reverse. Do NOT "fix" these back to match paint.js;
// if the numbers still disagree when that reconciliation happens, paint.js
// moves to these, not this file to paint.js's frozen pair.
const GAME_PAINT_WIDTH_VAR_MIN = 0.25, GAME_PAINT_WIDTH_VAR_MAX = 1.6; // was 0.15/4.0 — max cut 60% (brief 23 Task 2), min raised so the thin end reads as a hairline brush, not a single pixel
const GAME_PAINT_WIDTH_BASE = 3.5; // was paint.js's imported 6.0 — brief 24 Task 2, new worst case 2.4 x 3.5 x 1.6 = 13.44px
let gamePaintTracker; // built fresh each game — see startGame()

// ── Task 4 — per-surface ground, paint's neutral-substrate exception ──
const gameGroundCache = {};
function getGameGround(surfaceKey) {
  if (!gameGroundCache[surfaceKey]) {
    if (surfaceKey === 'chalk') {
      gameGroundCache[surfaceKey] = buildChalkboardSurface(W, H, makeRng(gameGroundSeeds.chalk));
    } else if (surfaceKey === 'paint') {
      // PAINT-MODE.md §4 (LOCKED): "The ground does not exist during
      // play. The player paints on a neutral substrate; at game end the
      // artwork re-renders with the ground composited beneath the marks."
      // The neutral substrate is --color-canvas-paint-base (DESIGN.md §2)
      // = #FFF5E5, i.e. the PAPER ground — so this deliberately calls
      // buildSurface (paper's real ground function), not buildPaintSurface.
      // The chosen paint ground (gamePaintPalette.ground, picked in
      // startGame()) composites in only at the reveal — brief 23's job.
      gameGroundCache[surfaceKey] = buildSurface(W, H, makeRng(gameGroundSeeds.paint));
    } else {
      gameGroundCache[surfaceKey] = buildSurface(W, H, makeRng(gameGroundSeeds.paper));
    }
  }
  return gameGroundCache[surfaceKey];
}

// Chalk brightness/grayscale lift decision (brief 22 Task 4 explicitly
// asks for one, stated, not silently inherited): the doodle's
// brightness(2.4) grayscale(1) filter (briefs 20/21) exists because the
// idle doodle sits at ambient scale behind a card, easy to glance past.
// The game is the foreground — DESIGN.md's own Verification for this
// brief asks for the real engine grounds with no mention of a lift — so
// NO filter is applied here. getGameGround's chalk branch returns
// buildChalkboardSurface's pixels completely as-drawn.

// ── Task 5 — per-surface palette state (game-scoped, independently
// shufflable — never touches the doodle's fixed PALETTE_ARRAYS) ────────
let gamePaperOrder;   // shuffled index map into PAPER_PALETTE (3, brief 25 Task 3 — was DEFAULT_PALETTE's full 5)
let gameChalkOrder;   // shuffled index map into CHALK_PALETTE (3)
let gamePaintPalette; // buildPalette() result — ground fixed once per game, not touched by shuffle
let gamePaintArray;   // weightedPaletteArray(gamePaintPalette, ...) — a flattened, weighted 20-slot
                       // round-robin CYCLE used for stroke colour assignment, NOT the dot list —
                       // see gamePalPillHexesFor for the 3 distinct accents shown in the pill.

function gamePaletteArrayFor(surfaceKey) {
  if (surfaceKey === 'chalk') return gameChalkOrder.map(i => CHALK_PALETTE[i]);
  if (surfaceKey === 'paint') return gamePaintArray;
  return gamePaperOrder.map(i => PAPER_PALETTE[i]);
}
function gameColourFor(surfaceKey, index) {
  const arr = gamePaletteArrayFor(surfaceKey);
  return arr[index % arr.length];
}
// Brief 24 Task 5 shipped the paint pill showing all FIVE of the artwork's
// colour slots (ground, ink, 3 accents) to match the lab's swatch row.
// Brief 25 Task 3 REVERSES that: "every palette chip shows 3 dots" is built
// on the principle that a pill lying about what actually gets painted is a
// bug — brief 24's own reasoning, just pointed the other way. Paint's real
// stroke cycle (gamePaletteArrayFor/gameColourFor) has only ever used the 3
// accents; ground and ink never appear as a LINE colour (ink is splatter-
// only, Task 6; ground is the reveal's job, brief 26). A 5-dot pill was
// therefore itself a lying control by brief 25's standard, just overstating
// instead of understating. Back to 3 accents only, matching chalk and the
// now-3-colour paper (below) — pill and actual stroke palette agree on all
// three surfaces, which is the whole point of Task 3.
function gamePalPillHexesFor(surfaceKey) {
  if (surfaceKey === 'chalk') return gameChalkOrder.map(i => CHALK_PALETTE[i]);
  if (surfaceKey === 'paint') return gamePaintPalette.accents.map(a => a.hex);
  return gamePaperOrder.map(i => PAPER_PALETTE[i]);
}
function shuffleArrayInPlace(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ── Committed-strokes layer + stroke commit — brief 24 Task 4 splits what
// was one "persist" canvas (ground + strokes baked together) into TWO:
// getGameGround(surfaceKey) already IS the opaque ground layer (built once,
// cached, per Task 4/brief 22 — no separate copy needed here), and
// gameStrokesCv below holds committed strokes ONLY, transparent background.
// drawGameFrame composites ground at alpha 1, then this layer at the
// current dim/full alpha, then the live stroke at alpha 1, then the ball —
// so "committed strokes sit back during play, snap to full at game end" is
// a single alpha number on ONE drawImage call, not a per-stroke property.
// A per-stroke alpha instead would double-darken wherever strokes overlap
// (each layer's semi-transparent paint stacks); compositing the whole layer
// once dims everything evenly regardless of how busy an area is. This same
// split is what brief 26's reveal needs anyway — the paint ground has to
// composite in UNDERNEATH the marks — so it's built now, not unpicked from
// a combined canvas next brief.
const gameStrokesCv = document.createElement('canvas');
gameStrokesCv.width = W; gameStrokesCv.height = H;
const gameStrokesCx = gameStrokesCv.getContext('2d');

// 70% while playing, 100% once the game ends (see stepGame's win branch) —
// starting value, tune by eye and report. One number, not a re-render.
const GAME_COMMITTED_ALPHA = 0.70;
let gameStrokesAlpha = GAME_COMMITTED_ALPHA;

let gameCommittedStrokes = [];
let gameStrokeIndex = 0;

// Single stroke renderer for the game, live or committed — same principle
// as the doodle's renderStrokeAs (Task 1): paint routes through the ONE
// shared drawPaintRibbon, at product width, so a stroke can never be drawn
// two different ways at two points in its life, rally or reveal. (Brief 23's
// taperOpts param is gone — brief 24 Task 3 removed the taper entirely;
// see drawPaintRibbon's own comment.)
function renderGameStrokeAs(ctx, surfaceKey, pts, wt, op, index) {
  const col = gameColourFor(surfaceKey, index);
  if (surfaceKey === 'chalk') {
    renderChalkStroke(ctx, pts, col, wt, op, CHALK_DEFAULT_WIDTH_MULT, 0);
  } else if (surfaceKey === 'paint') {
    drawPaintRibbon(ctx, pts, wt * GAME_PAINT_WIDTH_BASE, col);
  } else {
    renderStroke(ctx, pts, col, wt, op, DEFAULT_STROKE_PARAMS);
  }
}

function rebuildGameStrokes() {
  gameStrokesCx.clearRect(0, 0, W, H); // transparent, NOT the ground — see the layer-split comment above
  gameCommittedStrokes.forEach(st => renderGameStrokeAs(gameStrokesCx, currentSurface, st.pts, st.wt, st.op, st.index));
}

function commitGameStroke(rawPts, wt, op, eventType) {
  if (rawPts.length < 2) return;
  // Same re-zip as the doodle's commitStroke (Task 1/brief 20): jitterPath
  // returns fresh {x,y} objects for interior points, dropping the baked
  // .w — re-attach it by index so a committed paint stroke keeps the
  // exact widths it had live.
  const jittered = jitterPath(rawPts, JITTER_AMPLITUDE);
  const pts = jittered.map((p, i) => ({ x: p.x, y: p.y, w: rawPts[i].w }));
  const st = { pts, wt, op, index: gameStrokeIndex++, event: eventType };
  gameCommittedStrokes.push(st);
  renderGameStrokeAs(gameStrokesCx, currentSurface, st.pts, st.wt, st.op, st.index); // incremental — never cleared mid-game
  return st;
}

// ── Task 3 — the game loop ─────────────────────────────────────────────
let gameBall, gamePaddleL, gamePaddleR;
let gamePs = 0, gameAs = 0, gameLv = 1, gameAiSpd = 2.6;
let gameMouseY = H / 2, gamePrevMouseY = H / 2;
let gameServing = false; // true during the short beat between a miss and the next spawn
let gameLastEndedStrokes = null; // handoff for brief 26 (results/reveal) — {strokes, seed, surface}

// ── Task 6 (brief 24) — live splatter, paint only ──────────────────────
// PAINT-MODE.md §5 D, specced since brief 11, never built until now: ink
// thrown off the ball mid-rally, separate from the line it's drawing.
// Density-placed buildSplatter/buildIntersectionBlotches (splatter.js) are
// NOT used here on purpose — those place marks over a FINISHED stroke set,
// which is a different mechanism from "the ball sheds ink as it travels."
// This is physics-driven emission instead: evaluated once per frame,
// probability scaling with |ball.spin| and speed, so a fast spinning ball
// sheds ink and a slow straight one doesn't. Marks are built app-side and
// handed straight to the engine's own exported renderSplatterMark — the
// actual fill code (irregular blob / teardrop+satellites) is never
// duplicated, only the placement/sizing decision is app-side.
//
// Never on a hit. splatter.js's own header records why density-placement
// replaced event-triggering in the first place: brief 02's hit-triggered
// ink bloom pinned every mark to the canvas edge, because paddle/wall hits
// are structurally always on the boundary. stepGame gates this to frames
// with NO hit event and NO miss this frame — see the call site.
// Brief 31 Task 2a — cooldown 40 -> 24, target count 3-8 -> 10-18/game.
// GAME_SPLATTER_CAP is doing real, frequent work here, not acting as a rare
// safety net the way the old CAP=10 mostly did against a 3-8 target — a
// game's total splatter count scales with its own rally length, which
// varies enormously game to game (measured, briefs 29/30: several-thousand-
// step spread between a short and a long game), so a per-frame probability
// alone cannot hold a tight band without a real ceiling. CAP is set to the
// target's own upper bound (18) for exactly that reason. BASE_P tuned
// against 20 real headless games at these settings: 19/20 landed in
// [10,18] (10 of those 19 at the 18 cap — long games routinely reach it),
// one short game landed at 9, one below the floor — accepted rather than
// pushed higher, since raising BASE_P further to close that one gap would
// mean most games hit the cap and read as a fixed count rather than
// organic variation. Mean 16.1 across the sample.
const GAME_SPLATTER_COOLDOWN_FRAMES = 24; // was 40
const GAME_SPLATTER_CAP = 18; // was 10 — the target's own upper bound, not "target + headroom" (see above)
const GAME_SPLATTER_SPIN_REF = 0.15; // |ball.spin| normalisation — see physics.js's sweptHit/finishWallBounce for typical magnitudes
const GAME_SPLATTER_BASE_P = 0.017; // was 0.016 — see the measurement note above
// ~60/40 drops:flung baseline, spin-skewed same as before, but no longer
// THE ONLY source of variation in the mix — see buildLiveSplatterMark's own
// jitter term, added so two games with similar spin don't converge on the
// same drop/flung ratio every time ("vary the mix, don't hold it fixed").
const GAME_SPLATTER_FLUNG_RATIO = 0.4;
const GAME_SPLATTER_FLUNG_RATIO_JITTER = 0.3; // +/-0.15 on top of the spin-derived chance
const GAME_SPLATTER_OFFSET_MIN = 14, GAME_SPLATTER_OFFSET_RANGE = 18; // px clear of the ball, perpendicular to travel — clears the widest (~13px) stroke plus the mark's own radius

// splatter.js's own size constants (DROP_R, FLUNG_LEN, FLUNG_HEAD_R) are
// private/unexported, tuned against a 24px-wide stroke the game no longer
// has (~13px widest now, brief 24 Task 2) — mirrored here at ~0.58x per the
// brief's own numbers, same pattern and same BACKLOG.md reconciliation item
// as the width constants above. Brief 31 Task 2a widens all three ranges
// further still ("no two marks read as siblings") — tuned by eye, verified
// on a real finished canvas (see the session report for a screenshot).
const GAME_SPLATTER_DROP_R_MIN = 1.5, GAME_SPLATTER_DROP_R_MAX = 16.0; // was 2.5-12.0
const GAME_SPLATTER_DROP_SIZE_POWER = 3.5; // mirrors splatter.js's DROP_SIZE_POWER — heavy-tailed toward small
const GAME_SPLATTER_FLUNG_LEN_MIN = 10, GAME_SPLATTER_FLUNG_LEN_MAX = 45; // was 15-35
const GAME_SPLATTER_HEAD_R_MIN = 3, GAME_SPLATTER_HEAD_R_MAX = 12; // was 4-9
const GAME_SPLATTER_SATELLITE_COUNT_MIN = 2, GAME_SPLATTER_SATELLITE_COUNT_MAX = 5; // a count, not a size — unscaled

let gameSplatterRng; // own stream, salted off the per-game seed like every other — see startGame()
let gameSplatterCooldown = 0;
let gameSplatterMarks = []; // { mark, afterStrokes } — see maybeEmitSplatter's brief-26 comment

// Brief 31 Task 2a — "no black splatter": drops the ink entry entirely.
// Was mirroring splatter.js's private splatterColorWeights(palette), which
// includes ink at a minor weight alongside the 3 accents; the app now
// diverges from it on purpose — splatter draws only from the 3 accents, at
// their own palette weights, never ink. (The ball marker itself stays
// solid ink/black in paint mode — brief 24's legibility decision, separate
// from this and not affected by it.)
function gameSplatterColorWeights(palette) {
  return [
    ...palette.accents.map(a => ({ value: a.hex, weight: a.weight })),
  ];
}

// Builds one mark descriptor at the ball's CURRENT position, offset
// perpendicular to travel (brief: "far enough that it lands clear of the
// trail... a mark that lands on top of the stroke reads as a blob in the
// line"). This is deliberately NOT splatter.js's nearestDirection (which
// orients a flung mark ALONG the local stroke tangent, for density-placed
// marks found after the fact) — a live mark is oriented perpendicular,
// away from the line it's leaving, matching "flung off the ball" physically.
function buildLiveSplatterMark(ball, palette, rng) {
  const spd = Math.hypot(ball.vx, ball.vy) || 1;
  const tx = ball.vx / spd, ty = ball.vy / spd; // travel direction (unit)
  const nx = -ty, ny = tx;                      // perpendicular to travel (unit)
  const sign = rng() < 0.5 ? 1 : -1;             // randomise which side
  const offset = GAME_SPLATTER_OFFSET_MIN + rng() * GAME_SPLATTER_OFFSET_RANGE;
  const mx = ball.x + nx * sign * offset, my = ball.y + ny * sign * offset;

  const colorHex = weightedPick(rng, gameSplatterColorWeights(palette));

  // High spin favours 'flung' (brief 24 Task 6), oriented perpendicular to
  // travel — not the ~60/40 flat ratio alone. Brief 31 Task 2a adds a
  // random jitter on top of the spin term so the drop/flung mix actually
  // varies game to game instead of being a deterministic function of spin
  // alone — two balls with near-identical spin no longer produce the same
  // ratio every time.
  const spinNorm = Math.min(1, Math.abs(ball.spin) / GAME_SPLATTER_SPIN_REF);
  const jitter = (rng() - 0.5) * GAME_SPLATTER_FLUNG_RATIO_JITTER;
  const flungChance = Math.max(0.1, Math.min(0.9, GAME_SPLATTER_FLUNG_RATIO + spinNorm * 0.4 + jitter));

  if (rng() < flungChance) {
    const dx = nx * sign, dy = ny * sign; // fling continues outward along the same perpendicular
    const headR = GAME_SPLATTER_HEAD_R_MIN + rng() * (GAME_SPLATTER_HEAD_R_MAX - GAME_SPLATTER_HEAD_R_MIN);
    const length = GAME_SPLATTER_FLUNG_LEN_MIN + rng() * (GAME_SPLATTER_FLUNG_LEN_MAX - GAME_SPLATTER_FLUNG_LEN_MIN);
    const satelliteCount = GAME_SPLATTER_SATELLITE_COUNT_MIN
      + Math.floor(rng() * (GAME_SPLATTER_SATELLITE_COUNT_MAX - GAME_SPLATTER_SATELLITE_COUNT_MIN + 1));
    const satellites = [];
    for (let i = 0; i < satelliteCount; i++) {
      const t = 1.1 + i * 0.35 + rng() * 0.25;
      const perp = (rng() - 0.5) * headR * (1.2 + i * 0.6); // scatter along the ORIGINAL travel axis, off the fling line
      satellites.push({
        x: mx + dx * length * t + tx * perp,
        y: my + dy * length * t + ty * perp,
        r: Math.max(0.5, headR * (0.4 - i * 0.05) * (0.7 + rng() * 0.5)),
      });
    }
    return { type: 'flung', x: mx, y: my, dx, dy, headR, length, colorHex, satellites };
  }

  const rNorm = Math.pow(rng(), GAME_SPLATTER_DROP_SIZE_POWER); // heavy-tailed toward small
  const r = GAME_SPLATTER_DROP_R_MIN + (GAME_SPLATTER_DROP_R_MAX - GAME_SPLATTER_DROP_R_MIN) * rNorm;
  const irregularity = 0.12 + rng() * 0.13;
  const seedAngle = rng() * Math.PI * 2;
  return { type: 'drop', x: mx, y: my, r, irregularity, seedAngle, colorHex };
}

// Called once per frame from stepGame, only on frames with no hit event and
// no miss this frame (see the call site) — "mid-flight, between bounces."
function maybeEmitSplatter() {
  if (gameSplatterCooldown > 0) { gameSplatterCooldown--; return; }
  if (gameSplatterMarks.length >= GAME_SPLATTER_CAP) return;

  const spd = Math.hypot(gameBall.vx, gameBall.vy);
  const spinNorm = Math.min(1, Math.abs(gameBall.spin) / GAME_SPLATTER_SPIN_REF);
  const speedNorm = Math.min(1, Math.max(0, (spd - BASE_SPD) / (MAX_SPD - BASE_SPD)));
  const p = GAME_SPLATTER_BASE_P * spinNorm * (0.4 + 0.6 * speedNorm);
  if (gameSplatterRng() >= p) return;

  const mark = buildLiveSplatterMark(gameBall, gamePaintPalette, gameSplatterRng);
  // Splatter is artwork, not chrome (brief 24 Task 6) — into gameStrokesCx,
  // so it dims with everything else during play and comes up to full at
  // game end (Task 4), same as a committed stroke.
  renderSplatterMarkPaint(gameStrokesCx, mark);
  // Brief 26: also KEEP the descriptor, tagged with how many strokes were
  // committed when it fired. gameStrokesCv only ever holds baked pixels —
  // fine for live play, but the results screen's timeline scrubber (Task 6)
  // has to selectively show/hide marks by rebuilding from re-renderable
  // data, and a flat bitmap can't be un-drawn. Same principle as everywhere
  // else in this file: renderSplatterMark is the one function that draws a
  // mark, live or replayed, so calling it again later from this stored
  // descriptor reproduces identical pixels — not a second algorithm.
  gameSplatterMarks.push({ mark, afterStrokes: gameCommittedStrokes.length });
  gameSplatterCooldown = GAME_SPLATTER_COOLDOWN_FRAMES;
}

// Brief 27 Tasks 3/4 — shared remove/reflow/add retrigger idiom (root's

// fast rally only flashes on the FIRST hit — re-adding a class that's

function flashPaddle(el) {
  el.classList.remove('paddle-hit');
  void el.offsetWidth;
  el.classList.add('paddle-hit');
}
// Brief 28 Task 5e — two strengths, not one: className/durationMs let the
// two call sites (point vs. game over) pick theirs. Clears BOTH classes

// still fading — only one strength shows at a time.
function flashGameFrame(className, durationMs) {
  gameFrameEl.classList.remove('canvas-glow-point', 'canvas-glow-gameover');
  void gameFrameEl.offsetWidth;
  gameFrameEl.classList.add(className);
  setTimeout(() => gameFrameEl.classList.remove(className), durationMs);
}

// ── Task 1 (brief 23, geometry fixed brief 24, y fixed brief 26 Task 0.2) —
// paddle-travel guardrails. Static DOM chrome, set once, never touched by
// the game loop. rightX uses an 8px guard width (brief 24: the mark is
// exactly the frame border's own thickness, so it sits entirely on the
// border).
//
// y was PAD_MIN-2 (38) / PAD_MAX+PH (590) through brief 24 — flush against
// the paddle's true travel limit, but INSIDE the canvas's 48px corner arc
// (the straight section only runs y 48 to y 582). An 8px horizontal bar
// can't sit flush against a curve, which is what read as "not tucked in"
// across two rounds of colour/length fixes. Moved onto the straight
// section instead, derived from CANVAS_RADIUS (not a physics.js constant —
// border-radius is presentational, DESIGN.md §5's --radius token, 48).
// Top: the straight section's own top edge. Bottom: its own bottom edge,
// minus the guard's 2px height so the mark's OUTER edge lands exactly on
// it. ~8px off the true paddle limit — under 1.5% of canvas height,
// invisible as an affordance; a bar overhanging a curve is not. Deliberate
// trade, per the brief.
const CANVAS_RADIUS = 48; // DESIGN.md §5 --radius, .frame's border-radius
const GUARD_HEIGHT = 2;
(function placeGuardrails() {
  const topY = CANVAS_RADIUS;
  const botY = H - CANVAS_RADIUS - GUARD_HEIGHT;
  const rightX = W - 8;      // guard is 8px wide — flush to the right edge
  document.getElementById('guard-tl').style.cssText = `left:0px; top:${topY}px;`;
  document.getElementById('guard-bl').style.cssText = `left:0px; top:${botY}px;`;
  document.getElementById('guard-tr').style.cssText = `left:${rightX}px; top:${topY}px;`;
  document.getElementById('guard-br').style.cssText = `left:${rightX}px; top:${botY}px;`;
})();

// Root index.html's own pattern: listen on document (not just the canvas)
// so the cursor tracks correctly even over the paddles/frame, mapped into
// canvas coordinate space via getBoundingClientRect. Gated to the playing
// screen only.
document.addEventListener('mousemove', (e) => {
  if (screenState !== 'playing') return;
  const r = gameCanvas.getBoundingClientRect();
  gameMouseY = (e.clientY - r.top) * (H / r.height);
});

// Brief 27 Task 5 — root's own idiom (~lines 1198-1211): read the OLD value
// off the DOM text itself before overwriting it, so only the side that
// actually increased gets the pop — never both, even though this function
// runs once per point for whichever side scored.
function updateGameScoreUI() {
  const prevPs = parseInt(scorePEl.textContent, 10) || 0;
  const prevAs = parseInt(scoreAEl.textContent, 10) || 0;
  scorePEl.textContent = String(gamePs);
  scoreAEl.textContent = String(gameAs);
  if (gamePs > prevPs) { scorePEl.classList.remove('score-pop'); void scorePEl.offsetWidth; scorePEl.classList.add('score-pop'); }
  if (gameAs > prevAs) { scoreAEl.classList.remove('score-pop'); void scoreAEl.offsetWidth; scoreAEl.classList.add('score-pop'); }
}

function updateGamePalPill() {
  pgPalPillEl.querySelectorAll('.dot').forEach(d => d.remove());
  gamePalPillHexesFor(currentSurface).forEach(hex => {
    const dot = document.createElement('i');
    dot.className = 'dot';
    dot.style.background = hex;
    pgPalPillEl.insertBefore(dot, pgShuffleEl);
  });
}

// Ported verbatim from simulate.js's checkLevel — every 2 total points,
// lv++, aiSpd = min(2.6 + lv*0.40, 7.5), levelUp(balls). One ball at a
// time (MAX_B = 1, as in the live build), so levelUp/pickTargetY are
// called with a 1-element array.
function checkGameLevel() {
  const tot = gamePs + gameAs;
  if (tot > 0 && tot % 2 === 0) {
    gameLv++;
    gameAiSpd = Math.min(2.6 + gameLv * 0.40, 7.5);
    levelUp([gameBall]);
    sndLevelUp(); // brief 27 Task 2
  }
}

function spawnGameBall() {
  gameBall = mkBall(gamePhysRng, gameLv, null, [1.0, 2.4], [0.50, 0.68]);
  gamePaintTracker.startTrail(gameBall, gameBall.x, gameBall.y);
  gameServing = false;
  serveDotEl.hidden = true;
}

function startGame() {
  // Task 6 — the one permitted Math.random() call, generating this game's
  // single seed; every stream below is makeRng(seed ^ salt), never
  // Math.random() again.
  gameSeed = Math.floor(Math.random() * 1e9);
  gamePhysRng = makeRng(gameSeed);
  gameGroundSeeds = {
    paper: (gameSeed ^ 0x1A2B3C4D) >>> 0,
    chalk: (gameSeed ^ 0x2B3C4D5E) >>> 0,
    paint: (gameSeed ^ 0x3C4D5E6F) >>> 0,
  };
  gamePaintWidthRng = makeRng((gameSeed ^ 0x50A17B18) >>> 0); // distinct salt from the doodle's own 0x50A17B17
  gamePaintTracker = makePaintTracker(gamePaintWidthRng, {
    varMin: GAME_PAINT_WIDTH_VAR_MIN, varMax: GAME_PAINT_WIDTH_VAR_MAX,
    undulationsMin: PAINT_UNDULATIONS_MIN, undulationsMax: PAINT_UNDULATIONS_MAX,
    refLen: PAINT_UNDULATION_REF_LEN,
    widthVariation: PAINT_DEFAULT_WIDTH_VARIATION, // imported — paint.js's real frozen default (1.0)
  });
  gameSplatterRng = makeRng((gameSeed ^ 0x53504C41) >>> 0); // 'SPLA' — own stream, Task 6
  gameSplatterCooldown = 0;
  gameSplatterMarks = [];
  gameStrokesAlpha = GAME_COMMITTED_ALPHA; // Task 4 — reset dim, snaps to 1.0 at this game's own end

  // Palette: paper/chalk start in identity order (re-shuffled only via
  // Task 5's shuffle control — PAINT-MODE.md §2 is LOCKED, never generate
  // a colour); paint draws a real scheme via the curated hue library.
  gamePaperOrder = PAPER_PALETTE.map((_, i) => i); // brief 25 Task 3 — 3, not DEFAULT_PALETTE's full 5
  gameChalkOrder = CHALK_PALETTE.map((_, i) => i);
  // groundHex pinned to Cream (GROUND_LIBRARY[0]) — brief 26 Task 3: the
  // reveal's ground is "the approved default from brief 21 / PAINT-MODE.md
  // §3," which is only true if the game's palette actually uses it. Through
  // brief 25 this call drew the ground randomly from GROUND_LIBRARY (the
  // shuffle handler already pinned it post-hoc, but the FIRST roll at game
  // start was never fixed) — invisible while paint played on the neutral
  // substrate, but it would have made Task 3's premise false the moment the
  // reveal made the ground visible. Mirrors the doodle's own brief-21 fix
  // (paintPalette above, same groundHex). Brief 31 Task 1c: scheme/
  // baseIndex pinned too, same reasoning as the doodle's own call — a
  // fresh game's opening palette is the approved reference, not a draw.
  gamePaintPalette = buildPalette(makeRng((gameSeed ^ 0x6A2F1C9E) >>> 0), {
    scheme: PAINT_DEFAULT_SCHEME, baseIndex: PAINT_DEFAULT_BASE_INDEX, groundHex: GROUND_LIBRARY[0].hex,
  });
  gamePaintArray = weightedPaletteArray(gamePaintPalette, (gameSeed ^ 0x6A2F1C9E) >>> 0);

  Object.keys(gameGroundCache).forEach(k => delete gameGroundCache[k]);
  gameCommittedStrokes = [];
  gameStrokeIndex = 0;
  gamePs = 0; gameAs = 0; gameLv = 1; gameAiSpd = 2.6;
  gamePaddleL = { y: (PAD_MIN + PAD_MAX) / 2 };
  gamePaddleR = { y: (PAD_MIN + PAD_MAX) / 2 };
  gamePrevMouseY = gameMouseY;

  rebuildGameStrokes();
  updateGameScoreUI();
  updateGamePalPill();
  spawnGameBall();
}

function stepGame() {
  if (gameServing) return; // short beat — ball not moving yet, nothing to advance

  // Left paddle: mouse-driven. padVelL is this frame's RAW mouse-Y delta
  // (before clamping) — matching root index.html's update(), not
  // simulate.js's tVirtual stand-in — because sweptHit's paddle-velocity
  // spin transfer is a core physics behaviour, not a detail.
  const padVelL = gameMouseY - gamePrevMouseY;
  gamePrevMouseY = gameMouseY;
  gamePaddleL.y = Math.max(PAD_MIN, Math.min(PAD_MAX, gameMouseY - PH / 2));

  // Right paddle: AI, via the engine's real updatePaddleAI, fed REAL
  // wall-clock time (Date.now()) rather than simulate.js's tVirtual —
  // tVirtual/PHASE_OFFSET_L/REACTION_DELAY_FRAMES exist only for
  // simulate.js's headless player STAND-IN (no wall clock, no human
  // input) and do not belong in the live game, which has both. Not "fixed"
  // to tVirtual — this is the deliberate, documented choice.
  const targetR = pickTargetY([gameBall], 'R');
  updatePaddleAI(gamePaddleR, targetR, gameAiSpd, Date.now(), 0);

  const events = advanceBall(gameBall, gamePaddleL, gamePaddleR, padVelL, gamePhysRng);
  const hadHitEvent = events.length > 0; // Task 6 — splatter must never fire on the same frame as a hit
  events.forEach(ev => {
    commitGameStroke(gameBall.pts, gameBall.wt, gameBall.op, ev.type);
    gamePaintTracker.startTrail(gameBall, gameBall.x, gameBall.y);
    // Brief 27 Task 2 — fired INSIDE the branch for this exact event type,
    // in the same forEach that already commits strokes. The protected
    // rule (root CLAUDE.md §4): chalk SFX fires exactly once per paddle
    // hit, here, never on a frame clock — advanceBall's typed event array
    // is what makes that free, there is nothing to debounce.
    if (ev.type === 'paddleHit') {
      sndScratch(); sndChalk();
      flashPaddle(ev.side === 'L' ? gamePaddleLEl : gamePaddleREl); // left flashes on a left hit, right on a right hit, never both
    } else if (ev.type === 'wallHit') {
      sndThud();
    }
  });
  gamePaintTracker.appendPoint(gameBall, gameBall.x, gameBall.y);

  if (gameBall.pts.length > 500) {
    commitGameStroke(gameBall.pts, gameBall.wt, gameBall.op, 'overflow');
    gameBall.pts = gameBall.pts.slice(-4);
  }

  // one ball: ballBall's collide-event branch is unreachable today (MAX_B
  // is 1), but the return value is still consumed for real — see
  // sndCollide's own comment for why this is deliberate, not dead code.
  const collideEvents = ballBall([gameBall], gamePhysRng);
  collideEvents.forEach(() => sndCollide()); // brief 27 Task 2

  if (gameBall.x < -30 || gameBall.x > W + 30) {
    const rightMissed = gameBall.x < -30; // ball passed the left edge -> right/AI scores
    const isGameEnd = rightMissed ? (gameAs + 1 >= WIN) : (gamePs + 1 >= WIN);
    if (gameBall.pts.length >= 2) {
      commitGameStroke(gameBall.pts, gameBall.wt, gameBall.op, isGameEnd ? 'gameEnd' : 'score');
    }
    if (rightMissed) gameAs++; else gamePs++;
    updateGameScoreUI();
    sndPoint(); // brief 27 Task 2 — every point, win or not, matching root's own unconditional call site
    checkGameLevel();
    flashGameFrame('canvas-glow-point', 900); // brief 27 Task 4 / brief 28 Task 5e — a point scored, either side

    if (gamePs >= WIN || gameAs >= WIN) {
      gameStrokesAlpha = 1.0; // Task 4 — full strength at game end, one-line change, no re-render
      sndGameOver(); flashGameFrame('canvas-glow-gameover', 1400); // brief 27 Task 6 / brief 28 Task 5e — fires on the final frame, held long enough to decay with the bell
      // One rng draw, seeded off this game — same reproducibility contract
      // as everything else (brief 26 Task 5): identical seed -> identical
      // haiku, so the share screen (brief 28) can show the same piece twice.
      const quoteRng = makeRng((gameSeed ^ 0x48414B55) >>> 0); // 'HAKU'
      gameLastEndedStrokes = {
        strokes: gameCommittedStrokes.slice(),
        splatterMarks: gameSplatterMarks.slice(), // {mark, afterStrokes} — see maybeEmitSplatter
        seed: gameSeed,
        surface: currentSurface,
        paintGroundHex: gamePaintPalette.ground, // Cream by default (Task 3) — captured here since gamePaintPalette itself gets replaced by the next startGame()
        resolvedPalette: gamePalPillHexesFor(currentSurface), // brief 29 Task 1 — the 3 actual stroke hexes (post any shuffle), captured now for the same reason as paintGroundHex above
        quote: QUOTES[Math.floor(quoteRng() * QUOTES.length)],
      };
      setScreen('results');
      startReveal(); // brief 26 — builds ground, resets the scrubber, runs the reveal animation
      return;
    }

    gameServing = true;
    serveDotEl.hidden = false;
    setTimeout(() => { if (screenState === 'playing') spawnGameBall(); }, 550); // brief serve beat — a rally game, not a menu
    return; // a miss this frame — no splatter (see maybeEmitSplatter's call site below)
  }

  // Task 6 — live splatter, paint only, mid-flight only: this line is only
  // reached on a frame with no hit event (checked above) and no miss (the
  // block above always returns before here on a miss) — exactly "between
  // bounces, where the ball actually is," never on a boundary contact.
  if (currentSurface === 'paint' && !hadHitEvent) maybeEmitSplatter();
}

function updateGamePaddleDOM() {
  gamePaddleLEl.style.top = gamePaddleL.y + 'px';
  gamePaddleREl.style.top = gamePaddleR.y + 'px';
}

function drawGameFrame() {
  const ctx = gameCanvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  // Task 4 — composite order: ground opaque, committed strokes at the
  // current dim/full alpha, live stroke at full, ball on top. Reset
  // globalAlpha explicitly after the strokes layer so the live stroke and
  // ball never inherit the dim value.
  ctx.globalAlpha = 1.0;
  ctx.drawImage(getGameGround(currentSurface), 0, 0); // no filter — see chalk decision, brief 22 Task 4
  ctx.globalAlpha = gameStrokesAlpha;
  ctx.drawImage(gameStrokesCv, 0, 0);
  ctx.globalAlpha = 1.0;

  if (!gameServing && gameBall.pts.length > 1) {
    // in-flight stroke: raw (unjittered) pts — jitter is a commit-time
    // effect, same as the doodle. Paint only (brief 24 Task 3): trim the
    // last PAINT_BALL_GAP px so the ball sits in clear space ahead of its
    // own ink, instead of brief 23's taper.
    const livePts = currentSurface === 'paint' ? trimStrokeForGap(gameBall.pts, PAINT_BALL_GAP) : gameBall.pts;
    if (livePts && livePts.length > 1) {
      renderGameStrokeAs(ctx, currentSurface, livePts, gameBall.wt, gameBall.op, gameStrokeIndex);
    }
  }
  if (!gameServing) {
    // Brief 24 Task 3: solid black (INK_HEX) in paint mode, unmistakable
    // against ink of any stroke colour or width; paper/chalk keep the
    // stroke-coloured ball, unchanged.
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = currentSurface === 'paint' ? INK_HEX : gameColourFor(currentSurface, gameStrokeIndex);
    ctx.beginPath();
    ctx.arc(gameBall.x, gameBall.y, BR * 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  updateGamePaddleDOM();
}

function gameLoop() {
  if (screenState === 'playing') {
    stepGame();
    drawGameFrame();
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// ── Task 5 — shuffle. Re-rolls the palette AND re-renders the whole
// painting through the new colours (never just the next stroke onward —
// that produces a two-palette painting and reads as broken). Paint draws
// a genuinely new scheme; paper/chalk re-roll the assignment ORDER, never
// the hexes (PAINT-MODE.md §2, LOCKED). Entropy comes from Date.now(), not
// Math.random() — Task 6 keeps that to exactly the one line in
// startGame(); a shuffle click is a live UI action, not part of the
// reproducible physics/render stream, but it still doesn't need a second
// raw-random call to get fresh entropy each click. Measured cost is
// logged to the console — see the session report for the number.
let shuffleNonce = 0;
pgShuffleEl.addEventListener('click', (e) => {
  e.stopPropagation();
  const shuffleSeed = (Date.now() ^ (shuffleNonce++)) >>> 0;
  const shuffleRng = makeRng(shuffleSeed);
  const t0 = performance.now();
  if (currentSurface === 'paint') {
    // Brief 31 Task 1c — shuffle only ever lands on triadic or split-
    // complementary now. This draw replaces the one buildPalette would
    // have made internally for scheme when opts.scheme is omitted (same
    // rng, same single draw), just over PAINT_SHUFFLE_SCHEMES's 2 options
    // instead of all 4 SCHEMES — baseIndex is still left to buildPalette's
    // own draw, so which hues land is still fully random, only the harmony
    // RULE is constrained.
    const shuffleScheme = PAINT_SHUFFLE_SCHEMES[Math.floor(shuffleRng() * PAINT_SHUFFLE_SCHEMES.length)];
    gamePaintPalette = buildPalette(shuffleRng, { scheme: shuffleScheme, groundHex: gamePaintPalette.ground }); // ground fixed — not part of shuffle
    gamePaintArray = weightedPaletteArray(gamePaintPalette, shuffleSeed);
  } else if (currentSurface === 'chalk') {
    shuffleArrayInPlace(gameChalkOrder, shuffleRng);
  } else {
    shuffleArrayInPlace(gamePaperOrder, shuffleRng);
  }
  rebuildGameStrokes(); // restyle the WHOLE painting — committed strokes keep geometry, only colour changes
  updateGamePalPill();
  const ms = performance.now() - t0;
  console.log(`[brief 22 Task 5] pal-pill shuffle re-render: ${ms.toFixed(1)}ms — ${gameCommittedStrokes.length} strokes, ${currentSurface}`);
});

// ── Task 7 — restart and mute ──────────────────────────────────────────
// Brief 28 Task 2 — home: idle, armed, surface selector already showing.
// The only playing-screen control that leaves the game; restart (below)
// stays an immediate same-surface replay.
document.getElementById('pg-home').addEventListener('click', () => {
  goToIdleArmed();
});
document.getElementById('pg-restart').addEventListener('click', () => {
  // Fresh seed, cleared canvas, score 0-0, level 1, SAME surface — does
  // not return to idle. startGame() already does exactly this.
  startGame();
});
// Brief 25 Task 2 — two real icon states, plus aria-pressed/aria-label kept
// honest for a screen reader, not just the eye.
const pgMuteBtn = document.getElementById('pg-mute');
const pgMuteIconUnmuted = document.getElementById('pg-mute-icon-unmuted');
const pgMuteIconMuted = document.getElementById('pg-mute-icon-muted');
// Brief 28 Task 1 — the real bug behind three reports and two "fixes":
// `hidden` is an IDL property defined on HTMLElement. <svg> is an
// SVGElement, which inherits from Element, not HTMLElement — it has no
// `.hidden` property. `svgEl.hidden = x` was silently creating a plain JS
// expando and never touching the `hidden` ATTRIBUTE, which is what the CSS
// rule (`.icon-pill svg[hidden]`) actually matches on. The icon looked
// right on load only because `hidden` was hand-written into the markup.
// toggleAttribute works on any element, HTML or SVG.
function updateMuteButton() {
  pgMuteIconUnmuted.toggleAttribute('hidden', muted);
  pgMuteIconMuted.toggleAttribute('hidden', !muted);
  pgMuteBtn.setAttribute('aria-pressed', String(muted));
  pgMuteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
}
pgMuteBtn.addEventListener('click', () => {
  muted = !muted;
  if (muted) stopBGM(); else startBGM();
  updateMuteButton();
});

/* ════════════════════════════════════════════════════════════════════════
   BRIEF 26 — RESULTS / REVEAL SCREEN. Everything below reads the game-end
   handoff (gameLastEndedStrokes, set in stepGame's win branch) and never
   touches the live game's own state (gameCommittedStrokes/gameStrokesCv
   get reset by the NEXT startGame() call, independently of this screen).
   ════════════════════════════════════════════════════════════════════════ */

const resultsGroundCanvas = document.getElementById('results-ground-canvas');
const resultsStrokesCanvas = document.getElementById('results-strokes-canvas');
const resultsGroundCx = resultsGroundCanvas.getContext('2d');
const resultsStrokesCx = resultsStrokesCanvas.getContext('2d');
const resultsHaikuEl = document.getElementById('results-haiku');
const timelineTrackEl = document.getElementById('timeline-track');
const timelineFillEl = document.getElementById('timeline-fill');
const timelineThumbEl = document.getElementById('timeline-thumb');

// Set once per reveal by startReveal(), read by the scrubber.
let resultsData = null; // { strokes, splatterMarks, surface, groundCv } — no `blotches` (brief 31 Task 2a removed them)

// Forces a CSS animation to restart from its beginning — results can be
// shown many times in a session (one per game), and simply re-adding a
// class that's already applied does not replay a finished animation.
// Standard technique: clear it, force a reflow, put it back.
function restartAnimation(el, className) {
  el.classList.remove(className);
  void el.offsetWidth; // reflow — without this the remove+add coalesce and nothing replays
  el.classList.add(className);
}

// Brief 26 Task 3 — the reveal ground. Paint only; paper/chalk reuse the
// SAME cached ground they played on (getGameGround, brief 22 Task 4) since
// their reveal has no wipe and no ground change at all. Plain mode only
// (buildPaintSurface) — patches mode is out of scope this brief, logged in
// BACKLOG.md. Seeded off the game (PAINT-MODE.md §3.1's reproducibility
// requirement): the lab's own equivalent call (art-lab.html) reuses the
// RAW seed with no salt for plain mode specifically; this file salts every
// stream against the seed it's ultimately derived from (DOODLE_SEED/
// gameSeed) so no two streams ever draw the identical sequence — kept that
// convention here rather than matching the lab's literal call shape.
function buildResultsGroundCv(surface, seed, groundHex) {
  if (surface !== 'paint') return getGameGround(surface);
  const rng = makeRng((seed ^ 0x52474E44) >>> 0); // 'RGND'
  return buildPaintSurface(W, H, rng, groundHex);
}

// Brief 26 Task 6 — rebuilds the strokes canvas for a given stroke count
// (the scrubber's position). Always the SAME renderGameStrokeAs/
// renderSplatterMark functions used live and at brief 24's build — never a
// second algorithm, per this file's standing invariant.
//
// Splatter marks are interleaved at their ORIGINAL chronological position
// (matching `afterStrokes`, not drawn as one batch after all strokes).
// This isn't cosmetic: paint is opaque, so wherever a mark landed and a
// LATER stroke then crossed over the same pixels, the live rally shows the
// stroke on top — a genuinely different result than dumping every mark on
// top of the finished painting. Verified by pixel-diffing this function's
// output against gameStrokesCv's actual live pixels for the same stroke
// set: interleaved is 0 pixels different; drawing all splatter last (the
// first version of this function) was ~16-19% of the canvas different on
// a real rally.
//
// Brief 31 Task 2a — blotches removed entirely ("reads as random rather
// than composed"). buildIntersectionBlotches/renderBlotchCluster are no
// longer imported or called anywhere in this file; the engine functions
// themselves are untouched (splatter.js is unchanged — the brief is
// explicit that this is a call-site removal, not a deprecation).
function renderResultsStrokes(count) {
  resultsStrokesCx.clearRect(0, 0, W, H);
  let splatterIdx = 0;
  function flushSplatterUpTo(n) {
    while (splatterIdx < resultsData.splatterMarks.length && resultsData.splatterMarks[splatterIdx].afterStrokes <= n) {
      renderSplatterMarkPaint(resultsStrokesCx, resultsData.splatterMarks[splatterIdx].mark);
      splatterIdx++;
    }
  }
  flushSplatterUpTo(0); // marks that fired before the first stroke ever committed
  resultsData.strokes.slice(0, count).forEach((st, i) => {
    renderGameStrokeAs(resultsStrokesCx, resultsData.surface, st.pts, st.wt, st.op, st.index);
    flushSplatterUpTo(i + 1);
  });
}

// Brief 31 Task 4 — timeline opens at 70%, not the full painting. A
// finished piece reads a little sparser on arrival; pulling the scrubber
// right visibly adds to it, which is the point of having a scrubber at
// all. Save and share are unaffected — both read whatever the scrubber
// currently shows, same as before.
const TIMELINE_DEFAULT_FRACTION = 0.70;
function updateTimelineUI(count) {
  const total = resultsData.strokes.length;
  const pct = total > 0 ? (count / total) * 100 : 100;
  timelineFillEl.style.width = `${pct}%`;
  timelineThumbEl.style.left = `calc(${pct}% - 8px)`;
  timelineTrackEl.setAttribute('aria-valuemax', String(total));
  timelineTrackEl.setAttribute('aria-valuenow', String(count));
  renderResultsStrokes(count);
}

// Brief 26 Task 2 — entry point, called once from stepGame's win branch
// right after setScreen('results'). Builds everything the reveal needs
// from gameLastEndedStrokes, draws the default (70%, Task 4) painting
// once, and triggers the reveal animations. The scrubber (below) can
// rebuild resultsStrokesCx again later at the user's request; that is a
// distinct, explicit, user-driven action — not part of the reveal
// transition itself.
function startReveal() {
  const h = gameLastEndedStrokes;
  if (!h) return;

  resultsData = {
    strokes: h.strokes,
    splatterMarks: h.splatterMarks,
    surface: h.surface,
    groundCv: buildResultsGroundCv(h.surface, h.seed, h.paintGroundHex),
  };

  resultsGroundCx.clearRect(0, 0, W, H);
  resultsGroundCx.drawImage(resultsData.groundCv, 0, 0);
  updateTimelineUI(Math.round(resultsData.strokes.length * TIMELINE_DEFAULT_FRACTION)); // brief 31 Task 4 — was 100%

  resultsHaikuEl.textContent = h.quote;

  // Reveal animations — Task 2's specced timings, verbatim. Ground wipe:
  // paint only (paper/chalk keep their ground static, already correct from
  // play — no class, no animation, nothing to reset). Strokes-to-full,
  // haiku and post-row: all three surfaces, every reveal.
  resultsGroundCanvas.classList.remove('reveal-wipe');
  if (h.surface === 'paint') restartAnimation(resultsGroundCanvas, 'reveal-wipe');

// ── Task 6 — scrubber interaction ──────────────────────────────────────
// position -> stroke count. Pointer (drag + click-to-seek) and keyboard
// (arrow keys step one stroke, Home/End jump to the ends) — no custom
// focus ring, DESIGN.md defines none and this isn't the brief to invent one.
function fractionFromPointerX(clientX) {
  const rect = timelineTrackEl.getBoundingClientRect();
  const frac = (clientX - rect.left) / rect.width;
  return Math.max(0, Math.min(1, frac));
}
function scrubToFraction(frac) {
  if (!resultsData) return;
  const total = resultsData.strokes.length;
  updateTimelineUI(Math.round(frac * total));
}
let scrubbing = false;
timelineTrackEl.addEventListener('pointerdown', (e) => {
  scrubbing = true;
  timelineTrackEl.setPointerCapture(e.pointerId);
  timelineTrackEl.focus();
  scrubToFraction(fractionFromPointerX(e.clientX));
});
timelineTrackEl.addEventListener('pointermove', (e) => {
  if (scrubbing) scrubToFraction(fractionFromPointerX(e.clientX));
});
timelineTrackEl.addEventListener('pointerup', () => { scrubbing = false; });
timelineTrackEl.addEventListener('keydown', (e) => {
  if (!resultsData) return;
  const total = resultsData.strokes.length;
  const current = Number(timelineTrackEl.getAttribute('aria-valuenow')) || 0;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); updateTimelineUI(Math.min(total, current + 1)); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); updateTimelineUI(Math.max(0, current - 1)); }
  else if (e.key === 'Home') { e.preventDefault(); updateTimelineUI(0); }
  else if (e.key === 'End') { e.preventDefault(); updateTimelineUI(total); }
});

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundedRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Brief 26 Task 7, refactored brief 29 to be reusable — share's DOWNLOAD PNG
// (Task 3: "reuses the brief-26 exporter at full resolution") needs the
// exact same output, from whatever ground/strokes canvases it has (its own
// full-res offscreen pair, not results' — see the share section below),
// not necessarily the live game's own artwork.
async function exportArtworkPNG(groundCanvas, strokesCanvas, haikuText, seed) {
  const S = 2, PAD = 32, quoteH = 100;
  const outW = (W + PAD * 2) * S, outH = (H + PAD * 2 + quoteH) * S;
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  const oc = out.getContext('2d');

  oc.fillStyle = '#383838';
  oc.fillRect(0, 0, outW, outH);

  const sx = PAD * S, sy = PAD * S, sw = W * S, sh = H * S, r = 48 * S; // border-radius x2, DESIGN.md §11
  oc.save();
  roundedRectPath(oc, sx, sy, sw, sh, r);
  oc.fillStyle = '#FFF5E5'; oc.fill(); // cream fallback beneath the ground/artwork, matches canvas-area base
  oc.clip();
  oc.drawImage(groundCanvas, sx, sy, sw, sh);
  oc.drawImage(strokesCanvas, sx, sy, sw, sh);
  oc.restore();

  oc.font = `italic ${14 * S}px "DM Serif Display", serif`;
  oc.fillStyle = '#C5C5C5';
  oc.textAlign = 'center';
  oc.textBaseline = 'middle';
  oc.fillText(haikuText, outW / 2, (PAD + H + 22) * S);

  const logoImg = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SAVE_LOGO_SVG));
  const logoW = 98 * S, logoH = 19 * S; // same reduced size as playing/results headers
  oc.save();
  oc.globalAlpha = 0.55; // subtle, matching §11's translucent text treatment (was rgba(...,0.35) on white text; SVG's own cream needs a touch more to read the same weight)
  oc.drawImage(logoImg, outW / 2 - logoW / 2, (PAD + H + 60) * S - logoH / 2, logoW, logoH);
  oc.restore();

  const a = document.createElement('a');
  a.download = `zen-pong-${seed}.png`; // seed, not a timestamp (Task 7)
  a.href = out.toDataURL('image/png');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

document.getElementById('btn-save').addEventListener('click', () => {

  exportArtworkPNG(resultsGroundCanvas, resultsStrokesCanvas, resultsHaikuEl.textContent, gameLastEndedStrokes.seed);

/* ════════════════════════════════════════════════════════════════════════
   BRIEF 29 — SHARE. There is no server (v3 is a static file on GitHub
   Pages), so a shared artwork has to travel inside the URL fragment
   (#a=…) or not travel at all — a fragment is never sent to the server,
   so GitHub Pages has no length opinion on it.

   Decision (put to Shivang explicitly, see PROJECT-LOG.md): transmit the
   ARTWORK, not a replay. A seed-plus-input replay would be smaller, but
   depends on Math.sin/cos/atan2 returning bit-identical results across
   browser engines, which no spec guarantees — a divergence there produces
   a DIFFERENT painting, silently, not a glitch. Sending the marks
   themselves has no such failure mode.

   The bar is VISUALLY INDISTINGUISHABLE, not pixel-identical — the
   recipient never saw the original, so a mark three pixels over is not an
   error. Setting that bar deliberately is what keeps the payload small
   enough to fit in a link: decimate, delta-encode, compress.
   ════════════════════════════════════════════════════════════════════════ */

// ── Quantisation ranges — the same fixed ranges every stroke/mark on this
// surface is already drawn from (mkBall's wt/op, the width-profile system's
// GAME_PAINT_WIDTH_VAR_MIN/MAX, splatter's own size constants). Reusing
// them for quantisation, rather than inventing new ones, is what keeps a
// decoded stroke visually identical to the one that was actually drawn.
const SHARE_WT_MIN = 1.0, SHARE_WT_MAX = 2.4;   // mkBall's own wt range, every mkBall call site
const SHARE_OP_MIN = 0.50, SHARE_OP_MAX = 0.68; // mkBall's own op range
const SHARE_IRREG_MIN = 0.12, SHARE_IRREG_MAX = 0.25; // buildLiveSplatterMark's irregularity range
const SHARE_SAT_OFFSET_RANGE = 120; // px — generous bound on a flung mark's satellite offset (worst case ~98px, see buildLiveSplatterMark)
const SHARE_SAT_R_MAX = 6; // px — generous bound on satellite radius (worst case ~4.3px)
const SHARE_DECIMATE_N = 5; // keep every 5th raw point — was 3, raised after measurement showed paint routinely over the 8KB ceiling; see PROJECT-LOG.md

function quantByte(v, min, max) {
  const t = Math.max(0, Math.min(1, (v - min) / (max - min)));
  return Math.round(t * 255);
}
function dequantByte(b, min, max) {
  return min + (b / 255) * (max - min);
}
// Signed variant for values centred on 0 (satellite offsets) — maps
// [-range,range] onto a plain signed byte via the writer's own i8(), no
// separate zero-point bookkeeping at each call site.
function quantSignedByte(v, range) {
  const t = Math.max(-1, Math.min(1, v / range));
  return Math.round(t * 127);
}
function dequantSignedByte(b, range) {
  return (b / 127) * range;
}

// ── Growable byte writer / cursor reader — no library, this is just array
// bookkeeping. Multi-byte ints are little-endian throughout.
function makeByteWriter() {
  const bytes = [];
  return {
    u8(v) { bytes.push(v & 0xFF); },
    i8(v) { bytes.push(v < 0 ? v + 256 : v); }, // -128..127 -> 128..255 stored, read back signed
    u16(v) { bytes.push(v & 0xFF, (v >> 8) & 0xFF); },
    bytes() { return Uint8Array.from(bytes); },
  };
}
function makeByteReader(view) {
  let pos = 0;
  return {
    get remaining() { return view.length - pos; },
    u8() { return view[pos++]; },
    i8() { const v = view[pos++]; return v > 127 ? v - 256 : v; },
    u16() { const v = view[pos] | (view[pos + 1] << 8); pos += 2; return v; },
  };
}

// ── Task 1 — encode. Builds the RAW (uncompressed) byte payload from a
// gameLastEndedStrokes-shaped handoff. Format:
//   [flags:1][surface:1][seed:4][palette: 1 or 4][strokeCount:2]
//   per stroke: [colourIdx:1][wt:1][op:1][pointCount:1][points...]
//   [splatterCount:1] per mark: [type:1][x:2][y:2][colourIdx:1][...]
// See the surrounding functions for exactly what each block contains —
// kept close to the reader that has to agree with it byte for byte.
const SHARE_FORMAT_VERSION = 1;
function encodeArtworkPayload(h) {
  const w = makeByteWriter();

  w.u8(SHARE_FORMAT_VERSION & 0x0F); // bit 4 (compressed flag) is set by compressToFragment, after this
  const surfaceIdx = { paper: 0, chalk: 1, paint: 2 }[h.surface];
  w.u8(surfaceIdx);
  w.u16(h.seed & 0xFFFF); w.u16((h.seed >>> 16) & 0xFFFF); // uint32 as two u16s — u16() is already LE

  // Palette — brief 29 Task 1 names "scheme index, base index, ground
  // index" (3 bytes) for paint. Deliberately NOT what's encoded here: the
  // resolved ACCENT hexes are re-run through buildPalette's own seeded
  // retry loop (the accent-quality guard, MIN_ACCENT_DE) on a fresh rng,
  // and if the original run needed even one retry to pass that guard
  // (~8% of base indices do, per palette.js's own comment), replaying
  // scheme+baseIndex+seed alone reproduces a DIFFERENT accent permutation
  // than the one actually shown — the rng draws consumed by the failed
  // attempt(s) never happened in the replay. That is not "not pixel-
  // identical", it is a different dominant colour. Transmitting the 3
  // resolved accents directly (as HUE_LIBRARY indices, always valid since
  // every accent hex is drawn from that fixed 12-colour library) costs one
  // extra byte and is immune to it by construction — no rng replay at all.
  // Ground is included for robustness even though it is currently always
  // Cream (brief 26 Task 3 pins it, and shuffle never changes it) — cheap
  // insurance against that ever becoming a real control (BACKLOG.md).
  if (h.surface === 'paint') {
    const accentHexes = h.resolvedPalette; // 3 hexes, A/B/C order — see gamePalPillHexesFor
    accentHexes.forEach(hex => {
      const idx = HUE_LIBRARY.findIndex(hue => hue.hex === hex);
      w.u8(idx >= 0 ? idx : 0);
    });
    const groundIdx = GROUND_LIBRARY.findIndex(g => g.hex === h.paintGroundHex);
    w.u8(groundIdx >= 0 ? groundIdx : 0);
  } else {
    // paper/chalk: pack the 3-element resolved palette as indices into the
    // FIXED 3-hex source palette (PAPER_PALETTE / CHALK_PALETTE) — this is
    // exactly gamePaperOrder/gameChalkOrder (the shuffle state), captured
    // via resolvedPalette rather than re-deriving anything.
    const sourcePalette = h.surface === 'chalk' ? CHALK_PALETTE : PAPER_PALETTE;
    let packed = 0;
    h.resolvedPalette.forEach((hex, slot) => {
      const idx = Math.max(0, sourcePalette.indexOf(hex));
      packed |= (idx & 0x3) << (slot * 2);
    });
    w.u8(packed);
  }

  w.u16(h.strokes.length);
  h.strokes.forEach(st => {
    const colourIdx = Math.max(0, h.resolvedPalette.indexOf(gameColourFor(h.surface, st.index)));
    w.u8(colourIdx);
    w.u8(quantByte(st.wt, SHARE_WT_MIN, SHARE_WT_MAX));
    w.u8(quantByte(st.op, SHARE_OP_MIN, SHARE_OP_MAX));

    // Decimate: keep every Nth raw point, plus ALWAYS the first and last
    // (so a stroke never visibly falls short of where it actually ended).
    const raw = st.pts;
    const kept = [];
    for (let i = 0; i < raw.length; i += SHARE_DECIMATE_N) kept.push(i);
    if (kept[kept.length - 1] !== raw.length - 1) kept.push(raw.length - 1);
    w.u8(kept.length);

    let prev = null;
    kept.forEach(i => {
      const p = raw[i];
      const x = Math.round(p.x), y = Math.round(p.y);
      if (prev === null) {
        w.u16(Math.max(0, Math.min(65535, x)));
        w.u16(Math.max(0, Math.min(65535, y)));
      } else {
        const dx = x - prev.x, dy = y - prev.y;
        if (dx < -127 || dx > 127 || dy < -127 || dy > 127) {
          w.i8(-128); // escape — next 4 bytes are an absolute position, not a delta
          w.u16(Math.max(0, Math.min(65535, x)));
          w.u16(Math.max(0, Math.min(65535, y)));
        } else {
          w.i8(dx); w.i8(dy);
        }
      }
      prev = { x, y };
      // Paint widths: the baked per-point .w, quantised to one byte.
      // Re-deriving it from the profile on decode would need the STROKE'S
      // ORIGINAL arc length, which decimation itself changes — a byte a
      // point is cheaper than reproducing that inaccuracy. Not sent for
      // paper/chalk at all (renderStroke/renderChalkStroke never read .w).
      if (h.surface === 'paint') {
        w.u8(quantByte(p.w != null ? p.w : 1, GAME_PAINT_WIDTH_VAR_MIN, GAME_PAINT_WIDTH_VAR_MAX));
      }
    });
  });

  // Splatter — brief 24's live splatter is emitted per-frame from a
  // probability check, so unlike the ground/blotches it is NOT
  // reproducible from the seed alone (Task 1's own "come free" list
  // explicitly does not include it). Sent explicitly; there are only ever
  // up to GAME_SPLATTER_CAP (10) of them.
  w.u8(h.splatterMarks.length);
  h.splatterMarks.forEach(({ mark }) => {
    w.u8(mark.type === 'flung' ? 1 : 0);
    w.u16(Math.max(0, Math.min(65535, Math.round(mark.x))));
    w.u16(Math.max(0, Math.min(65535, Math.round(mark.y))));
    // colour: 0=ink, 1/2/3=accent A/B/C — splatter's own colour weighting
    // (gameSplatterColorWeights) only ever picks from those 4, matching
    // resolvedPalette (accents) + INK_HEX.
    const paletteWithInk = [INK_HEX, ...h.resolvedPalette];
    w.u8(Math.max(0, paletteWithInk.indexOf(mark.colorHex)));
    if (mark.type === 'flung') {
      w.u8(quantByte(mark.dx, -1, 1));
      w.u8(quantByte(mark.dy, -1, 1));
      w.u8(quantByte(mark.headR, GAME_SPLATTER_HEAD_R_MIN, GAME_SPLATTER_HEAD_R_MAX));
      w.u8(quantByte(mark.length, GAME_SPLATTER_FLUNG_LEN_MIN, GAME_SPLATTER_FLUNG_LEN_MAX));
      w.u8(mark.satellites.length);
      mark.satellites.forEach(s => {
        w.i8(quantSignedByte(s.x - mark.x, SHARE_SAT_OFFSET_RANGE));
        w.i8(quantSignedByte(s.y - mark.y, SHARE_SAT_OFFSET_RANGE));
        w.u8(quantByte(s.r, 0, SHARE_SAT_R_MAX));
      });
    } else {
      w.u8(quantByte(mark.r, GAME_SPLATTER_DROP_R_MIN, GAME_SPLATTER_DROP_R_MAX));
      w.u8(quantByte(mark.irregularity, SHARE_IRREG_MIN, SHARE_IRREG_MAX));
      w.u8(quantByte(mark.seedAngle, 0, Math.PI * 2));
    }
  });

  return w.bytes();
}

// ── Task 1 — decode. The exact byte-for-byte inverse of
// encodeArtworkPayload, above — kept immediately below it so the two never
// drift apart. Receives the RAW payload: a flags byte with only the
// version nibble set. decodeFromFragment (below) has already resolved the
// compressed-flag bit and decompressed if needed, so this function never
// has to know compression exists at all — it always sees exactly the bytes
// encodeArtworkPayload produced.
//
// Task 4's "quiet fall-through" requirement is met by ONE big try/catch
// plus an explicit r.remaining bounds check before every multi-byte read:
// any malformed or truncated input returns null (never throws), and the
// caller (shareCurrentGame's counterpart at the bottom of this file) is
// the one place that logs a single console.warn. Never renders a partial
// artwork — a half-decoded painting shown as someone's finished piece
// would be worse than showing nothing.
function decodeArtworkPayload(bytes) {
  try {
    const r = makeByteReader(bytes);
    if (r.remaining < 2) return null;
    const flags = r.u8();
    if ((flags & 0x0F) !== SHARE_FORMAT_VERSION) return null; // unknown version — fall through to idle
    const surface = ['paper', 'chalk', 'paint'][r.u8()];
    if (!surface) return null;

    if (r.remaining < 4) return null;
    const seedLo = r.u16(), seedHi = r.u16();
    const seed = (seedLo | (seedHi << 16)) >>> 0;

    let resolvedPalette, paintGroundHex = null;
    if (surface === 'paint') {
      if (r.remaining < 4) return null;
      const accentIdx = [r.u8(), r.u8(), r.u8()];
      if (accentIdx.some(i => i >= HUE_LIBRARY.length)) return null;
      resolvedPalette = accentIdx.map(i => HUE_LIBRARY[i].hex);
      const groundIdx = r.u8();
      if (groundIdx >= GROUND_LIBRARY.length) return null;
      paintGroundHex = GROUND_LIBRARY[groundIdx].hex;
    } else {
      if (r.remaining < 1) return null;
      const packed = r.u8();
      const sourcePalette = surface === 'chalk' ? CHALK_PALETTE : PAPER_PALETTE;
      resolvedPalette = [0, 1, 2].map(slot => sourcePalette[(packed >> (slot * 2)) & 0x3] || sourcePalette[0]);
    }

    if (r.remaining < 2) return null;
    const strokeCount = r.u16();
    if (strokeCount > 20000) return null; // sanity ceiling — no real game gets close; catches a garbled length header

    const strokes = [];
    for (let si = 0; si < strokeCount; si++) {
      if (r.remaining < 4) return null;
      const colourIdx = r.u8();
      const colorHex = resolvedPalette[colourIdx] || resolvedPalette[0];
      const wt = dequantByte(r.u8(), SHARE_WT_MIN, SHARE_WT_MAX);
      const op = dequantByte(r.u8(), SHARE_OP_MIN, SHARE_OP_MAX);
      const pointCount = r.u8();
      if (pointCount < 1) return null;

      const pts = [];
      let prev = null;
      for (let pi = 0; pi < pointCount; pi++) {
        let x, y;
        if (prev === null) {
          if (r.remaining < 4) return null;
          x = r.u16(); y = r.u16();
        } else {
          if (r.remaining < 1) return null;
          const dx = r.i8();
          if (dx === -128) {
            if (r.remaining < 4) return null;
            x = r.u16(); y = r.u16();
          } else {
            if (r.remaining < 1) return null;
            const dy = r.i8();
            x = prev.x + dx; y = prev.y + dy;
          }
        }
        prev = { x, y };
        const pt = { x, y };
        if (surface === 'paint') {
          if (r.remaining < 1) return null;
          pt.w = dequantByte(r.u8(), GAME_PAINT_WIDTH_VAR_MIN, GAME_PAINT_WIDTH_VAR_MAX);
        }
        pts.push(pt);
      }
      strokes.push({ pts, wt, op, index: si, colorHex });
    }

    if (r.remaining < 1) return null;
    const splatterCount = r.u8();
    const paletteWithInk = [INK_HEX, ...resolvedPalette];
    const splatterMarks = [];
    for (let mi = 0; mi < splatterCount; mi++) {
      if (r.remaining < 6) return null;
      const type = r.u8() ? 'flung' : 'drop';
      const x = r.u16(), y = r.u16();
      const colourIdx = r.u8();
      const colorHex = paletteWithInk[colourIdx] || paletteWithInk[0];
      const mark = { type, x, y, colorHex };
      if (type === 'flung') {
        if (r.remaining < 5) return null;
        mark.dx = dequantByte(r.u8(), -1, 1);
        mark.dy = dequantByte(r.u8(), -1, 1);
        mark.headR = dequantByte(r.u8(), GAME_SPLATTER_HEAD_R_MIN, GAME_SPLATTER_HEAD_R_MAX);
        mark.length = dequantByte(r.u8(), GAME_SPLATTER_FLUNG_LEN_MIN, GAME_SPLATTER_FLUNG_LEN_MAX);
        const satCount = r.u8();
        mark.satellites = [];
        for (let ki = 0; ki < satCount; ki++) {
          if (r.remaining < 3) return null;
          const relX = dequantSignedByte(r.i8(), SHARE_SAT_OFFSET_RANGE);
          const relY = dequantSignedByte(r.i8(), SHARE_SAT_OFFSET_RANGE);
          mark.satellites.push({ x: x + relX, y: y + relY, r: dequantByte(r.u8(), 0, SHARE_SAT_R_MAX) });
        }
      } else {
        if (r.remaining < 3) return null;
        mark.r = dequantByte(r.u8(), GAME_SPLATTER_DROP_R_MIN, GAME_SPLATTER_DROP_R_MAX);
        mark.irregularity = dequantByte(r.u8(), SHARE_IRREG_MIN, SHARE_IRREG_MAX);
        mark.seedAngle = dequantByte(r.u8(), 0, Math.PI * 2);
      }
      splatterMarks.push(mark);
    }

    return { surface, seed, resolvedPalette, paintGroundHex, strokes, splatterMarks };
  } catch (e) {
    return null; // never throw to the caller — Task 4
  }
}

// ── Compression + URL-fragment framing. CompressionStream/
// DecompressionStream('deflate-raw') are a platform Streams API, not a
// library — holds the no-external-libraries rule. Falls back to plain
// (uncompressed) base64url if the API is missing, recorded in the
// compressed-flag bit so a decoder never has to guess which path was used.
//
// The flags byte MUST stay outside the compressed region. An earlier draft
// of this function compressed the whole raw payload — including its own
// leading flags/version byte — and then tried to OR the compressed-flag
// bit into compressedBytes[0] afterward. That's wrong: after compression,
// byte 0 of a deflate stream is whatever deflate's own internal
// representation happens to produce, not the original flags byte, so
// mutating it corrupts the stream without communicating anything, and a
// decoder would have no safe byte to read before deciding whether to
// decompress. Fix: split the flags byte off BEFORE compressing, compress
// only the remainder, and re-attach a (possibly flag-updated) COPY of the
// flags byte in front of whichever remainder — compressed or raw — actually
// got used.
const SHARE_COMPRESSED_FLAG = 0x10; // bit 4

function bytesToBase64Url(bytes) {
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToBytes(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
  const bin = atob(b64 + pad);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// Drains a TransformStream (Compression/DecompressionStream) fed with one
// chunk into a single concatenated Uint8Array. Both directions use the
// same shape, so one helper serves encode and decode alike.
async function streamThrough(stream, bytes) {
  const writer = stream.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const chunks = [];
  let total = 0;
  const reader = stream.readable.getReader();
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    total += value.length;
  }
  const out = new Uint8Array(total);
  let offset = 0;
  chunks.forEach(c => { out.set(c, offset); offset += c.length; });
  return out;
}

// rawBytes: encodeArtworkPayload's output. Returns the base64url string to
// go after '#a='. Async because CompressionStream is stream-based; never
// blocks the visible screen transition (see shareCurrentGame, below).
async function encodeToFragment(rawBytes) {
  const flagsByte = rawBytes[0];
  const rest = rawBytes.subarray(1);
  let finalFlags = flagsByte, finalRest = rest;
  if (typeof CompressionStream === 'function') {
    try {
      const compressed = await streamThrough(new CompressionStream('deflate-raw'), rest);
      if (compressed.length < rest.length) { // only worth it if it actually shrank
        finalFlags = flagsByte | SHARE_COMPRESSED_FLAG;
        finalRest = compressed;
      }
    } catch (e) { /* fall through to uncompressed — Task 1's documented fallback */ }
  }
  const out = new Uint8Array(1 + finalRest.length);
  out[0] = finalFlags;
  out.set(finalRest, 1);
  return bytesToBase64Url(out);
}

// fragmentValue: the string after '#a=' (already stripped of the prefix).
// Returns the RAW bytes decodeArtworkPayload expects, or null on any
// failure — base64 garbage, a missing DecompressionStream for a payload
// that needs it, or a corrupt deflate stream all fall through the same way.
async function decodeFromFragment(fragmentValue) {
  try {
    const bytes = base64UrlToBytes(fragmentValue);
    if (bytes.length < 1) return null;
    const flagsByte = bytes[0];
    const rest = bytes.subarray(1);
    if (!(flagsByte & SHARE_COMPRESSED_FLAG)) {
      const out = new Uint8Array(1 + rest.length);
      out[0] = flagsByte; out.set(rest, 1);
      return out;
    }
    if (typeof DecompressionStream !== 'function') return null; // compressed payload, no way to read it
    const decompressed = await streamThrough(new DecompressionStream('deflate-raw'), rest);
    const out = new Uint8Array(1 + decompressed.length);
    out[0] = flagsByte & ~SHARE_COMPRESSED_FLAG; // clear the flag — decodeArtworkPayload never sees it
    out.set(decompressed, 1);
    return out;
  } catch (e) {
    return null;
  }
}

function buildShareGround(surface, seed, paintGroundHex) {

function renderSharePage(decoded) {

  shareStrokesCx.clearRect(0, 0, shareStrokesCanvas.width, shareStrokesCanvas.height);

  const quoteRng = makeRng((decoded.seed ^ 0x48414B55) >>> 0); // 'HAKU'
  shareHaikuEl.textContent = QUOTES[Math.floor(quoteRng() * QUOTES.length)];

// Results -> SHARE. Encodes THIS game's own gameLastEndedStrokes, decodes
// it right back SYNCHRONOUSLY, and renders that decoded copy rather than
// gameLastEndedStrokes itself — so what the player sees on Screen 4 is
// byte-for-byte the same reconstruction a recipient's browser will
// produce (Task 3: "a true preview of what a recipient will see"), not
// merely "the same source data, presumably rendered the same way". The
// (async) compress-and-update-the-URL step runs afterward in the
// background and must never block the screen transition itself.
async function shareCurrentGame() {
  if (!gameLastEndedStrokes) return;
  const raw = encodeArtworkPayload(gameLastEndedStrokes);
  const decoded = decodeArtworkPayload(raw);
  if (!decoded) { console.warn('[share] own payload failed to decode — this should never happen'); return; }

  setScreen('share');
  renderSharePage(decoded);

  const fragment = await encodeToFragment(raw);
  history.replaceState(null, '', '#a=' + fragment);

  // Task 1 Verification: "Report the measured payload size per surface."
  console.log(`[share] ${gameLastEndedStrokes.surface}: ${raw.length}B raw -> ${fragment.length} base64url chars (${gameLastEndedStrokes.strokes.length} strokes, decimation N=${SHARE_DECIMATE_N})`);
}

// COPY LINK — brief 31 Task 5 rebuild. `location.href` at this point is
// already the full absolute URL including the `#a=…` fragment (written by
// shareCurrentGame's history.replaceState, or already present if this tab
// landed on someone else's link) — verified by pasting a copied link into
// a fresh browser tab, not just by reading this line, per the brief's own
// instruction. Label swaps to "Copied!" for 3s, no toast, no new component.
// Falls back to a hidden selectable input + execCommand('copy') if
// navigator.clipboard.writeText rejects (insecure context, permission
// denied) — "Copied!" only ever shows on an ACTUAL success, never
// optimistically before the fallback path is known to have worked.
function copyShareLinkFallback(text) {
  const input = document.createElement('input');
  input.value = text;
  input.style.position = 'fixed';
  input.style.top = '-1000px'; // off-screen, not display:none — execCommand needs it in the render tree to select
  input.style.opacity = '0';
  input.setAttribute('aria-hidden', 'true');
  document.body.appendChild(input);
  input.focus();
  input.select();
  input.setSelectionRange(0, input.value.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(input);
  return ok;
}
document.getElementById('btn-share-copy').addEventListener('click', (e) => {
  const btn = e.currentTarget;
  const original = btn.textContent;
  const showCopied = () => {
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 3000);
  };
  const hasClipboardAPI = navigator.clipboard && typeof navigator.clipboard.writeText === 'function';
  const tryFallback = () => { if (copyShareLinkFallback(location.href)) showCopied(); };
  if (hasClipboardAPI) {
    navigator.clipboard.writeText(location.href).then(showCopied).catch(tryFallback);
  } else {
    tryFallback();
  }
});

   Step A (attract): card only. First gesture (space/click/touchstart)
