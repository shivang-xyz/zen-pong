/* ════════════════════════════════════════════════════════════════════
   TASK 1 — screen-state machine. Three states only: idle / playing /
   results (root game + DESIGN.md §8). idle carries its own Step A/B
   sub-state (brief 18 Task 3) which is independent of the screen state.
   ════════════════════════════════════════════════════════════════════ */
const screens = {
  idle: document.getElementById('screen-idle'),
  playing: document.getElementById('screen-playing'),
  results: document.getElementById('screen-results'),
  share: document.getElementById('screen-share'), // brief 29 — the screens/setScreen machinery was already generic, no special-casing needed for a 4th
};
let screenState = 'idle';
function setScreen(next) {
  screenState = next;
  document.body.dataset.screen = next; // brief 25 Task 5 — scopes body's padding to the active screen (see the body[data-screen="playing"] CSS rule)
  Object.entries(screens).forEach(([k, el]) => { el.hidden = (k !== next); });
  fitScreenToViewport();
}

// ── Brief 30 Task 3 — mobile ────────────────────────────────────────────
// v3 has no touch paddle control at all (root has cv.addEventListener
// ('touchmove', ...); v3 only wires touchstart as a generic start-gesture
// — porting touchmove is real, separate work, backlogged for brief 31).
// That makes the detection question bigger than "narrow viewport": a
// tablet (iPad, 768-1024px) sits well above any reasonable pixel
// breakpoint, so a width-only check would let it through with no overlay
// and a paddle that never moves — silently unplayable, not just cramped.
// Raising the pixel breakpoint doesn't fix this without also blocking
// narrow DESKTOP windows, which must stay playable. Detect the actual
// capability instead of guessing from width:
function isTouchDevice() {
  // document.documentElement.clientWidth, not window.innerWidth — the
  // layout viewport width is what CSS media queries and actual rendering
  // are based on; innerWidth can disagree with it (scrollbar accounting,
  // and some emulated/embedded viewport contexts report it inflated by a
  // fixed zoom-like factor even though clientWidth stays correct).
  return document.documentElement.clientWidth <= 600 || matchMedia('(hover: none) and (pointer: coarse)').matches;
}

// The one flag every mobile decision (which mobile screen shows,
// scroll-lock, the spacebar gate below) reads. share is deliberately
// exempt — Task 3: "a shared link opened on a phone must still show the
// artwork... the overlay only blocking the game." The idle+
// landingWithSharePayload clause exists because screenState is still the
// literal 'idle' default in the gap between page load and the async
// decodeFromFragment/decodeArtworkPayload promise settling (brief 29's own
// flash-guard has already hidden #screen-idle by then, synchronously, but
// screenState itself doesn't flip to 'share' until decode succeeds) —
// without this clause a phone visitor on a real share link sees the gate
// flash on before their artwork appears.
function isMobileBlocked() {
  if (!isTouchDevice()) return false;
  if (screenState === 'share') return false;
  if (screenState === 'idle' && landingWithSharePayload) return false;
  return true;
}

// Brief 32 — replaces brief 30's updateMobileOverlay(). That version
// toggled a translucent card FLOATING OVER the still-fully-rendered
// desktop screen (pointer-events:all to stop clicks reaching it). This
// version shows a genuinely separate, dedicated screen and gives the
// desktop screens a REAL display:none (html.mobile-gate-active
// .screen/html.mobile-share-active .screen, CSS) — there is nothing left
// underneath to click through, so no pointer-events trick is needed.
// mobileShare is its own condition, not just "not blocked": Task 1 says
// BOTH mobile screens are single-fold/no-scroll, so the scroll lock now
// applies to isTouchDevice() as a whole, not just the blocked case.
function updateMobileScreens() {
  const gate = isMobileBlocked();
  const mobileShare = isTouchDevice() && screenState === 'share';
  document.documentElement.classList.toggle('mobile-gate-active', gate);
  document.documentElement.classList.toggle('mobile-share-active', mobileShare);
  // Neither screen is designed for landscape (both mockups are portrait-
  // only), and a rotated phone or a landscape-default iPad is a real,
  // easy-to-hit case, not an edge case. Locking scroll there — correct
  // for the designed portrait fold — turned out to make the primary
  // action (copy link) and, on share, the haiku/download/copy row
  // genuinely unreachable: content overflows the short viewport and
  // there is no way to scroll to it. Exempting landscape from the lock
  // trades "ugly, content pushed below an accessible scroll" for "content
  // literally cannot be reached" — verified both ways in a real
  // landscape viewport before choosing this.
  const locked = (gate || mobileShare) && !isLandscapeViewport();
  // Both html and body — iOS Safari's rubber-band scroll can leak past
  // overflow:hidden set on <html> alone.
  document.documentElement.style.overflow = locked ? 'hidden' : '';
  document.body.style.overflow = locked ? 'hidden' : '';
}

// Brief 25 Task 1 step 4 / Task 5's own fallback: for any viewport still too
// short after Task 5's tightened rhythm, scale the WHOLE visible .screen
// uniformly — never one axis, never one child, which is exactly the
// non-uniform-compression bug this brief fixes elsewhere (.stage's removed
// max-width:100%). Reset any existing transform before measuring, so a
// shrink is never measured against an already-shrunk box. `available`
// subtracts body's own top+bottom padding (outside the .screen element,
// so getBoundingClientRect() on the screen doesn't include it) from the
// viewport height, then scales the screen to fit what's left.
//
// Mobile no longer needs any of this (brief 32) — the two mobile screens
// are fluid CSS (width:100%, aspect-ratio:1000/630), not the desktop's
// fixed-1000px layout scaled down by a JS transform, so there is nothing
// left to compute here for a touch visitor. updateMobileScreens() picks
// the right screen; this function returns immediately after, on purpose —
// not relying on getBoundingClientRect() happening to return a 0x0 rect
// for a real-display:none desktop .screen the way a deleted branch would.
function fitScreenToViewport() {
  const visible = screens[screenState];
  if (!visible) return;
  visible.style.transform = '';
  visible.style.transformOrigin = '';
  visible.style.marginBottom = '';

  updateMobileScreens();
  if (isTouchDevice()) return;

  // Brief 28 Task 4 — results deliberately does NOT get the fit clamp: it's
  // a resting screen, allowed to be taller than the viewport and scroll.
  // The three style resets above still run (clears any transform left over
  // from a PREVIOUS screen, since scale()/margin are set directly on
  // whichever `.screen` was visible then, not on results specifically —
  // but results itself never had them applied, so this is a harmless no-op
  // for it) before returning, so nothing lingers from a stale playing/idle
  // state should DOM order or timing ever change.
  if (screenState === 'results') return;
  const bodyStyle = getComputedStyle(document.body);
  const vPad = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
  const available = window.innerHeight - vPad;
  const rect = visible.getBoundingClientRect();
  if (available > 0 && rect.height > available) {
    const scale = available / rect.height;
    visible.style.transform = `scale(${scale})`;
    visible.style.transformOrigin = 'top center';
    // transform:scale() is paint-only — it does NOT shrink the element's
    // own contribution to document flow/scrollHeight, so without this the
    // page would still show a scrollbar for space that's visually empty.
    // A negative bottom margin pulls the next box up by exactly the
    // height the scale removed, so the flow height matches what's drawn.
    visible.style.marginBottom = `${-(rect.height * (1 - scale))}px`;
  }
}
window.addEventListener('resize', fitScreenToViewport);
document.body.dataset.screen = 'idle'; // initial state — setScreen() isn't called for the starting idle screen
fitScreenToViewport();

/* ════════════════════════════════════════════════════════════════════
   TASK 2 — engine integration. The three surface renderers, dispatched
   by key. This IS the "run a live simulation through each renderer"
   proof: the idle doodle below drives it continuously, live, per frame.
   ════════════════════════════════════════════════════════════════════ */
const idleEl = document.getElementById('screen-idle');

// ── Fixed seed (brief 19 Task 1) ──────────────────────────────────────
// The idle doodle is ambiance, not the artwork: one fixed seed, identical
// every load. This is what makes a surface switch a pure restyle of
// IDENTICAL stroke geometry (Task 2) instead of a fresh random simulation
// — every rng stream below is a deterministic salt off this one constant,
// never Math.random().
const DOODLE_SEED = 2026;

// Brief 31 Task 1c — pins paint's DEFAULT palette (both the idle doodle,
// here, and a fresh game's opening palette, further down) to the approved
// reference screenshot: triadic, base index 0, Cream ground — resolves
// through HUE_LIBRARY to Crimson/Yellow/Cyan-blue. Defined before first use
// (this is the doodle's own buildPalette call, a few lines below) rather
// than alongside the rest of Task 1's palette machinery further down the
// file, which would reference these before they exist.
const PAINT_DEFAULT_SCHEME = 'triadic';
const PAINT_DEFAULT_BASE_INDEX = 0;

// One paint palette, built once from the fixed seed (buildPalette draws
// from palette.js's curated hue library — never arithmetic hue generation).
// Brief 21 Task 2: ground pinned to Cream (GROUND_LIBRARY[0], the approved
// lab default — PAINT-MODE.md / brief 16) instead of letting buildPalette
// draw a random ground (it had landed on Pale lavender). Brief 31 Task 1c:
// scheme/baseIndex are now ALSO pinned (were left undrawn before, so the
// doodle could open on any of the 4 schemes) — the doodle is paint's other
// "first thing a visitor sees" alongside a fresh game, and showing it a
// different default than the approved reference would be its own quiet
// inconsistency.
const paintPalette = buildPalette(makeRng((DOODLE_SEED ^ 0x5EED1DEA) >>> 0), {
  scheme: PAINT_DEFAULT_SCHEME, baseIndex: PAINT_DEFAULT_BASE_INDEX, groundHex: GROUND_LIBRARY[0].hex,
});

// Same weighted/shuffled flattening art-lab.html uses to turn a 3-accent
// weighted palette into a round-robin array (lab-only bookkeeping, not
// engine logic — the engine only exposes weights, not a cycle order).
function weightedPaletteArray(palette, seed) {
  const arr = [];
  palette.accents.forEach(a => {
    const n = Math.max(1, Math.round(a.weight * 20));
    for (let k = 0; k < n; k++) arr.push(a.hex);
  });
  const shuffleRng = makeRng((seed ^ 0x9E3779B9) >>> 0);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(shuffleRng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ════════════════════════════════════════════════════════════════════
   BRIEF 31 TASK 1 — palette rule: every mode's three stroke colours sit at
   a triadic (120/120/120) or split-complementary (150/60/150) OKLCh
   spacing, matched L/C, verified in code rather than by eye.

   palette.js exports hexToOklab/oklabToHex but its own ΔE function
   (oklabDeltaE) is a private, unexported helper — this file's scope is
   "v3/app/index.html only, v3/engine/ byte-identical to main" (brief 31's
   own line), so it can't be exported for this brief. Mirrored here instead:
   same formula (OKLab Euclidean distance), same 3 lines, off the same
   imported hexToOklab — not a second colour-math implementation, just the
   one function palette.js already keeps private, duplicated because it has
   to be. ════════════════════════════════════════════════════════════════ */
function deltaE(hexA, hexB) {
  const a = hexToOklab(hexA), b = hexToOklab(hexB);
  return Math.hypot(a.L - b.L, a.a - b.a, a.b - b.b);
}
function oklchHueDeg(hex) {
  const { a, b } = hexToOklab(hex);
  let h = Math.atan2(b, a) * 180 / Math.PI;
  if (h < 0) h += 360;
  return h;
}
function circularHueGap(h1, h2) {
  const d = Math.abs(h1 - h2) % 360;
  return d > 180 ? 360 - d : d;
}
// Sorted pairwise circular hue gaps for a 3-hue set are {120,120,120} for a
// true triad, or {60,150,150} for split-complementary (150/60/150 spacing)
// — verified against brief 31's own worked numbers (paper's 25/145/265
// target: gaps 119.7/119.7/120.6) before trusting it as the general check.
function satisfiesPaletteRule(hexes, tolerance = 10) {
  const hues = hexes.map(oklchHueDeg);
  const gaps = [
    circularHueGap(hues[0], hues[1]),
    circularHueGap(hues[1], hues[2]),
    circularHueGap(hues[0], hues[2]),
  ].sort((a, b) => a - b);
  const isTriadic = gaps.every(g => Math.abs(g - 120) <= tolerance);
  const isSplitComp = Math.abs(gaps[0] - 60) <= tolerance && Math.abs(gaps[1] - 150) <= tolerance && Math.abs(gaps[2] - 150) <= tolerance;
  return { ok: isTriadic || isSplitComp, rule: isTriadic ? 'triadic' : isSplitComp ? 'split-complementary' : 'NEITHER', hues, gaps };
}
const MIN_ACCENT_DE = 0.15; // mirrors palette.js's own floor of the same name (private there) — same reasoning, applied to paper/chalk's fixed arrays
const MIN_GROUND_DE = 0.16; // mirrors palette.js's own floor of the same name
const MIN_CHALK_GROUND_DE = 0.55; // brief 31 Task 1b's new, stricter guard — chalk going invisible on the board is a failure mode this surface has hit twice already (BACKLOG.md)

// Brief 31 Task 1a — paper's old three (paddle pink/blue + DEFAULT_PALETTE's
// green) measured at a 91° hue gap (neither rule) with green a whole tonal
// register brighter than the other two, which is why it vanished on cream.
// Ship a true triad instead, hues 25/145/265 at L 0.70 C 0.16 — the blue
// lands ΔE 0.005 from the existing paddle #689AFF (perceptually the same
// colour, nothing looks moved) and the red ΔE 0.104 from the paddle pink
// (below the 0.15 separation floor on purpose — it reads as the same hue
// family, not a near-miss clash). Paddle tokens (--color-pink/--color-blue)
// are UNCHANGED; only this stroke array moves.
const PAPER_PALETTE = ['#F2716A', '#54B85B', '#6D9AFF']; // red, green, blue

// Brief 31 Task 1b — chalk's old three measured 101/93/166 hue spacing
// (neither rule) with uneven ground contrast (yellow ΔE 0.647 vs blue/pink
// ~0.46). Rebuilt as a triad at base hue 90, L 0.80, C 0.16 — even contrast
// across all three against the #1A1A1E board, and the higher L is what
// reads as chalk rather than ink. This is an APP-LEVEL override of
// chalkboard.js's own CHALK_PALETTE, not an engine edit — chalkboard.js
// no longer supplies this name to the app at all (see the import block
// above); the identical override pattern PAPER_PALETTE already uses
// against DEFAULT_PALETTE, and the one BACKLOG.md already documents for
// paint's width constants ("the product value wins at reconciliation").
const CHALK_PALETTE = ['#E6B816', '#00D8F6', '#F695EE']; // gold, cyan, pink
const CHALK_GROUND_HEX = '#1A1A1E'; // chalkboard.js's own frozen CB_BASE (DESIGN.md §2's --color-canvas-chalk placeholder note)

// Brief 31 Task 1c, continued — PAINT_DEFAULT_SCHEME/BASE_INDEX are defined
// earlier (alongside the doodle's own buildPalette call, which needs them
// first) and reused at the game's buildPalette call site further down.
// Shuffle draws from these two only — analogous/complementary-minor stay
// reachable in the lab (SCHEMES itself, palette.js, is untouched) but never
// ship in the app. Consumes exactly the one rng draw buildPalette itself
// would have made internally for an un-pinned scheme, just constrained to
// 2 options instead of Object.keys(SCHEMES)'s 4 — same determinism shape.
const PAINT_SHUFFLE_SCHEMES = ['triadic', 'split-complementary'];

// Verification, printed once at load per Task 1's own instruction ("print
// the measured numbers in the session output") — console.assert (not a
// throw): a tripwire for a future palette edit, same spirit as palette.js's
// own guards, never something that should be able to break the game for a
// live player if it ever fires.
(function verifyPaletteRules() {
  function report(label, hexes, groundHex, minGroundDE) {
    const rule = satisfiesPaletteRule(hexes);
    const accentDEs = [deltaE(hexes[0], hexes[1]), deltaE(hexes[1], hexes[2]), deltaE(hexes[0], hexes[2])];
    const groundDEs = hexes.map(h => deltaE(h, groundHex));
    console.log(`[palette] ${label}: hues ${rule.hues.map(h => h.toFixed(1)).join('/')} — gaps ${rule.gaps.map(g => g.toFixed(1)).join('/')} (${rule.rule})`);
    console.log(`[palette] ${label}: pairwise ΔE ${accentDEs.map(d => d.toFixed(3)).join('/')}, vs ground ΔE ${groundDEs.map(d => d.toFixed(3)).join('/')}`);
    console.assert(rule.ok, `[palette] ${label} fails the triadic/split-complementary rule`, rule);
    console.assert(Math.min(...accentDEs) >= MIN_ACCENT_DE, `[palette] ${label} accent ΔE below floor ${MIN_ACCENT_DE}`, accentDEs);
    console.assert(Math.min(...groundDEs) >= minGroundDE, `[palette] ${label} ground ΔE below floor ${minGroundDE}`, groundDEs);
  }
  report('paper', PAPER_PALETTE, '#FFF5E5', MIN_GROUND_DE);
  report('chalk', CHALK_PALETTE, CHALK_GROUND_HEX, MIN_CHALK_GROUND_DE);
})();

// Per-surface colour cycle. Chalk is tri-colour (brief 19 Task 3) —
// CHALK_PALETTE, matching how chalk was approved in the lab — not the
// white-mode override brief 18 shipped.
const PALETTE_ARRAYS = {
  paper: PAPER_PALETTE,
  chalk: CHALK_PALETTE,
  paint: weightedPaletteArray(paintPalette, (DOODLE_SEED ^ 0x5EED1DEA) >>> 0),
};

function colourFor(surfaceKey, index) {
  const arr = PALETTE_ARRAYS[surfaceKey];
  return arr[index % arr.length];
}

// Fixed, distinct salts so each surface's ground texture is decorrelated
// from the others but still deterministic off DOODLE_SEED (Task 1).
const GROUND_SEEDS = {
  paper: (DOODLE_SEED ^ 0x1A2B3C4D) >>> 0,
  chalk: (DOODLE_SEED ^ 0x2B3C4D5E) >>> 0,
  paint: (DOODLE_SEED ^ 0x3C4D5E6F) >>> 0,
};

function buildGround(surfaceKey, rng) {
  if (surfaceKey === 'chalk') return buildChalkboardSurface(W, H, rng);
  if (surfaceKey === 'paint') return buildPaintSurface(W, H, rng, paintPalette.ground);
  return buildSurface(W, H, rng);
}

/* ════════════════════════════════════════════════════════════════════
   TASK 5 — live surface-aware idle doodle.
   ════════════════════════════════════════════════════════════════════ */

// Accumulate-then-hard-reset (brief 20 Task 2, replaces brief 18/19's
// rolling one-stroke-at-a-time eviction): a rally builds to this many
// committed strokes, then the canvas clears to bare ground and a new
// one begins — no per-stroke fade-out. Brief 21 Task 3: brief 20's value
// (8, inherited unchanged from brief 18's old ROLLING cap) read as a
// sparse loop for a build-then-clear cycle — raised so the canvas
// actually fills before it resets. Tuned by eye.
const DOODLE_RESET_THRESHOLD = 18;
const JITTER_AMPLITUDE = 0.5; // shared default — paper.js/paint.js both use it

const physRng = makeRng(DOODLE_SEED);
const groundCache = {}; // surfaceKey -> offscreen canvas, built once and reused

function getGround(surfaceKey) {
  if (!groundCache[surfaceKey]) {
    groundCache[surfaceKey] = buildGround(surfaceKey, makeRng(GROUND_SEEDS[surfaceKey]));
  }
  return groundCache[surfaceKey];
}

let currentSurface = 'paper';
let committedStrokes = []; // canonical, surface-agnostic: {pts, wt, op, index}
let strokeIndex = 0;

// persistCv accumulates ground + all committed strokes for currentSurface —
// same persistent-canvas architecture as root index.html's drawCv: never
// cleared except a full rebuild (surface switch, or eviction past the cap,
// since a canvas can't un-draw a single stroke).
const persistCv = document.createElement('canvas');
persistCv.width = W; persistCv.height = H;
const persistCx = persistCv.getContext('2d');

function rebuildPersist(surfaceKey) {
  persistCx.clearRect(0, 0, W, H);
  const ground = getGround(surfaceKey);
  if (surfaceKey === 'chalk') {
    // Brief 20 Task 3: buildChalkboardSurface's real texture (smudge
    // blobs, grain, vignette) is there but reads as flat near-black at
    // doodle scale — the same "tuned too faint to read" pattern BACKLOG.md
    // already logged once for this exact module. A presentational
    // brightness lift on THIS draw call only makes it legible; the
    // engine's own pixels (and its frozen constants) are untouched.
    // brightness() is a flat multiply, so it's the right tool for a
    // near-black image — contrast() pivots around mid-grey and CRUSHES
    // shadow detail further toward 0 for values this far below it,
    // which made an earlier attempt at this filter read even flatter.
    //
    // Brief 21 Task 1: that brightness lift is also what exposed a denim/
    // blue cast. CB_BASE (#1A1A1E) and the grain/smudge tint are only
    // faintly cool by design (chalkboard.js's own comment: "cool tint:
    // nudge blue a touch above red/green") — invisible at the engine's
    // native near-black brightness, and correctly so; approved and frozen
    // at brief 17. A flat brightness() MULTIPLY scales every channel by
    // the same factor, so it scales that small existing R/G-vs-B gap by
    // 2.4x too, turning an intentional whisper of cool into an obvious
    // blue cast. That's a doodle-side artifact of lifting brightness, not
    // a wrong value in chalkboard.js — grayscale() strips hue/chroma
    // entirely while leaving the (already brightness-lifted) per-pixel
    // luminance — i.e. the grain and smudge texture itself — untouched,
    // landing on neutral slate grey. chalkboard.js is not touched by this
    // fix; the lab (which never applies this doodle-only filter) is
    // unaffected by construction.
    persistCx.filter = 'brightness(2.4) grayscale(1)';
    persistCx.drawImage(ground, 0, 0);
    persistCx.filter = 'none';
  } else {
    persistCx.drawImage(ground, 0, 0);
  }
  committedStrokes.forEach(st => renderStrokeAs(persistCx, surfaceKey, st.pts, st.wt, st.op, st.index));
}

function commitStroke(rawPts, wt, op) {
  if (rawPts.length < 2) return;
  // Re-zip the baked-per-point .w (brief 19 Task 5) onto jitterPath's
  // output: jitterPath (engine fn) returns fresh {x,y} objects for every
  // interior point, dropping any extra fields, but it's a 1:1 same-
  // length map so index correspondence is exact. Without this, a
  // committed paint stroke would lose its baked widths on every point
  // except the two endpoints — precisely what caused brief 20 Task 1a's
  // pop (committed strokes fell back to the engine's OWN independent
  // width algorithm, which disagreed with the live-drawn shape).
  const jittered = jitterPath(rawPts, JITTER_AMPLITUDE);
  const pts = jittered.map((p, i) => ({ x: p.x, y: p.y, w: rawPts[i].w }));
  const st = { pts, wt, op, index: strokeIndex++ };

  if (committedStrokes.length >= DOODLE_RESET_THRESHOLD) {
    // Brief 20 Task 2: hard reset, not a rolling fade — the rally holds
    // at full density for one beat, then this new stroke starts a clean
    // cycle from bare ground.
    committedStrokes = [];
    rebuildPersist(currentSurface);
  }
  committedStrokes.push(st);
  renderStrokeAs(persistCx, currentSurface, st.pts, st.wt, st.op, st.index); // incremental
}

// Two stacked canvases so a surface switch can cross-fade (DESIGN.md §13:
// 400ms linear) instead of popping. Physics/stroke state below is never
// touched by a switch (brief 19 Task 2) — only which layer is live and
// what persistCv holds.
const layerEls = { A: document.getElementById('doodle-a'), B: document.getElementById('doodle-b') };
let activeKey = 'A', inactiveKey = 'B';
layerEls[activeKey].style.opacity = '1';

// Brief 25 Task 3 — the idle pal-pill's own colour source. Mirrors
// gamePalPillHexesFor's shape (chalk/paper: distinct swatches; paint: the 3
// accents, not PALETTE_ARRAYS.paint's weighted 20-slot CYCLE array) but
// reads the doodle's own fixed data (PAPER_PALETTE/CHALK_PALETTE/
// paintPalette), never the game's per-game shuffle-able state — the idle
// screen has no shuffle interaction wired to this pill, it's a preview of
// what the doodle itself is currently painting.
function idlePalPillHexesFor(surfaceKey) {
  if (surfaceKey === 'chalk') return CHALK_PALETTE;
  if (surfaceKey === 'paint') return paintPalette.accents.map(a => a.hex);
  return PAPER_PALETTE;
}
function updateIdlePalPill() {
  const el = document.getElementById('pal-pill');
  const shuffleEl = document.getElementById('idle-shuffle');
  el.querySelectorAll('.dot').forEach(d => d.remove());
  idlePalPillHexesFor(currentSurface).forEach(hex => {
    const dot = document.createElement('i');
    dot.className = 'dot';
    dot.style.background = hex;
    el.insertBefore(dot, shuffleEl);
  });
}
updateIdlePalPill(); // initial paint, matches currentSurface's 'paper' default

function switchSurface(newKey) {
  if (newKey === currentSurface) return;
  currentSurface = newKey;
  rebuildPersist(newKey); // re-render the SAME committed stroke data through the new renderer
  updateIdlePalPill();

  const newEl = layerEls[inactiveKey];
  const newCtx = newEl.getContext('2d');
  newCtx.clearRect(0, 0, W, H);
  newCtx.drawImage(persistCv, 0, 0);

  layerEls[inactiveKey].style.opacity = '1';
  layerEls[activeKey].style.opacity = '0';
  [activeKey, inactiveKey] = [inactiveKey, activeKey];
}

// Static paddles (idle screen never moves them, per design) double as
// real collision surfaces for the doodle ball — same sweptHit the live
// game uses, so the idle rally is genuine physics, not a canned path.
const paddleL = { y: 180 };
const paddleR = { y: 430 };

// ── Shared paint-ribbon machinery (brief 19 Task 5, revised brief 20 Task
// 1a, generalised brief 22 Task 1) ───────────────────────────────────────
// paint.js's renderPaintStroke computes each sample's width from the
// stroke's CURRENT total arc length and CURRENT endpoint (a hash of the
// last point) — correct for a finished stroke rendered once, but wrong for
// anything that grows or gets re-rendered against a different reference.
// Bake each point's width multiplier ONCE, at the moment it's appended,
// from the stroke's ABSOLUTE arc length so far (not normalized to an
// unknowable final total) and a phase/wavelength fixed at the stroke's
// first point. Never recomputed afterward.
//
// Brief 19 scoped this to the doodle's live/uncommitted stroke only, on
// the theory that a committed pts array never changes again so the
// engine's own renderPaintStroke was "already correct" for it — true in
// isolation, but wrong in practice: the engine's algorithm and this baked
// one are DIFFERENT formulas (independently-derived phase/frequency), so a
// stroke rendered live-then-committed visibly snapped to a different shape
// the instant it committed (brief 20 Task 1a's "pop"). Brief 20's fix: one
// renderer for a paint stroke's WHOLE life, live or committed, in the
// doodle. Brief 22 Task 1: the live game has the identical growing-stroke
// problem, plus DESIGN.md §13 forbids the reveal from re-drawing marks
// differently than the rally showed them — so this has to be the SAME
// mechanism, not a second copy of it. makePaintTracker below is that one
// mechanism, parameterised so the doodle and the game can use different
// width numbers while sharing the exact same bake-on-append math and the
// same drawPaintRibbon fill (further down, unchanged, already generic).
// The real engine renderPaintStroke is untouched and still used for the
// actual end-game artwork (brief 26's job — reveal/results); this stays
// app-side, per PORT-PLAN.md/BACKLOG.md's explicit deferral of promoting it
// into paint.js to the brief-29 integration pass.
// Brief 23 Task 4: every stroke used to get the same treatment (one sine
// undulation, seeded phase only) — variety was all in the offset, none in
// the character. Three profiles now, seeded per stroke: flat (0.40, one
// constant multiplier), ramp (0.35, monotonic thick<->thin across cfg.refLen
// px), wave (0.25, the original sine — unchanged). Weights/bands below are
// Shivang's calibration targets, shipped as given.
const PAINT_PROFILE_FLAT_WEIGHT = 0.40, PAINT_PROFILE_RAMP_WEIGHT = 0.35; // remainder (0.25) is 'wave'
const PAINT_FLAT_BAND_LO = 0.35, PAINT_FLAT_BAND_HI = 0.80; // middle band of [varMin,varMax] — an extreme is a hairline or a slab, not a stroke
const PAINT_RAMP_MIN_SEP = 0.4; // fraction of [varMin,varMax] — below this a ramp just reads as a flat

function makePaintTracker(rng, cfg) {
  // cfg: { varMin, varMax, undulationsMin, undulationsMax, refLen, widthVariation }
  // widthVariation mirrors paint.js's renderPaintStroke shape exactly
  // (`1 + (waveMult-1)*widthVariation`) — at widthVariation=1 (both the
  // doodle and the game use 1) this reduces to plain waveMult, so the
  // formula generalises brief 20's doodle-only version losslessly.
  const RANGE = cfg.varMax - cfg.varMin;

  function widthMultAt(arcLen, ball) {
    let waveMult;
    if (ball._paintProfile === 'flat') {
      waveMult = ball._paintFlatMult;
    } else if (ball._paintProfile === 'ramp') {
      const t = Math.min(1, arcLen / cfg.refLen); // clamped past refLen — brief 23 Task 4
      waveMult = ball._paintRampA + (ball._paintRampB - ball._paintRampA) * t;
    } else { // 'wave' — brief 19/20's original sine undulation, unchanged
      const wave = Math.sin((arcLen / ball._paintWavelength) * Math.PI * 2 + ball._paintPhase);
      waveMult = cfg.varMin + (wave * 0.5 + 0.5) * RANGE;
    }
    return 1 + (waveMult - 1) * cfg.widthVariation;
  }

  return {
    // Called once whenever a NEW stroke starts (any surface — cheap, and
    // keeps the rng stream surface-independent: see the doodle/game
    // instantiation comments for why that matters to each).
    //
    // Determinism invariant (brief 23 Task 4 — do not break this): draws a
    // FIXED number of rng values (7) on every call regardless of which
    // profile ends up selected — every draw happens unconditionally, the
    // profile only decides how the ALREADY-DRAWN numbers get used. A draw
    // made only inside one profile's branch would make the rng stream
    // depend on which profile got picked, which desyncs it from any other
    // path through the same seed (surface switches, replays) — the same
    // hazard the wavelength/phase draws already had to respect.
    startTrail(ball, x, y) {
      ball.pts = [{ x, y }];
      ball._paintArcLen = 0;

      const profileRoll = rng();
      ball._paintPhase = rng() * Math.PI * 2;
      const undulations = cfg.undulationsMin + rng() * (cfg.undulationsMax - cfg.undulationsMin);
      ball._paintWavelength = cfg.refLen / undulations;
      const flatRoll = rng();
      const rampARoll = rng();
      const rampBRoll = rng();
      const rampDirRoll = rng();

      if (profileRoll < PAINT_PROFILE_FLAT_WEIGHT) {
        ball._paintProfile = 'flat';
        ball._paintFlatMult = cfg.varMin + (PAINT_FLAT_BAND_LO + flatRoll * (PAINT_FLAT_BAND_HI - PAINT_FLAT_BAND_LO)) * RANGE;
      } else if (profileRoll < PAINT_PROFILE_FLAT_WEIGHT + PAINT_PROFILE_RAMP_WEIGHT) {
        ball._paintProfile = 'ramp';
        let lo = cfg.varMin + Math.min(rampARoll, rampBRoll) * RANGE;
        let hi = cfg.varMin + Math.max(rampARoll, rampBRoll) * RANGE;
        const minSep = PAINT_RAMP_MIN_SEP * RANGE;
        if (hi - lo < minSep) {
          // Push apart around the shared midpoint, then slide the whole
          // pair back inside [varMin, varMax] if that spilled over an edge
          // — never re-compresses the separation, unlike a plain clamp.
          const mid = (lo + hi) / 2;
          lo = mid - minSep / 2; hi = mid + minSep / 2;
          if (lo < cfg.varMin) { hi += cfg.varMin - lo; lo = cfg.varMin; }
          if (hi > cfg.varMax) { lo -= hi - cfg.varMax; hi = cfg.varMax; }
        }
        // Direction seeded 50/50 — thick→thin or thin→thick.
        ball._paintRampA = rampDirRoll < 0.5 ? hi : lo;
        ball._paintRampB = rampDirRoll < 0.5 ? lo : hi;
      } else {
        ball._paintProfile = 'wave';
      }

      ball.pts[0].w = widthMultAt(0, ball);
    },
    // Called once per frame when the current position is appended to the
    // trail — bakes that ONE new point's width and never touches earlier
    // points (the actual fix).
    appendPoint(ball, x, y) {
      const prev = ball.pts[ball.pts.length - 1];
      const pt = { x, y };
      ball._paintArcLen += Math.hypot(x - prev.x, y - prev.y);
      pt.w = widthMultAt(ball._paintArcLen, ball);
      ball.pts.push(pt);
    },
  };
}

// paint.js expresses undulation frequency as a cycle-COUNT over the
// finished stroke's total length — meaningless while growing, since the
// total isn't known yet. Converted to a fixed spatial wavelength (px) via
// one reference length, chosen to match a typical stroke's length so the
// live wave reads at a similar visual frequency to a committed stroke.
// Shared by doodle and game: the wavelength math is independent of width
// base, and no brief has asked for a different reference length or
// undulation range for the game.
const PAINT_UNDULATIONS_MIN = 0.5, PAINT_UNDULATIONS_MAX = 1.5; // mirrors paint.js's own (private) range
const PAINT_UNDULATION_REF_LEN = 500;

// Doodle instance — own rng stream, advanced by exactly 2 draws (phase,
// undulations) at EVERY new stroke start regardless of which surface is on
// screen, so the sequence never depends on the player's surface-switching
// path (would otherwise desync Task 1/2's "identical geometry" guarantee).
// Width range is doodle-scoped (brief 20 Task 1b: paint.js's frozen
// product values read cartoonish-huge against paper/chalk at ambient
// doodle scale) — NOT paint.js's PAINT_WIDTH_BASE/variation, which the
// GAME instance uses instead (see the game-state section below).
const paintWidthRng = makeRng((DOODLE_SEED ^ 0x50A17B17) >>> 0);
const DOODLE_PAINT_WIDTH_BASE = 3.0;
const doodlePaintTracker = makePaintTracker(paintWidthRng, {
  varMin: 0.15, varMax: 2.2,
  undulationsMin: PAINT_UNDULATIONS_MIN, undulationsMax: PAINT_UNDULATIONS_MAX,
  refLen: PAINT_UNDULATION_REF_LEN,
  widthVariation: 1.0, // doodle never scaled the wave down
});

// Ribbon fill for a paint stroke — live or committed, doodle or game, same
// function either way (brief 20 Task 1a, generalised brief 22 Task 1).
// Same tangent/normal/half-width/rounded-cap construction as paint.js's
// renderPaintStroke, but driven by each point's PRE-BAKED .w (never
// recomputed). Raw points only (no Catmull-Rom spine resampling) — this
// doesn't need the finished-artwork's exact sample density, only a shape
// that's stable across a stroke's whole life, growing or committed. This
// is the ONLY function in the app that fills paint-stroke pixels — verify
// by construction: grep finds exactly one definition, and the engine's own
// renderPaintStroke is never called anywhere in this file.
//
// Brief 23 Task 3 added a draw-time emergence taper here (zero width at
// each end, ramping to full over PAINT_TAPER_LEN) to solve the ball being
// invisible inside its own trail. Brief 24 Task 3 REMOVES it: it fixed ball
// visibility but forced every stroke thin-at-both-ends, which is exactly
// the uniformity brief 23's OWN Task 4 (per-stroke profiles) was trying to
// break — a stroke can no longer just start and stop at its own width. Ball
// visibility is solved differently now: a gap between the ball and its live
// trail (trimStrokeForGap, below) plus a solid-black ball in paint mode
// (drawGameFrame/drawFrame) — neither touches this function or the stroke's
// own shape. Do not re-add a taper here; if ball legibility regresses again,
// the gap width is the knob, not this function.
function drawPaintRibbon(ctx, pts, wt, col) {
  if (pts.length < 2) return;
  const n = pts.length;
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const pPrev = pts[Math.max(i - 1, 0)], pNext = pts[Math.min(i + 1, n - 1)];
    let tx = pNext.x - pPrev.x, ty = pNext.y - pPrev.y;
    const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    const nx = -ty, ny = tx;

    const halfW = 0.5 * wt * (p.w != null ? p.w : 1);
    left.push({ x: p.x + nx * halfW, y: p.y + ny * halfW });
    right.push({ x: p.x - nx * halfW, y: p.y - ny * halfW });
  }
  ctx.save();
  ctx.globalAlpha = 0.88; // brief 31 Task 2b — was 1.0; paper/chalk unaffected, this is the paint-only ribbon renderer
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();
  ctx.fill();
  const r0 = Math.hypot(left[0].x - right[0].x, left[0].y - right[0].y) / 2;
  ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, r0, 0, Math.PI * 2); ctx.fill();
  const last = n - 1;
  const rN = Math.hypot(left[last].x - right[last].x, left[last].y - right[last].y) / 2;
  ctx.beginPath(); ctx.arc(pts[last].x, pts[last].y, rN, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Brief 31 Task 2b — splatter's own opacity, matching drawPaintRibbon's
// 0.88 above. renderSplatterMark (splatter.js) explicitly force-sets
// ctx.globalAlpha = 1.0 right after its own save(), before every fill() —
// so a caller-set globalAlpha has no effect on it at all, confirmed by
// reading the engine source rather than assuming. It never touches
// ctx.filter anywhere, though, so a filter set by the CALLER before the
// call stays in effect through those same fill() calls — filter is a real
// paint-time effect, not something the function overrides. One shared
// wrapper rather than repeating the set/call/reset sequence at all three
// call sites (live rally, results replay, share) — same principle as this
// file's other "one function draws a mark" renderers.
function renderSplatterMarkPaint(ctx, mark) {
  ctx.filter = 'opacity(88%)';
  renderSplatterMark(ctx, mark);
  ctx.filter = 'none';
}

// Ball-visibility fix, brief 24 Task 3 (replaces brief 23's emergence
// taper — see the note on drawPaintRibbon above). PAINT_BALL_GAP px of arc
// length are left undrawn at the tail of the LIVE, still-growing stroke
// only — the ball then sits in that clear gap instead of inside the ink.
// Walks back from the stroke's last point accumulating arc length and
// interpolates a fresh cut point exactly at the gap boundary (not just
// dropping whole points), so the visible edge of the ink doesn't jump in
// point-sized steps frame to frame. Returns a NEW array — pts and its
// point objects (including their baked .w) are never mutated, per the
// brief's explicit instruction; the stroke's own data is untouched. Returns
// null if the whole stroke is shorter than the gap (nothing to draw yet).
//
// What changes at commit, and why this isn't brief 20's pop: this function
// is called ONLY for the live in-flight render (drawFrame/drawGameFrame's
// paint branch) — never for a committed stroke, which always draws its full
// pts array complete. So the frame a stroke commits, the last ~10px of ink
// that was being held back simply appears — the stroke completes, nothing
// that was already visible moves or changes width. Brief 20's pop was a
// SECOND ALGORITHM re-rendering already-drawn ink differently; this is the
// same one algorithm drawing more of the same data than it was showing a
// moment ago. Do not "fix" this by baking the gap into .w — that would
// resurrect exactly the bug brief 19/20 spent two briefs killing.
const PAINT_BALL_GAP = 10;

function trimStrokeForGap(pts, gapLen) {
  const n = pts.length;
  if (n < 2) return null;
  let acc = 0;
  for (let i = n - 1; i > 0; i--) {
    const a = pts[i - 1], b = pts[i];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    if (acc + segLen >= gapLen) {
      const remain = gapLen - acc;
      const t = segLen > 0 ? 1 - remain / segLen : 0;
      const cut = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, w: a.w + (b.w - a.w) * t };
      const trimmed = pts.slice(0, i).concat([cut]);
      return trimmed.length >= 2 ? trimmed : null;
    }
    acc += segLen;
  }
  return null; // gap longer than the whole stroke so far
}

// Single stroke renderer for both committed strokes (rebuildPersist,
// commitStroke) and the live/growing one (drawFrame) — the same function,
// same inputs in, same pixels out, at every point in a stroke's life.
// That equality is what makes brief 20 Task 1a's commit-time pop
// impossible by construction: there is no second algorithm to disagree.
// (The brief 24 gap above is applied by the CALLER trimming `pts` before
// this function ever sees them, for the live paint case only — this
// function itself still just draws whatever pts array it's handed, live or
// committed, exactly as before.)
function renderStrokeAs(ctx, surfaceKey, pts, wt, op, index) {
  const col = colourFor(surfaceKey, index);
  if (surfaceKey === 'chalk') {
    renderChalkStroke(ctx, pts, col, wt, op, CHALK_DEFAULT_WIDTH_MULT, 0);
  } else if (surfaceKey === 'paint') {
    drawPaintRibbon(ctx, pts, wt * DOODLE_PAINT_WIDTH_BASE, col);
  } else {
    renderStroke(ctx, pts, col, wt, op, DEFAULT_STROKE_PARAMS);
  }
}

let ball = mkBall(physRng, 1, null, [1.0, 2.4], [0.50, 0.68]);
doodlePaintTracker.startTrail(ball, ball.x, ball.y);

// Brief 32 Task 3 — the gate's own paddle motion, replacing the design's
// CSS keyframes (v3/design/5-mobile-gate.html's zp-track/zp-track-r) with
// real values fed into the SAME advanceBall the doodle's physics already
// uses, so the ball genuinely bounces off the paddle the cursor is
// dragging rather than the visible paddle moving independently of it.
// Reproduced exactly, not approximately: the source CSS sets no
// per-keyframe timing-function override, so the shorthand's ease-in-out
// applies independently to EACH segment — zero slope at every stop, so
// the 100%->0% wrap has zero velocity on both sides (no snap, by
// construction, not by luck).
const GATE_PADDLE_DURATION_MS = 4500;
const GATE_PADDLE_L_KEYFRAMES = [{ t: 0, v: 0.12 }, { t: 0.30, v: 0.58 }, { t: 0.65, v: 0.26 }, { t: 1, v: 0.12 }];
const GATE_PADDLE_R_KEYFRAMES = [{ t: 0, v: 0.52 }, { t: 0.35, v: 0.18 }, { t: 0.70, v: 0.62 }, { t: 1, v: 0.52 }];
function gateEaseInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function gateKeyframeValue(stops, elapsedMs) {
  const t = (elapsedMs % GATE_PADDLE_DURATION_MS) / GATE_PADDLE_DURATION_MS;
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i].t && t <= stops[i + 1].t) {
      const segT = (t - stops[i].t) / (stops[i + 1].t - stops[i].t);
      return stops[i].v + (stops[i + 1].v - stops[i].v) * gateEaseInOut(segT);
    }
  }
  return stops[stops.length - 1].v;
}

function stepDoodle() {
  // paddleL/paddleR are read ONLY by advanceBall below (verified: nothing
  // else in this file reads or assigns them) — safe to override here and
  // nowhere else. Gated: real motion while the gate is actually showing;
  // otherwise snapped back to the documented static position every frame,
  // regardless of wherever the gate's animation last left them, so desktop
  // never sees anything but the "idle screen never moves them" contract.
  if (isMobileBlocked()) {
    const now = performance.now();
    paddleL.y = gateKeyframeValue(GATE_PADDLE_L_KEYFRAMES, now) * H;
    paddleR.y = gateKeyframeValue(GATE_PADDLE_R_KEYFRAMES, now) * H;
  } else {
    paddleL.y = 180;
    paddleR.y = 430;
  }

  // Faithful to simulate.js/root index.html's update(): advanceBall moves
  // the ball and resolves wall/paddle collisions FIRST; a commit fires
  // using the trail as it stood before this frame's point is appended (so
  // the committed stroke ends at the previous frame's position, and the
  // new stroke starts fresh at the post-bounce position) — only THEN does
  // this frame's position get pushed, unconditionally, exactly once.
  const events = advanceBall(ball, paddleL, paddleR, 0, physRng);

  events.forEach(() => {
    commitStroke(ball.pts, ball.wt, ball.op);
    doodlePaintTracker.startTrail(ball, ball.x, ball.y);
  });
  doodlePaintTracker.appendPoint(ball, ball.x, ball.y);

  if (ball.pts.length > 500) {
    commitStroke(ball.pts, ball.wt, ball.op);
    ball.pts = ball.pts.slice(-4); // buffer trim only — same stroke continues, arc-length/phase untouched
  }

  if (ball.x < -30 || ball.x > W + 30) {
    if (ball.pts.length >= 2) commitStroke(ball.pts, ball.wt, ball.op);
    ball = mkBall(physRng, 1, null, [1.0, 2.4], [0.50, 0.68]);
    doodlePaintTracker.startTrail(ball, ball.x, ball.y);
  }
}

// The actual paint calls — extracted so the gate canvas (Task 3) can reuse
// them verbatim against a different destination context instead of this
// being a second, worse renderer. Same persistCv + live-stroke + ball-
// marker draw, whichever ctx it's handed.
function paintDoodleFrame(ctx) {
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(persistCv, 0, 0);
  // in-flight stroke: raw (unjittered) pts, same as root's live-frame
  // overlay — jitter is a commit-time effect, not a per-frame one. Paint
  // only (brief 24 Task 3): trim the last PAINT_BALL_GAP px so the ball
  // sits in clear space ahead of its own ink, instead of a taper.
  const livePts = currentSurface === 'paint' ? trimStrokeForGap(ball.pts, PAINT_BALL_GAP) : ball.pts;
  if (livePts && livePts.length > 1) {
    renderStrokeAs(ctx, currentSurface, livePts, ball.wt, ball.op, strokeIndex);
  }
  // Task 4 — ball marker, always visible, every surface: the moving point
  // that makes the doodle legible as a rally, not just accumulating trails.
  // Brief 24 Task 3: solid black (INK_HEX) in paint mode — unmistakable
  // against ink of any stroke colour or width; paper/chalk keep the
  // stroke-coloured ball, unchanged.
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = currentSurface === 'paint' ? INK_HEX : colourFor(currentSurface, strokeIndex);
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BR * 0.9, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFrame() {
  paintDoodleFrame(layerEls[activeKey].getContext('2d'));
}

// Brief 32 Task 3 — the gate's own canvas + DOM paddle positioning.
// gateCanvas is declared width=1000 height=630 in the markup (the doodle's
// own coordinate space) and scaled to the phone purely by CSS
// (aspect-ratio:1000/630, width:100%) — same convention every other
// canvas in this file already uses, nothing new here.
const gateCanvas = document.getElementById('gate-canvas');
const gateCtx = gateCanvas.getContext('2d');
const gatePaddleLEl = document.getElementById('gate-paddle-left');
const gatePaddleREl = document.getElementById('gate-paddle-right');
function drawGateFrame() {
  paintDoodleFrame(gateCtx);
}
// Percentage, not px — the gate's .stage is fluid-width (unlike the live
// game's fixed-1000px canvas, which positions its DOM paddles in raw px).
function updateGatePaddleDOM() {
  gatePaddleLEl.style.top = (paddleL.y / H * 100) + '%';
  gatePaddleREl.style.top = (paddleR.y / H * 100) + '%';
}

// Brief 32 Task 3 — "prefers-reduced-motion: hold a completed still, no
// loop." No existing JS matchMedia precedent in this file (checked) — this
// is genuinely new. A visitor landing cold with reduced motion already on
// would otherwise freeze on an almost-empty canvas (the shared doodle sim
// starts fresh at page load), so the first freeze fast-forwards stepDoodle
// headlessly first — CAPPED at 300 steps (not run to any "looks finished"
// point — a few hundred physics steps in one synchronous burst would stall
// a phone for a visible beat) and stopped early the instant a reset would
// occur (detected via the ball object identity changing — stepDoodle
// reassigns `ball = mkBall(...)` on reset), so the freeze never lands
// right after a reset back near-empty. This trades a guaranteed "finished"
// look for a bounded, cheap burst — accepted, not silently glossed over.
const prefersReducedMotionMQ = matchMedia('(prefers-reduced-motion: reduce)');
const GATE_FASTFORWARD_MAX_STEPS = 300;
function fastForwardDoodleForStill() {
  const startBallRef = ball;
  for (let i = 0; i < GATE_FASTFORWARD_MAX_STEPS; i++) {
    stepDoodle();
    if (ball !== startBallRef) break;
  }
}
let gateFrameFrozen = false;
let wasGateActive = false;
prefersReducedMotionMQ.addEventListener('change', () => { gateFrameFrozen = false; });

function doodleLoop() {
  if (screenState === 'idle') {
    const gateActive = isMobileBlocked();
    if (gateActive && !wasGateActive) gateFrameFrozen = false; // re-arm every time the gate is (re)entered
    wasGateActive = gateActive;

    if (gateActive && prefersReducedMotionMQ.matches) {
      if (!gateFrameFrozen) {
        fastForwardDoodleForStill();
        drawGateFrame();
        updateGatePaddleDOM();
        gateFrameFrozen = true;
      }
      // else: hold — no stepDoodle, no redraw, "no loop" per the brief.
    } else if (gateActive) {
      stepDoodle();
      drawGateFrame();       // NOT drawFrame() too — the desktop doodle-a/
      updateGatePaddleDOM(); // doodle-b canvases are invisible (display:none
    } else {                 // ancestor) the entire time gated; painting them
      stepDoodle();          // as well would be pure wasted work on a phone.
      drawFrame();
    }
  }
  requestAnimationFrame(doodleLoop);
}
rebuildPersist(currentSurface);
requestAnimationFrame(doodleLoop);

/* ════════════════════════════════════════════════════════════════════════
   BRIEF 22 — THE PLAYING SCREEN. Everything below is game-scoped: its own
   persistent canvas, ground cache, committed strokes, palette state and
   paint tracker, separate from the doodle's (which keeps running, paused,
   in the background — screenState gates both loops so they never step
   concurrently). Surface is chosen at idle and locked for the rally: the
   game never calls switchSurface; it just reads currentSurface once.
   ════════════════════════════════════════════════════════════════════════ */

// ── Task 6 — per-game seed ────────────────────────────────────────────
// One seed per game; every other stream in this section is a fixed salt

let gameSeed = 0;
let gamePhysRng, gameGroundSeeds, gamePaintWidthRng;

// ── Task 1's shared machinery, game-scoped config ─────────────────────
// PAINT_DEFAULT_WIDTH_VARIATION is paint.js's real, frozen, approved-
// 2026-07-21 product constant — imported above, used here, never
// re-declared. undulation range and reference length are shared with the

//
// GAME_PAINT_WIDTH_VAR_MIN/MAX and (brief 24) GAME_PAINT_WIDTH_BASE are NOT
// mirrors of anything in paint.js — that comment stood here through brief

// approved in the lab on twelve static seeded artworks; the first time that

// constant already didn't match the lab, before it's compared to the game.
// These three are the live PRODUCT'S OWN values, and paint.js's pair is the

// 23 and 24) — not the reverse. Do NOT "fix" these back to match paint.js;
// if the numbers still disagree when that reconciliation happens, paint.js
// moves to these, not this file to paint.js's frozen pair.
const GAME_PAINT_WIDTH_VAR_MIN = 0.25, GAME_PAINT_WIDTH_VAR_MAX = 1.6; // was 0.15/4.0 — max cut 60% (brief 23 Task 2), min raised so the thin end reads as a hairline brush, not a single pixel
const GAME_PAINT_WIDTH_BASE = 3.5; // was paint.js's imported 6.0 — brief 24 Task 2, new worst case 2.4 x 3.5 x 1.6 = 13.44px
let gamePaintTracker; // built fresh each game — see startGame()

// ── Task 4 — per-surface ground, paint's neutral-substrate exception ──
const gameGroundCache = {};
function getGameGround(surfaceKey) {
  if (!gameGroundCache[surfaceKey]) {
    if (surfaceKey === 'chalk') {
      gameGroundCache[surfaceKey] = buildChalkboardSurface(W, H, makeRng(gameGroundSeeds.chalk));
    } else if (surfaceKey === 'paint') {
      // PAINT-MODE.md §4 (LOCKED): "The ground does not exist during
      // play. The player paints on a neutral substrate; at game end the
      // artwork re-renders with the ground composited beneath the marks."
      // The neutral substrate is --color-canvas-paint-base (DESIGN.md §2)
      // = #FFF5E5, i.e. the PAPER ground — so this deliberately calls
      // buildSurface (paper's real ground function), not buildPaintSurface.
      // The chosen paint ground (gamePaintPalette.ground, picked in
      // startGame()) composites in only at the reveal — brief 23's job.
      gameGroundCache[surfaceKey] = buildSurface(W, H, makeRng(gameGroundSeeds.paint));
    } else {
      gameGroundCache[surfaceKey] = buildSurface(W, H, makeRng(gameGroundSeeds.paper));
    }
  }
  return gameGroundCache[surfaceKey];
}

// Chalk brightness/grayscale lift decision (brief 22 Task 4 explicitly
// asks for one, stated, not silently inherited): the doodle's
// brightness(2.4) grayscale(1) filter (briefs 20/21) exists because the
// idle doodle sits at ambient scale behind a card, easy to glance past.
// The game is the foreground — DESIGN.md's own Verification for this
// brief asks for the real engine grounds with no mention of a lift — so
// NO filter is applied here. getGameGround's chalk branch returns
// buildChalkboardSurface's pixels completely as-drawn.

// ── Task 5 — per-surface palette state (game-scoped, independently
// shufflable — never touches the doodle's fixed PALETTE_ARRAYS) ────────
let gamePaperOrder;   // shuffled index map into PAPER_PALETTE (3, brief 25 Task 3 — was DEFAULT_PALETTE's full 5)
let gameChalkOrder;   // shuffled index map into CHALK_PALETTE (3)
let gamePaintPalette; // buildPalette() result — ground fixed once per game, not touched by shuffle
let gamePaintArray;   // weightedPaletteArray(gamePaintPalette, ...) — a flattened, weighted 20-slot
                       // round-robin CYCLE used for stroke colour assignment, NOT the dot list —
                       // see gamePalPillHexesFor for the 3 distinct accents shown in the pill.

function gamePaletteArrayFor(surfaceKey) {
  if (surfaceKey === 'chalk') return gameChalkOrder.map(i => CHALK_PALETTE[i]);
  if (surfaceKey === 'paint') return gamePaintArray;
  return gamePaperOrder.map(i => PAPER_PALETTE[i]);
}
function gameColourFor(surfaceKey, index) {
  const arr = gamePaletteArrayFor(surfaceKey);
  return arr[index % arr.length];
}
// Brief 24 Task 5 shipped the paint pill showing all FIVE of the artwork's
// colour slots (ground, ink, 3 accents) to match the lab's swatch row.
// Brief 25 Task 3 REVERSES that: "every palette chip shows 3 dots" is built
// on the principle that a pill lying about what actually gets painted is a
// bug — brief 24's own reasoning, just pointed the other way. Paint's real
// stroke cycle (gamePaletteArrayFor/gameColourFor) has only ever used the 3
// accents; ground and ink never appear as a LINE colour (ink is splatter-
// only, Task 6; ground is the reveal's job, brief 26). A 5-dot pill was
// therefore itself a lying control by brief 25's standard, just overstating
// instead of understating. Back to 3 accents only, matching chalk and the
// now-3-colour paper (below) — pill and actual stroke palette agree on all
// three surfaces, which is the whole point of Task 3.
function gamePalPillHexesFor(surfaceKey) {
  if (surfaceKey === 'chalk') return gameChalkOrder.map(i => CHALK_PALETTE[i]);
  if (surfaceKey === 'paint') return gamePaintPalette.accents.map(a => a.hex);
  return gamePaperOrder.map(i => PAPER_PALETTE[i]);
}
function shuffleArrayInPlace(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ── Committed-strokes layer + stroke commit — brief 24 Task 4 splits what
// was one "persist" canvas (ground + strokes baked together) into TWO:
// getGameGround(surfaceKey) already IS the opaque ground layer (built once,
// cached, per Task 4/brief 22 — no separate copy needed here), and
// gameStrokesCv below holds committed strokes ONLY, transparent background.
// drawGameFrame composites ground at alpha 1, then this layer at the
// current dim/full alpha, then the live stroke at alpha 1, then the ball —
// so "committed strokes sit back during play, snap to full at game end" is
// a single alpha number on ONE drawImage call, not a per-stroke property.
// A per-stroke alpha instead would double-darken wherever strokes overlap
// (each layer's semi-transparent paint stacks); compositing the whole layer
// once dims everything evenly regardless of how busy an area is. This same
// split is what brief 26's reveal needs anyway — the paint ground has to
// composite in UNDERNEATH the marks — so it's built now, not unpicked from
// a combined canvas next brief.
const gameStrokesCv = document.createElement('canvas');
gameStrokesCv.width = W; gameStrokesCv.height = H;
const gameStrokesCx = gameStrokesCv.getContext('2d');

// 70% while playing, 100% once the game ends (see stepGame's win branch) —
// starting value, tune by eye and report. One number, not a re-render.
const GAME_COMMITTED_ALPHA = 0.70;
let gameStrokesAlpha = GAME_COMMITTED_ALPHA;

let gameCommittedStrokes = [];
let gameStrokeIndex = 0;

// Single stroke renderer for the game, live or committed — same principle
// as the doodle's renderStrokeAs (Task 1): paint routes through the ONE
// shared drawPaintRibbon, at product width, so a stroke can never be drawn
// two different ways at two points in its life, rally or reveal. (Brief 23's
// taperOpts param is gone — brief 24 Task 3 removed the taper entirely;
// see drawPaintRibbon's own comment.)
function renderGameStrokeAs(ctx, surfaceKey, pts, wt, op, index) {
  const col = gameColourFor(surfaceKey, index);
  if (surfaceKey === 'chalk') {
    renderChalkStroke(ctx, pts, col, wt, op, CHALK_DEFAULT_WIDTH_MULT, 0);
  } else if (surfaceKey === 'paint') {
    drawPaintRibbon(ctx, pts, wt * GAME_PAINT_WIDTH_BASE, col);
  } else {
    renderStroke(ctx, pts, col, wt, op, DEFAULT_STROKE_PARAMS);
  }
}

function rebuildGameStrokes() {
  gameStrokesCx.clearRect(0, 0, W, H); // transparent, NOT the ground — see the layer-split comment above
  gameCommittedStrokes.forEach(st => renderGameStrokeAs(gameStrokesCx, currentSurface, st.pts, st.wt, st.op, st.index));
}

function commitGameStroke(rawPts, wt, op, eventType) {
  if (rawPts.length < 2) return;
  // Same re-zip as the doodle's commitStroke (Task 1/brief 20): jitterPath
  // returns fresh {x,y} objects for interior points, dropping the baked
  // .w — re-attach it by index so a committed paint stroke keeps the
  // exact widths it had live.
  const jittered = jitterPath(rawPts, JITTER_AMPLITUDE);
  const pts = jittered.map((p, i) => ({ x: p.x, y: p.y, w: rawPts[i].w }));
  const st = { pts, wt, op, index: gameStrokeIndex++, event: eventType };
  gameCommittedStrokes.push(st);
  renderGameStrokeAs(gameStrokesCx, currentSurface, st.pts, st.wt, st.op, st.index); // incremental — never cleared mid-game
  return st;
}

// ── Task 3 — the game loop ─────────────────────────────────────────────
let gameBall, gamePaddleL, gamePaddleR;
let gamePs = 0, gameAs = 0, gameLv = 1, gameAiSpd = 2.6;
let gameMouseY = H / 2, gamePrevMouseY = H / 2;
let gameServing = false; // true during the short beat between a miss and the next spawn
let gameLastEndedStrokes = null; // handoff for brief 26 (results/reveal) — {strokes, seed, surface}

// ── Task 6 (brief 24) — live splatter, paint only ──────────────────────
// PAINT-MODE.md §5 D, specced since brief 11, never built until now: ink
// thrown off the ball mid-rally, separate from the line it's drawing.
// Density-placed buildSplatter/buildIntersectionBlotches (splatter.js) are
// NOT used here on purpose — those place marks over a FINISHED stroke set,
// which is a different mechanism from "the ball sheds ink as it travels."
// This is physics-driven emission instead: evaluated once per frame,
// probability scaling with |ball.spin| and speed, so a fast spinning ball
// sheds ink and a slow straight one doesn't. Marks are built app-side and
// handed straight to the engine's own exported renderSplatterMark — the
// actual fill code (irregular blob / teardrop+satellites) is never
// duplicated, only the placement/sizing decision is app-side.
//
// Never on a hit. splatter.js's own header records why density-placement
// replaced event-triggering in the first place: brief 02's hit-triggered
// ink bloom pinned every mark to the canvas edge, because paddle/wall hits
// are structurally always on the boundary. stepGame gates this to frames
// with NO hit event and NO miss this frame — see the call site.
// Brief 31 Task 2a — cooldown 40 -> 24, target count 3-8 -> 10-18/game.
// GAME_SPLATTER_CAP is doing real, frequent work here, not acting as a rare
// safety net the way the old CAP=10 mostly did against a 3-8 target — a
// game's total splatter count scales with its own rally length, which
// varies enormously game to game (measured, briefs 29/30: several-thousand-
// step spread between a short and a long game), so a per-frame probability
// alone cannot hold a tight band without a real ceiling. CAP is set to the
// target's own upper bound (18) for exactly that reason. BASE_P tuned
// against 20 real headless games at these settings: 19/20 landed in
// [10,18] (10 of those 19 at the 18 cap — long games routinely reach it),
// one short game landed at 9, one below the floor — accepted rather than
// pushed higher, since raising BASE_P further to close that one gap would
// mean most games hit the cap and read as a fixed count rather than
// organic variation. Mean 16.1 across the sample.
const GAME_SPLATTER_COOLDOWN_FRAMES = 24; // was 40
const GAME_SPLATTER_CAP = 18; // was 10 — the target's own upper bound, not "target + headroom" (see above)
const GAME_SPLATTER_SPIN_REF = 0.15; // |ball.spin| normalisation — see physics.js's sweptHit/finishWallBounce for typical magnitudes
const GAME_SPLATTER_BASE_P = 0.017; // was 0.016 — see the measurement note above
// ~60/40 drops:flung baseline, spin-skewed same as before, but no longer
// THE ONLY source of variation in the mix — see buildLiveSplatterMark's own
// jitter term, added so two games with similar spin don't converge on the
// same drop/flung ratio every time ("vary the mix, don't hold it fixed").
const GAME_SPLATTER_FLUNG_RATIO = 0.4;
const GAME_SPLATTER_FLUNG_RATIO_JITTER = 0.3; // +/-0.15 on top of the spin-derived chance
const GAME_SPLATTER_OFFSET_MIN = 14, GAME_SPLATTER_OFFSET_RANGE = 18; // px clear of the ball, perpendicular to travel — clears the widest (~13px) stroke plus the mark's own radius

// splatter.js's own size constants (DROP_R, FLUNG_LEN, FLUNG_HEAD_R) are
// private/unexported, tuned against a 24px-wide stroke the game no longer
// has (~13px widest now, brief 24 Task 2) — mirrored here at ~0.58x per the
// brief's own numbers, same pattern and same BACKLOG.md reconciliation item
// as the width constants above. Brief 31 Task 2a widens all three ranges
// further still ("no two marks read as siblings") — tuned by eye, verified
// on a real finished canvas (see the session report for a screenshot).
const GAME_SPLATTER_DROP_R_MIN = 1.5, GAME_SPLATTER_DROP_R_MAX = 16.0; // was 2.5-12.0
const GAME_SPLATTER_DROP_SIZE_POWER = 3.5; // mirrors splatter.js's DROP_SIZE_POWER — heavy-tailed toward small
const GAME_SPLATTER_FLUNG_LEN_MIN = 10, GAME_SPLATTER_FLUNG_LEN_MAX = 45; // was 15-35
const GAME_SPLATTER_HEAD_R_MIN = 3, GAME_SPLATTER_HEAD_R_MAX = 12; // was 4-9
const GAME_SPLATTER_SATELLITE_COUNT_MIN = 2, GAME_SPLATTER_SATELLITE_COUNT_MAX = 5; // a count, not a size — unscaled

let gameSplatterRng; // own stream, salted off the per-game seed like every other — see startGame()
let gameSplatterCooldown = 0;
let gameSplatterMarks = []; // { mark, afterStrokes } — see maybeEmitSplatter's brief-26 comment

// Brief 31 Task 2a — "no black splatter": drops the ink entry entirely.
// Was mirroring splatter.js's private splatterColorWeights(palette), which
// includes ink at a minor weight alongside the 3 accents; the app now
// diverges from it on purpose — splatter draws only from the 3 accents, at
// their own palette weights, never ink. (The ball marker itself stays
// solid ink/black in paint mode — brief 24's legibility decision, separate
// from this and not affected by it.)
function gameSplatterColorWeights(palette) {
  return [
    ...palette.accents.map(a => ({ value: a.hex, weight: a.weight })),
  ];
}

// Builds one mark descriptor at the ball's CURRENT position, offset
// perpendicular to travel (brief: "far enough that it lands clear of the
// trail... a mark that lands on top of the stroke reads as a blob in the
// line"). This is deliberately NOT splatter.js's nearestDirection (which
// orients a flung mark ALONG the local stroke tangent, for density-placed
// marks found after the fact) — a live mark is oriented perpendicular,
// away from the line it's leaving, matching "flung off the ball" physically.
function buildLiveSplatterMark(ball, palette, rng) {
  const spd = Math.hypot(ball.vx, ball.vy) || 1;
  const tx = ball.vx / spd, ty = ball.vy / spd; // travel direction (unit)
  const nx = -ty, ny = tx;                      // perpendicular to travel (unit)
  const sign = rng() < 0.5 ? 1 : -1;             // randomise which side
  const offset = GAME_SPLATTER_OFFSET_MIN + rng() * GAME_SPLATTER_OFFSET_RANGE;
  const mx = ball.x + nx * sign * offset, my = ball.y + ny * sign * offset;

  const colorHex = weightedPick(rng, gameSplatterColorWeights(palette));

  // High spin favours 'flung' (brief 24 Task 6), oriented perpendicular to
  // travel — not the ~60/40 flat ratio alone. Brief 31 Task 2a adds a
  // random jitter on top of the spin term so the drop/flung mix actually
  // varies game to game instead of being a deterministic function of spin
  // alone — two balls with near-identical spin no longer produce the same
  // ratio every time.
  const spinNorm = Math.min(1, Math.abs(ball.spin) / GAME_SPLATTER_SPIN_REF);
  const jitter = (rng() - 0.5) * GAME_SPLATTER_FLUNG_RATIO_JITTER;
  const flungChance = Math.max(0.1, Math.min(0.9, GAME_SPLATTER_FLUNG_RATIO + spinNorm * 0.4 + jitter));

  if (rng() < flungChance) {
    const dx = nx * sign, dy = ny * sign; // fling continues outward along the same perpendicular
    const headR = GAME_SPLATTER_HEAD_R_MIN + rng() * (GAME_SPLATTER_HEAD_R_MAX - GAME_SPLATTER_HEAD_R_MIN);
    const length = GAME_SPLATTER_FLUNG_LEN_MIN + rng() * (GAME_SPLATTER_FLUNG_LEN_MAX - GAME_SPLATTER_FLUNG_LEN_MIN);
    const satelliteCount = GAME_SPLATTER_SATELLITE_COUNT_MIN
      + Math.floor(rng() * (GAME_SPLATTER_SATELLITE_COUNT_MAX - GAME_SPLATTER_SATELLITE_COUNT_MIN + 1));
    const satellites = [];
    for (let i = 0; i < satelliteCount; i++) {
      const t = 1.1 + i * 0.35 + rng() * 0.25;
      const perp = (rng() - 0.5) * headR * (1.2 + i * 0.6); // scatter along the ORIGINAL travel axis, off the fling line
      satellites.push({
        x: mx + dx * length * t + tx * perp,
        y: my + dy * length * t + ty * perp,
        r: Math.max(0.5, headR * (0.4 - i * 0.05) * (0.7 + rng() * 0.5)),
      });
    }
    return { type: 'flung', x: mx, y: my, dx, dy, headR, length, colorHex, satellites };
  }

  const rNorm = Math.pow(rng(), GAME_SPLATTER_DROP_SIZE_POWER); // heavy-tailed toward small
  const r = GAME_SPLATTER_DROP_R_MIN + (GAME_SPLATTER_DROP_R_MAX - GAME_SPLATTER_DROP_R_MIN) * rNorm;
  const irregularity = 0.12 + rng() * 0.13;
  const seedAngle = rng() * Math.PI * 2;
  return { type: 'drop', x: mx, y: my, r, irregularity, seedAngle, colorHex };
}

// Called once per frame from stepGame, only on frames with no hit event and
// no miss this frame (see the call site) — "mid-flight, between bounces."
function maybeEmitSplatter() {
  if (gameSplatterCooldown > 0) { gameSplatterCooldown--; return; }
  if (gameSplatterMarks.length >= GAME_SPLATTER_CAP) return;

  const spd = Math.hypot(gameBall.vx, gameBall.vy);
  const spinNorm = Math.min(1, Math.abs(gameBall.spin) / GAME_SPLATTER_SPIN_REF);
  const speedNorm = Math.min(1, Math.max(0, (spd - BASE_SPD) / (MAX_SPD - BASE_SPD)));
  const p = GAME_SPLATTER_BASE_P * spinNorm * (0.4 + 0.6 * speedNorm);
  if (gameSplatterRng() >= p) return;

  const mark = buildLiveSplatterMark(gameBall, gamePaintPalette, gameSplatterRng);
  // Splatter is artwork, not chrome (brief 24 Task 6) — into gameStrokesCx,
  // so it dims with everything else during play and comes up to full at
  // game end (Task 4), same as a committed stroke.
  renderSplatterMarkPaint(gameStrokesCx, mark);
  // Brief 26: also KEEP the descriptor, tagged with how many strokes were
  // committed when it fired. gameStrokesCv only ever holds baked pixels —
  // fine for live play, but the results screen's timeline scrubber (Task 6)
  // has to selectively show/hide marks by rebuilding from re-renderable
  // data, and a flat bitmap can't be un-drawn. Same principle as everywhere
  // else in this file: renderSplatterMark is the one function that draws a
  // mark, live or replayed, so calling it again later from this stored
  // descriptor reproduces identical pixels — not a second algorithm.
  gameSplatterMarks.push({ mark, afterStrokes: gameCommittedStrokes.length });
  gameSplatterCooldown = GAME_SPLATTER_COOLDOWN_FRAMES;
}

const gameCanvas = document.getElementById('game-canvas');

const gamePaddleLEl = document.getElementById('game-paddle-left');
const gamePaddleREl = document.getElementById('game-paddle-right');
