    background: var(--color-cta);
    border-radius: var(--radius-small);
    padding: var(--space-xxm) var(--space-m);
    font-family: 'Space Mono', monospace;
    font-style: normal;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #FFFFFF;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.32);
  }
  .swap { position: relative; display: inline-block; width: 44px; text-align: left; }
  .swap b { font-weight: 400; animation: zp-word-a 6s steps(1, end) infinite; }
  .swap i {
    position: absolute; left: 0; top: 0; font-style: normal;
    animation: zp-word-b 6s steps(1, end) infinite;
  }
  .static-word { margin-left: var(--space-s); }

  /* ── #timeline-chip — DESIGN.md §10, primitives resolved by the design
     file per the brief (DESIGN.md itself flags them UNRESOLVED) (Task 6) ── */
  #timeline-chip { padding: 0 var(--space-xm); gap: var(--space-xm); }
  #timeline-chip label { color: var(--color-lightest-grey); }
  .track {
    position: relative; width: 320px; height: var(--space-xs);
    border-radius: var(--space-xs); background: var(--color-bg);
    cursor: pointer;
  }
  .track .fill {
    position: absolute; left: 0; top: 0; height: var(--space-xs);
    border-radius: var(--space-xs); background: var(--color-lightest-grey);
    width: 100%; /* JS-driven — default 100%, every committed stroke */
    pointer-events: none;
  }
  .track .thumb {
    position: absolute; top: -6px; left: calc(100% - 8px);
    width: var(--space-xm); height: var(--space-xm); border-radius: 50%;
    background: var(--color-canvas);
    box-shadow: 0 4px 24px rgba(0,0,0,0.29);
    cursor: grab;
  }
  .track:active .thumb, .track .thumb:active { cursor: grabbing; }
  .track:focus-visible { outline: 2px solid var(--color-lightest-grey); outline-offset: 4px; } /* browser-default-adjacent, DESIGN.md defines no custom ring (Task 6) */

  /* ── Mobile screens · brief 32 ──────────────────────────────────────────
     Replaces brief 30's placeholder #mobile-overlay entirely: two REAL,
     dedicated, natively-responsive screens (fluid CSS, matching
     v3/design/5-mobile-gate.html / 1d-mobile-share.html) instead of the
     desktop layout scaled down via a JS transform. Direct children of
     <body>, siblings of the four .screen sections — display:none by
     default, shown only via the html.mobile-*-active classes
     updateMobileScreens() toggles (JS section, replacing
     updateMobileOverlay()). Desktop's four .screen sections get a REAL
     display:none while either is active — not a visual cover — so there
     is nothing left to click through and no chrome-hiding rules needed
     the way brief 30's translucent-card-over-idle approach required. */
  html.mobile-gate-active .screen,
  html.mobile-share-active .screen { display: none !important; }

  #screen-mobile-gate, #screen-mobile-share {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    justify-content: center;
    background: var(--color-bg);
    color: var(--color-lightest-grey);
    padding: calc(var(--space-m) + env(safe-area-inset-top)) 0 calc(var(--space-m) + env(safe-area-inset-bottom));
  }
  html.mobile-gate-active #screen-mobile-gate,
  html.mobile-share-active #screen-mobile-share { display: flex; }

  /* Fluid stage — overrides the shared .stage class's fixed 1000x630px
     (desktop) for these two screens only. .canvas-wrap itself is already
     position:absolute/inset:0 (the shared class), so it fills whatever
     size .stage resolves to for free — but each <canvas> ELEMENT inside
     still needs its OWN width:100%/height:100% rule (a canvas's CSS
     display size does not follow its container by default, only its own
     width/height ATTRIBUTES, unless told to — the existing
     #share-ground-canvas rule, ~line 453, is scoped to THOSE specific
     desktop ids, not a generic "any canvas in .canvas-wrap" rule, so
     every new canvas id here needs the identical rule spelled out again). */
  #screen-mobile-gate .stage, #screen-mobile-share .stage {
    width: 100%; height: auto; aspect-ratio: 1000 / 630;
  }
  #screen-mobile-gate .frame, #screen-mobile-share .frame {
    border-radius: var(--radius-mobile-canvas);
    border-width: var(--frame-mobile);
  }
  #screen-mobile-gate .canvas-wrap, #screen-mobile-share .canvas-wrap {
    border-radius: var(--radius-mobile-canvas);
  }
  #gate-canvas,
  #mobile-share-ground-canvas, #mobile-share-strokes-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }

  /* ── header cluster (both screens) ── */
  #screen-mobile-gate header, #screen-mobile-share header {
    display: flex; flex-direction: column; align-items: center; gap: var(--space-xm);
    padding: 0 var(--gutter-mobile);
  }
  #screen-mobile-gate .tagline { font-size: 15px; color: var(--color-lightest-grey); margin: 0; }

  #screen-mobile-gate main, #screen-mobile-share main {
    display: flex; flex-direction: column; gap: var(--space-l);
    padding: var(--space-l) var(--gutter-mobile) 0;
  }
  /* logo -> 16 -> label -> 24 -> artwork -> 24 -> haiku -> 32 -> actions,
     MOBILE-NOTES.md §3 — main's own gap (--space-l/32) covers haiku-to-
     actions; art-block's own gap (--space-m/24) covers label-to-artwork,
     header's own gap (--space-xm/16) covers logo-to-label. */
  #screen-mobile-share main { gap: var(--space-m); }
  #screen-mobile-share .art-block { display: flex; flex-direction: column; gap: var(--space-m); }
  #screen-mobile-share .zoom-hint {
    margin: 0; text-align: center;
    font-family: 'Space Mono', monospace; font-style: normal;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--color-disabled);
  }
  #screen-mobile-share .stage { cursor: zoom-in; }
  #screen-mobile-share .haiku { font-size: 17px; color: var(--color-lightest-grey); margin: 0; text-align: center; }

  /* ── actions — stacked, full-width, var(--tap) tall. Reuses the shared
     .rbtn/.rbtn-primary/.swap classes (colour, gradient, word-swap
     animation — unchanged, desktop keeps its own auto-width/padded
     sizing) with mobile-scoped overrides for width/height only. ── */
  #screen-mobile-gate .actions, #screen-mobile-share .actions {
    display: flex; flex-direction: column; gap: var(--space-xxm);
  }
  #screen-mobile-share .secondary { display: flex; gap: var(--space-xxm); }
  #screen-mobile-gate .rbtn-primary, #screen-mobile-share .rbtn-primary { width: 100%; }
  #screen-mobile-gate .rbtn-primary .inner, #screen-mobile-share .rbtn-primary .inner {
    display: flex; align-items: center; justify-content: center;
    height: calc(var(--tap) - 2px);
    padding: 0; font-size: 12px;
  }
  #screen-mobile-share .rbtn {
    flex: 1; height: var(--tap);
    display: flex; align-items: center; justify-content: center;
    padding: 0; font-size: 12px;
    background: transparent;
    border: 1px solid rgba(197,197,197,0.22);
    box-shadow: none;
  }
  #screen-mobile-share .rbtn:hover { opacity: 1; } /* no hover state on touch; :active below carries the feedback */
  #screen-mobile-gate .rbtn-primary:active, #screen-mobile-share .rbtn-primary:active,
  #screen-mobile-share .rbtn:active { opacity: 0.8; }

  /* ── Gate — demo canvas + real doodle-driven paddles ──
     Same sizing idiom as the live game's own DOM paddles (.paddle,
     8x64px) but scaled down (5x38px per the design) and positioned as a
     PERCENTAGE of the fluid stage height, not px — see
     updateGatePaddleDOM() in the JS section. z-index above .frame (4) so
     a bar sitting on the rim stays visible, matching the design exactly. */
  #screen-mobile-gate .gate-paddle { position: absolute; width: 5px; height: 38px; z-index: 5; }
  #screen-mobile-gate .gate-paddle .bar { position: absolute; inset: 0; border-radius: 3px; }
  #screen-mobile-gate .gate-paddle-left { left: 0; }
  #screen-mobile-gate .gate-paddle-left .bar { background: var(--color-pink); }
  #screen-mobile-gate .gate-paddle-right { right: 0; }
  #screen-mobile-gate .gate-paddle-right .bar { background: var(--color-blue); }
  /* The detached handle dot is dropped at this scale (MOBILE-NOTES.md §5's
     mobile deviation, adopted as specced — it would hang into the screen
     gutter) — the cursor glyph takes its place, riding the left paddle. */
  #screen-mobile-gate .gate-cursor {
    position: absolute; left: 11px; top: 10px;
    width: 14px; height: 14px; z-index: 3;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25));
  }

  /* ── Gate — message card ── */
  #screen-mobile-gate .card { text-align: center; }
  #screen-mobile-gate .card h1 {
    font-size: 27px; line-height: 1.25; margin: 0;
    color: var(--color-canvas); font-weight: 400;
  }
  #screen-mobile-gate .card hr {
    border: 0; border-top: 1px solid rgba(197,197,197,0.28);
    margin: var(--space-m) auto; width: 64px;
  }
  #screen-mobile-gate .card p {
    font-family: 'Space Mono', monospace; font-style: normal;
    font-size: 13px; line-height: 1.95; margin: 0;
    color: var(--color-lightest-grey);
  }
  #screen-mobile-gate .hint {
    font-family: 'Space Mono', monospace; font-style: normal;
    font-size: 11px; letter-spacing: 0.06em;
    color: var(--color-disabled);
    text-align: center; margin: 0;
    min-height: 16px;
  }

  /* ── Share — rotated fullscreen view ──
     The artwork is landscape and the phone is portrait, so full screen
     means rotated: the piece fills the display instead of a letterbox.
     #full stays a direct child of <body> (matching the design's own DOM,
     a sibling of <main>, not nested in .stage) — cheap insurance against
     a future transform landing on an ancestor, same reasoning brief 30
     documented for #mobile-overlay. Gets its OWN canvas pair, populated
     via drawImage() on open — NOT the live inline canvases moved in and
     back out, which is real DOM surgery on the one thing the visitor came
     to see for a saving (one draw call) that doesn't matter. */
  #full {
    position: fixed; inset: 0; z-index: 20;
    background: #2A2A2A;
    display: none; align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  #full[data-open="true"] { display: flex; animation: zp-full-fade 260ms ease-out both; }
  @keyframes zp-full-fade { from { opacity: 0; } to { opacity: 1; } }
  /* A rotated element's layout box overflows horizontally by design, so it
     must not shrink to a flex line — absolute + centred, sized via --fw
     (computed in JS: min(innerHeight-32, (innerWidth-32)*1000/630)). */
  #full .rot {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
    flex-shrink: 0;
    width: var(--fw, 100vh);
    aspect-ratio: 1000 / 630;
  }
  #full .stage { width: 100%; height: auto; aspect-ratio: 1000/630; cursor: zoom-out; }
  #full .canvas-wrap, #full .frame { border-radius: var(--radius-mobile-canvas); }
  #full-ground-canvas, #full-strokes-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  #full .frame { border-width: var(--frame-mobile); }
  #full .close {
    position: absolute; top: calc(var(--space-xm) + env(safe-area-inset-top)); right: var(--space-xm);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: 50%;
    background: rgba(56,56,56,0.72);
    color: var(--color-canvas);
    font-family: 'Space Mono', monospace; font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

       bars are driven from the same paddleL/paddleR objects the doodle's
       own physics uses, so the ball genuinely bounces off them. -->

      <p class="tagline">make uncertainty your play</p>

      <div class="stage" id="gate-stage">
        <div class="canvas-wrap">

        <div class="gate-paddle gate-paddle-left" id="gate-paddle-left">

            <path d="M1 1 L1 11.5 L4.2 8.6 L6.4 13 L8.4 12 L6.2 7.7 L10.6 7.3 Z" fill="#383838" stroke="#FFF5E5" stroke-width="0.9"/>
          </svg>

        <div class="frame"></div>
      </div>

  </section>

  <section id="screen-mobile-share">

  <!-- Rotated fullscreen artwork view (Task 2) — direct child of <body>,

  <div id="full" data-open="false">

  <!-- ══════════════════════════ IDLE SCREEN ══════════════════════════ -->
  <section id="screen-idle" class="screen" data-idle-step="attract" data-surface="paper">

      <div class="intro-stack">
        <div id="intro-card">
          <svg width="140" height="27" viewBox="0 0 140 27" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zen Pong">

const __engine = {};
__engine.rng = (() => {
/* Seedable PRNG — mulberry32. Same seed → identical rng() sequence. */

function makeRng(seed) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* weightedPick(rng, items) — items: [{ value, weight }]. Returns one value,
   probability proportional to weight. Brief 13: splatter colour and patch
   colour both need this. */
function weightedPick(rng, items) {
  const total = items.reduce((s, it) => s + it.weight, 0);
  let r = rng() * total;
  for (const it of items) {
    r -= it.weight;
    if (r <= 0) return it.value;
  }
  return items[items.length - 1].value;
}

/* weightedSampleWithoutReplacement(rng, items, count) — items: [{ value,
   weight }]. Draws up to `count` distinct values, each draw weighted by the
   remaining pool's weights (higher weight, higher probability, but never a
   deterministic top-N — brief 13 task 1's explicit requirement, so two
   rallies with a similar density field don't always produce the same
   splatter structure). */
function weightedSampleWithoutReplacement(rng, items, count) {
  const pool = items.slice();
  const chosen = [];
  while (chosen.length < count && pool.length > 0) {
    const total = pool.reduce((s, it) => s + it.weight, 0);
    if (total <= 0) break;
    let r = rng() * total, idx = pool.length - 1;
    for (let i = 0; i < pool.length; i++) {
      r -= pool[i].weight;
      if (r <= 0) { idx = i; break; }
    }
    chosen.push(pool[idx].value);
    pool.splice(idx, 1);
  }
  return chosen;
}
  return { makeRng, weightedPick, weightedSampleWithoutReplacement };

/* Headless ball/paddle physics — ported from root index.html.

   the live app) decide what to do with an event. */

const CORNERS = [
  { cx: CR, cy: CR }, { cx: W - CR, cy: CR },
  { cx: CR, cy: H - CR }, { cx: W - CR, cy: H - CR },

    vx = (rng() - 0.5) * s * 0.8; vy = Math.cos(a) * s;

    x = W / 2 + (rng() - 0.5) * 400; y = H - BR - 2;
    vx = (rng() - 0.5) * s * 0.8; vy = -Math.cos(a) * s;
  }
  if (Math.abs(vx) < BASE_SPD * 0.3) {
    vx = (rng() < 0.5 ? 1 : -1) * BASE_SPD * 0.35;
  }
  return {
    x, y, vx, vy, col, scol: col,
    wt: wtRange[0] + rng() * (wtRange[1] - wtRange[0]),
    op: opRange[0] + rng() * (opRange[1] - opRange[0]),

function enforceMinAngle(b) {
  const minA = Math.PI / 10;
  const spd = Math.hypot(b.vx, b.vy);
  const ang = Math.atan2(b.vy, b.vx);
  const fromH = Math.min(Math.abs(ang), Math.PI - Math.abs(ang));
  if (fromH < minA) {
    const sy = b.vy >= 0 ? 1 : -1;
    const sx = b.vx >= 0 ? 1 : -1;

    const inY = (c.cy <= CR) ? (b.y < c.cy) : (b.y > c.cy);

    const ang = Math.atan2(b.vy, b.vx) + (rng() - 0.5) * 0.28;

   padVelL is the left paddle's per-frame y-velocity (mouse, live game;
   AI-stand-in delta, sim) — only the left/player side transmits
   velocity-based spin, matching the original asymmetry exactly. */

  if (hitEv) events.push(hitEv);

  const capSpd = BASE_SPD * 1.6;

  }

   events (used for sndCollide in the live game). */

      const a = balls[i], b = balls[j];
      const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy), minD = BR * 2 + 2;

        const nx = dx / dist, ny = dy / dist, ov = (minD - dist) / 2;

        const dot = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (dot > 0) {
          a.vx -= dot * nx; a.vy -= dot * ny;
          b.vx += dot * nx; b.vy += dot * ny;
          const s = (rng() * 0.12 + 0.06);
          a.spin += s; b.spin -= s;
          events.push({ type: 'collide', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

   bookkeeping (which is driven by total score, not physics) lives in the
   caller — see simulate.js. */
function levelUp(balls) {
  balls.forEach(b => {
    const s = Math.min(bspd(b) * 1.06, MAX_SPD);
    const a = Math.atan2(b.vy, b.vx);
    b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;

   vertical center when nothing is approaching. */

    ? balls.filter(b => b.vx > 0).sort((a, b) => b.x - a.x)
    : balls.filter(b => b.vx < 0).sort((a, b) => a.x - b.x);
  const tgt = approaching[0];
  return tgt ? tgt.y : H / 2;
}

/* Generalized paddle AI: jitter + step + lag catch-up + clamp, given an
   already-resolved target y. `tVirtual` replaces Date.now() (see simulate.js
   deviation note) so behavior stays deterministic under a seed.
   `phaseOffset` lets a second consumer (the sim's player stand-in) desync
   its jitter from the primary AI. */

  const jitter = Math.sin(tVirtual * 0.002 + phaseOffset) * 3;
  const d = targetY - (paddle.y + PH / 2) + jitter;
  const maxStep = Math.max(aiSpd, 4.2);
  paddle.y += Math.sign(d) * Math.min(Math.abs(d), maxStep);
  const lag = targetY - (paddle.y + PH / 2);

  paddle.y = Math.max(PAD_MIN, Math.min(PAD_MAX, paddle.y));

})();

   Pure canvas drawing (2D context in, nothing else) + pure path math.
   No ball/game state here. */

/* Catmull-Rom-ish path through pts, traced as a sequence of bezier curves. */
function traceCR(ctx, pts) {
  if (pts.length < 2) return;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1],
          p3 = pts[Math.min(i + 2, pts.length - 1)], t = .5;
    ctx.bezierCurveTo(
      p1.x + (p2.x - p0.x) * t / 3, p1.y + (p2.y - p0.y) * t / 3,
      p2.x - (p3.x - p1.x) * t / 3, p2.y - (p3.y - p1.y) * t / 3,
      p2.x, p2.y);
  }
}

/* Closed variant of traceCR — same t=0.5 Catmull-Rom-to-bezier conversion,
   but neighbour indices wrap (modulo pts.length) instead of clamping at the
   ends, so the curve closes smoothly back on itself rather than reading as
   an open path with its ends pinned. Brief 15: paint patches and blotch-
   cluster blobs both need a closed, curved (not polygon) silhouette. */
function traceClosedCR(ctx, pts) {
  const n = pts.length;
  if (n < 3) return;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n],
          p3 = pts[(i + 2) % n], t = .5;
    ctx.bezierCurveTo(
      p1.x + (p2.x - p0.x) * t / 3, p1.y + (p2.y - p0.y) * t / 3,
      p2.x - (p3.x - p1.x) * t / 3, p2.y - (p3.y - p1.y) * t / 3,
      p2.x, p2.y);
  }
  ctx.closePath();
}

/* Defaults equal to the live build's hardcoded pass widths/alphas. */
const DEFAULT_STROKE_PARAMS = {
  pass1WidthMult: 2.2, pass1AlphaMult: 0.22,
  pass2WidthMult: 0.75, pass2AlphaMult: 0.88,
};

/* Two-pass stroke: wide soft pass, then a narrower dense core pass.
   `params` externalizes the pass multipliers — this is what the lab's
   sliders drive; omitted fields fall back to the live build's values. */
function renderStroke(ctx, pts, col, wt, op, params = {}) {
  if (pts.length < 2) return;
  const p = { ...DEFAULT_STROKE_PARAMS, ...params };
  ctx.save(); ctx.globalAlpha = op * p.pass1AlphaMult; ctx.strokeStyle = col;
  ctx.lineWidth = wt * p.pass1WidthMult; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  traceCR(ctx, pts); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalAlpha = op * p.pass2AlphaMult; ctx.strokeStyle = col;
  ctx.lineWidth = wt * p.pass2WidthMult; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  traceCR(ctx, pts); ctx.stroke(); ctx.restore();
}

/* Perpendicular sine displacement applied to interior points when a stroke
   commits (extracted from commitStroke). `amplitude` defaults to the live
   build's value (0.5) and is what the lab's jitter-amplitude slider drives.
   Endpoints are left untouched so committed strokes still meet at the exact
   hit/bounce/spawn point. */
function jitterPath(pts, amplitude = 0.5) {
  if (pts.length < 2) return pts;
  return pts.map((p, i) => {
    if (i === 0 || i === pts.length - 1) return p;
    const nx = pts[Math.min(i + 1, pts.length - 1)].x - pts[i - 1].x;
    const ny = pts[Math.min(i + 1, pts.length - 1)].y - pts[i - 1].y;
    const len = Math.hypot(nx, ny) || 1;
    const j = Math.sin(p.x * 0.73 + p.y * 1.31) * amplitude;
    return { x: p.x + (-ny / len) * j, y: p.y + (nx / len) * j };
  });

})();

      d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + n * 0.72 + v * 0.75));

  g.addColorStop(0, 'rgba(0,0,0,0.055)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  pc.fillStyle = g; pc.fillRect(0, 0, w, ew);
  g = pc.createLinearGradient(0, h, 0, h - ew);
  g.addColorStop(0, 'rgba(0,0,0,0.055)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  pc.fillStyle = g; pc.fillRect(0, h - ew, w, ew);
  g = pc.createLinearGradient(0, 0, ew, 0);
  g.addColorStop(0, 'rgba(0,0,0,0.045)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  pc.fillStyle = g; pc.fillRect(0, 0, ew, h);

  g.addColorStop(0, 'rgba(0,0,0,0.045)'); g.addColorStop(1, 'rgba(0,0,0,0)');

})();

const CHALK_DEFAULT_MODE = 'white';       // 'white' | 'tri' — white is the approved default
const CHALK_DEFAULT_WIDTH_MULT = 1.0;     // chalkWidthMult lab default

/* ── Task 2 — chalk stroke renderer ──────────────────────────────────────
   Target: the golden-ratio reference's line quality — a continuous, fairly
   clean, moderate-thin line with a little chalk roughness at the EDGE (not a
   flat vector line, not the ampersand's thick ragged strokes).

   Technique (documented per brief): draw onto a small per-stroke bbox-sized
   offscreen so texturing can't leak onto the rest of the canvas, then
   1. a wide, low-alpha soft "dust" halo (the edge),
   2. punch a seeded static grain into the halo via destination-out at FULL
      strength — the dusty, broken chalk edge, near the ampersand's ragged
      intensity, without any tiling artefact bleeding across strokes,
   3. lay a chunky core on top (CORE_MULT ~1.0, wider than paper's 0.75 core
      so chalk's resting line reads visibly heavier than a paper stroke),
   4. punch the SAME grain into the core but at reduced strength
      (CORE_GRAIN_STRENGTH) so the texture is visible on the line itself while
      the core stays mostly solid/continuous — this is what makes it read as
      "chalk" rather than "clean vector + faint halo" (brief 08 task 1).
   Grain is a fixed-seed makeRng() tile built once and reused, so it costs
   nothing per stroke beyond one createPattern + fillRect over a small rect —
   cheap enough to run per committed stroke in the live game later. The bbox
   offscreen keeps the erase local; nothing here reads/writes global state.

   chalkWidthMult scales BOTH pass widths (the standalone "thicker/thinner"
   knob). It stacks on the ball's own wt, which the caller has already
   resolved through age-fade / speed-weight (see art-lab renderTile) — this
   function never touches opacity or age logic itself. col is whatever the
   caller passes (white-mode override or the ball's tri-palette colour); mode
   selection lives in the caller, not here. */
const HALO_ALPHA = 0.26;   // dust-fringe opacity
const HALO_DUST = 3.0;     // brief 10: the halo is a ~CONSTANT dust fringe beyond
                           // the core (px), NOT a width-proportional band — so a
                           // wide stroke keeps a tight dusty edge instead of the
                           // soft translucent glow a proportional halo produced.
const CORE_MULT = 1.0, CORE_ALPHA = 0.92;
const CORE_GRAIN_STRENGTH = 0.6; // brief 09: core grain fraction
const GRAIN_REF_WIDTH = 1.6;     // stroke width at which grain tile is 1:1 (brief 10)
const AGE_GRAIN_BOOST = 0.7;     // oldest strokes get up to +70% core grain (task 3)
const AGE_HALO_BOOST = 0.5;      // and a dustier halo, so age costs crispness not just op
const GRAIN_TILE_SEED = 0x5eed; // fixed => deterministic grain across runs
let _grainTile = null;         // shared static tile, built once on first stroke

function renderChalkStroke(ctx, pts, col, wt, op, chalkWidthMult = 1.0, ageFrac = 0) {
  if (pts.length < 2) return;
  const wMul = chalkWidthMult;
  // Age (0 = newest, 1 = oldest) costs crispness, not just opacity (task 3):
  // older strokes get more core grain and a dustier halo. ageFrac is 0 when
  // Age Fade is off, so every stroke sits at the flat task-1 baseline then.
  const haloAlpha = HALO_ALPHA * (1 + AGE_HALO_BOOST * ageFrac);
  const coreGrain = Math.min(0.85, CORE_GRAIN_STRENGTH * (1 + AGE_GRAIN_BOOST * ageFrac));

  // Lazily build the shared grain tile (fixed seed => identical every run).
  if (!_grainTile) {
    const s = 128;
    const tile = document.createElement('canvas');
    tile.width = s; tile.height = s;
    const tcx = tile.getContext('2d');
    const grng = makeRng(GRAIN_TILE_SEED);
    tcx.fillStyle = '#000';
    // MULTI-PIXEL blob holes, not per-pixel specks: a 1px speck in the
    // 1000x630 canvas averages away when the tile is shown at ~312px (a 3.2x
    // browser downscale), which is why brief 07/08 read clean at a glance even
    // though they looked textured zoomed in. Blobs ~1.4-4px survive that
    // downscale, so the chalk grain is actually visible at display size.
    const nDots = 300;
    for (let i = 0; i < nDots; i++) {
      const x = grng() * s, y = grng() * s;
      const r = 1.4 + grng() * grng() * 2.8;   // biased small, up to ~4px
      tcx.globalAlpha = 0.35 + grng() * 0.55;  // per-hole bite
      for (let dx = -s; dx <= s; dx += s)      // 9x draw => seamless tiling
        for (let dy = -s; dy <= s; dy += s) {
          tcx.beginPath(); tcx.arc(x + dx, y + dy, r, 0, Math.PI * 2); tcx.fill();
        }
    }
    _grainTile = tile;
  }

  // Padded bbox of the path (pad for the widest pass + a little slack).
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  const pad = Math.ceil(wt * wMul * CORE_MULT + HALO_DUST + 4);
  const ox = Math.floor(minX - pad), oy = Math.floor(minY - pad);
  const bw = Math.ceil(maxX - minX + pad * 2), bh = Math.ceil(maxY - minY + pad * 2);
  if (bw <= 0 || bh <= 0) return;

  const off = document.createElement('canvas');
  off.width = bw; off.height = bh;
  const o = off.getContext('2d');
  o.translate(-ox, -oy);
  o.lineCap = 'round'; o.lineJoin = 'round'; o.strokeStyle = col;

  // Grain scales WITH stroke width (brief 10): the tile's holes are a fixed
  // pixel size, so on a wide stroke they were too small to break the halo up —
  // it read as a smooth translucent glow instead of dusty chalk. Scaling the
  // pattern by width/GRAIN_REF_WIDTH keeps the chalk texture proportional at
  // any width (capped so it never gets blotchy). Built once, used by both
  // grain punches.
  const grainScale = Math.min(1.8, Math.max(1, Math.sqrt((wt * wMul) / GRAIN_REF_WIDTH)));
  const gpat = o.createPattern(_grainTile, 'repeat');
  if (gpat.setTransform) gpat.setTransform(new DOMMatrix([grainScale, 0, 0, grainScale, 0, 0]));

  // 1. soft dust halo — a constant fringe just beyond the core, dustier for
  //    older strokes (width-proportional halos glowed on wide strokes)
  o.globalAlpha = op * haloAlpha;
  o.lineWidth = wt * wMul * CORE_MULT + HALO_DUST;
  traceCR(o, pts); o.stroke();

  // 2. punch width-scaled grain into the halo (device space => cover bbox)
  o.save();
  o.setTransform(1, 0, 0, 1, 0, 0);
  o.globalCompositeOperation = 'destination-out';
  o.globalAlpha = 1;
  o.fillStyle = gpat;
  o.fillRect(0, 0, bw, bh);
  o.restore(); // restores transform + source-over + globalAlpha

  // 3. chunky core on top (wider than paper's core => heavier resting line)
  o.globalAlpha = op * CORE_ALPHA;
  o.lineWidth = wt * wMul * CORE_MULT;
  traceCR(o, pts); o.stroke();

  // 4. lighter grain punch over the core so the LINE itself reads as chalk
  //    (reduced globalAlpha => only a fraction of each hole bites, keeping the
  //    core mostly solid rather than breaking up the way the halo does)
  o.save();
  o.setTransform(1, 0, 0, 1, 0, 0);
  o.globalCompositeOperation = 'destination-out';
  o.globalAlpha = coreGrain;
  o.fillStyle = gpat;
  o.fillRect(0, 0, bw, bh);
  o.restore();

  ctx.drawImage(off, ox, oy);
}

/* ── Task 3 — density-based ambient smudge (brief 10, replaces brief 09's
   intersection smudge) ───────────────────────────────────────────────────
   Per Shivang: smudge is a general, roughly-random dust feel driven by local
   LINE DENSITY across the canvas — not precise per-crossing placement, and
   nothing tied to individual stroke/ball events. The old intersection approach
   also concretely MISSED clustered areas (coincident crossings collapsed onto
   one 8px point, and dense bundles of near-parallel strokes that rarely cross
   produced almost none), so a visibly busy region could get no dust. Density
   fixes that at the root: any dense region gets dust, crossings or not. */
function stridePts(pts, maxPts) {
  if (pts.length <= maxPts) return pts;
  const out = [], step = (pts.length - 1) / (maxPts - 1);
  for (let k = 0; k < maxPts; k++) out.push(pts[Math.round(k * step)]);
  return out;
}

/* PURE/headless and deterministic by construction (no rng — purely geometric):
   a coarse line-density grid. Each stroke's strided segments deposit weight
   (scaled by its wt) into every cell they pass through, sampled along the
   segment, so a cell that more/heavier line runs through accumulates more
   density. Reuses the stride machinery from the old intersection pass. */
function computeLineDensity(strokes, W, H, cellSize = 28) {
  const cols = Math.ceil(W / cellSize), rows = Math.ceil(H / cellSize);
  const cells = new Float32Array(cols * rows);
  for (const s of strokes) {
    const pts = stridePts(s.pts, 28);
    const wt = s.wt || 1;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      const steps = Math.max(1, Math.ceil(len / (cellSize * 0.5)));
      for (let k = 0; k <= steps; k++) {
        const t = k / steps;
        const cx = Math.floor((a.x + (b.x - a.x) * t) / cellSize);
        const cy = Math.floor((a.y + (b.y - a.y) * t) / cellSize);
        if (cx >= 0 && cy >= 0 && cx < cols && cy < rows) cells[cy * cols + cx] += wt;
      }
    }
  }
  return { cols, rows, cellSize, cells };
}

// Frozen approved product defaults, brief 17 review (2026-08-23): 0.055/0.45
// read as invisible at native res (BACKLOG diagnostic, brief 10 follow-up) —
// retuned and approved in the same session. No lab slider exists for these
// (BACKLOG explicitly deferred adding one until the values themselves were
// worth exposing); these constants ARE the frozen calibration.
const SMUDGE_TONE = '232,228,219'; // pale neutral chalk dust
const SMUDGE_ALPHA = 0.14;         // per-blob base opacity (density scales it up)
const DENSITY_FLOOR = 0.16;        // normalized density below which no dust falls
const SMUDGE_PROB = 0.6;           // per-cell smudge chance at max local density

/* PURE (rng injected, no DOM): scatter ambient smudge blobs, placement chance /
   size / opacity all weighted by each cell's normalized local density. Fixed-
   seed makeRng() from the caller (same discipline as the grain tile) keeps it
   deterministic; the randomness only makes it read as ambient dust rather than
   a mechanical grid. Dense knots reliably get dust; sub-floor cells get none. */
function scatterDensitySmudges(grid, rng, chalkWidthMult = 1.0) {
  const { cols, rows, cellSize, cells } = grid;
  let max = 0;
  for (let i = 0; i < cells.length; i++) if (cells[i] > max) max = cells[i];
  if (max <= 0) return [];
  const out = [];
  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const d = cells[cy * cols + cx] / max; // 0..1 normalized density
      if (d < DENSITY_FLOOR) continue;
      if (rng() >= SMUDGE_PROB * d) continue; // denser => more likely to smudge
      const x = (cx + rng()) * cellSize;
      const y = (cy + rng()) * cellSize;
      const r = (8 + d * 14) * chalkWidthMult; // denser => bigger dust
      const a = SMUDGE_ALPHA * (0.5 + 0.5 * d); // denser => stronger dust
      out.push({ x, y, r, a });
    }
  }
  return out;
}

/* Composites the smudge blobs — a render function (canvas allowed, same carve-
   out as the other two). Reuses the background's soft-radial-blob "medium": a
   pale neutral chalk-dust tone at low opacity. Only the WHERE changed from
   brief 09 (density, not crossings); the visual language is unchanged. */
function renderSmudges(ctx, points) {
  ctx.save();
  for (const pt of points) {
    const g = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.r);
    g.addColorStop(0, `rgba(${SMUDGE_TONE},${pt.a})`);
    g.addColorStop(1, `rgba(${SMUDGE_TONE},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(pt.x - pt.r, pt.y - pt.r, pt.r * 2, pt.r * 2);
  }
  ctx.restore();
}

/* computeLineDensity(strokes, w, h, cellPx) → { cols, rows, cellPx, cells }.
   `cells` is a row-major Float32Array normalised to [0,1] (max cell = 1;
   all-zero if there are no strokes). Each stroke deposits weight
   (proportional to its own `wt`) into every grid cell its polyline passes
   through, sampled along each segment, so a cell with more/heavier line
   through it accumulates more density. */
function computeLineDensity(strokes, w, h, cellPx = 28) {
  const cols = Math.ceil(w / cellPx), rows = Math.ceil(h / cellPx);
  const cells = new Float32Array(cols * rows);

  for (const s of strokes) {
    const pts = stridePts(s.pts, 28);
    const wt = s.wt || 1;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      const steps = Math.max(1, Math.ceil(len / (cellPx * 0.5)));
      for (let k = 0; k <= steps; k++) {
        const t = k / steps;
        const cx = Math.floor((a.x + (b.x - a.x) * t) / cellPx);
        const cy = Math.floor((a.y + (b.y - a.y) * t) / cellPx);
        if (cx >= 0 && cy >= 0 && cx < cols && cy < rows) cells[cy * cols + cx] += wt;
      }

  let max = 0;
  for (let i = 0; i < cells.length; i++) if (cells[i] > max) max = cells[i];

}

/* findDenseKnots(field, opts) → [{ x, y, density }], sorted descending by
   density. Greedy local-maxima selection: rank every above-floor cell by
   density, walk down the ranked list, keep a candidate only if it's at
   least `minSpacing` away from every candidate already kept. A plain
   top-N would just return a tight cluster around the single densest
   region — the spacing constraint is what makes these "knots" (plural,
   spread across the composition) rather than one hot spot.

   Deterministic, no rng: this only RANKS candidates. Task 1's seeded
   weighted sampling — which of these knots actually gets a splatter mark,
   and how many — is a separate, randomised concern layered on top by the
   caller, not this function's job. */
function findDenseKnots(field, opts = {}) {
  const { cols, rows, cellPx, cells } = field;
  const {
    densityFloor = 0.15,
    minSpacing = cellPx * 2.5,
    maxCandidates = 40,
  } = opts;

  const candidates = [];
  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const d = cells[cy * cols + cx];
      if (d < densityFloor) continue;
      candidates.push({ x: (cx + 0.5) * cellPx, y: (cy + 0.5) * cellPx, density: d });
    }
  }
  candidates.sort((a, b) => b.density - a.density);

  const kept = [];
  const minSpacingSq = minSpacing * minSpacing;
  for (const c of candidates) {
    if (kept.length >= maxCandidates) break;
    let tooClose = false;
    for (const k of kept) {
      const dx = c.x - k.x, dy = c.y - k.y;
      if (dx * dx + dy * dy < minSpacingSq) { tooClose = true; break; }
    }
    if (!tooClose) kept.push(c);
  }
  return kept;
}

  traceClosedCR(pc, points); // smooth closed curve through the wobble vertices, not straight edges

   Same shape family as buildPaintSurface, plus the composition-awareness
   inputs (strokes, palette) Plain mode doesn't need, plus the lab-
   controlled patch count (default 6, matching brief 13's old midpoint). */

  const colorWeights = palette.accents.map(a => ({ value: a, weight: a.weight }));

    const sizeNorm = Math.pow(rng(), PATCH_SIZE_POWER); // heavy-tailed toward small/mid

      // awareness, without depleting the pool (patches may reuse a busy
      // region; splatter's placement already used its own weighted draw).
      const knot = weightedPick(rng, knots.map(k => ({ value: k, weight: k.density })));

      cy = knot.y + (rng() - 0.5) * PATCH_KNOT_JITTER;

    const elongated = rng() < 0.45;

   1.0, `op` is accepted for signature parity with renderStroke/
   renderChalkStroke but never read. No second translucent pass of any kind:

   blend. Age fade and the weight/opacity range controls are paper-only —

   matter what the caller passes in.

   along its length): Catmull-Rom spine sampled densely, each sample offset
   perpendicular by half the local width, closed outline filled. Width at
   each sample is base wt scaled by a low-frequency sine wave across arc

   coordinates — purely deterministic, no injected rng (same idiom as

   Brief 14 cut its peak, reasoning pooling at hit points was repeating
   brief 02's cut ink-bloom mistake (hit-triggered placement is always
   boundary-pinned — see PROJECT-LOG.md 2026-07-09). Brief 15: any residual
   amount still rings the edge, since direction change only ever happens at
   a paddle or a wall — there is no partial fix, only gone. Pooling is

const WIDTH_VAR_MIN = 0.15, WIDTH_VAR_MAX = 4.0;   // brief 14 widened range — do not change (brief 15)
const WIDTH_VAR_UNDULATIONS_MIN = 0.5, WIDTH_VAR_UNDULATIONS_MAX = 1.5; // brief 14: fewer transitions

// GLSL-style deterministic hash — same family of trick as jitterPath's
// Math.sin(p.x*0.73+p.y*1.31): a scalar function of coordinates, no rng
// threading needed for per-stroke "seeded" jitter. hash1 also used by the
// patch wobble above.
function hash1(x) { const s = Math.sin(x) * 43758.5453123; return s - Math.floor(s); }
function hash2(x, y) { return hash1(x * 12.9898 + y * 78.233); }

// {x,y} points instead of issuing ctx bezier commands — the ribbon needs
// actual coordinates + normals, not just a stroke path.
function sampleSpine(pts, samplesPerSeg = 8) {
  if (pts.length < 2) return pts.slice();

  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1],
          p3 = pts[Math.min(i + 2, pts.length - 1)], t = 0.5;

        x: mu * mu * mu * p1.x + 3 * mu * mu * u * c1x + 3 * mu * u * u * c2x + u * u * u * p2.x,
        y: mu * mu * mu * p1.y + 3 * mu * mu * u * c1y + 3 * mu * u * u * c2y + u * u * u * p2.y,
      });

function arcLengths(samples) {
  const s = [0];
  for (let i = 1; i < samples.length; i++) {
    s.push(s[i - 1] + Math.hypot(samples[i].x - samples[i - 1].x, samples[i].y - samples[i - 1].y));
  }
  return { s, length: s[s.length - 1] };
}

function renderPaintStroke(ctx, pts, col, wt, op, opts = {}) {
  if (pts.length < 2) return;
  const {
    widthVariation = 1.0,   // 0 = uniform wt, 1 = full 0.15-4.0x wave
  } = opts;

  const samples = sampleSpine(pts, 8);
  if (samples.length < 2) return;
  const { s: arcS, length } = arcLengths(samples);

  const undulations = WIDTH_VAR_UNDULATIONS_MIN
    + hash2(pts[0].x, pts[0].y) * (WIDTH_VAR_UNDULATIONS_MAX - WIDTH_VAR_UNDULATIONS_MIN);
  const phase = hash2(pts[pts.length - 1].x, pts[pts.length - 1].y) * Math.PI * 2;

  function widthMultAt(i) {
    const t = length > 0 ? arcS[i] / length : 0;
    const wave = Math.sin(t * undulations * Math.PI * 2 + phase);       // -1..1
    const waveMult = WIDTH_VAR_MIN + (wave * 0.5 + 0.5) * (WIDTH_VAR_MAX - WIDTH_VAR_MIN);
    return 1 + (waveMult - 1) * widthVariation;
  }

  const left = [], right = [];
  for (let i = 0; i < samples.length; i++) {
    const p = samples[i];
    const pPrev = samples[Math.max(i - 1, 0)], pNext = samples[Math.min(i + 1, samples.length - 1)];
    let tx = pNext.x - pPrev.x, ty = pNext.y - pPrev.y;
    const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    const nx = -ty, ny = tx;
    const halfW = 0.5 * wt * widthMultAt(i);
    left.push({ x: p.x + nx * halfW, y: p.y + ny * halfW });
    right.push({ x: p.x - nx * halfW, y: p.y - ny * halfW });

  ctx.save();
  ctx.globalAlpha = 1.0; // always opaque — op is accepted for signature parity, never read
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();
  ctx.fill();
  // Rounded caps at both ends — radius follows local half-width, avoiding
  // a square-cornered bulge at a wide point in the width wave. Clean fills
  // only: no grain, no halo, no soft falloff.
  const r0 = Math.hypot(left[0].x - right[0].x, left[0].y - right[0].y) / 2;
  ctx.beginPath(); ctx.arc(samples[0].x, samples[0].y, r0, 0, Math.PI * 2); ctx.fill();
  const n = left.length - 1;
  const rN = Math.hypot(left[n].x - right[n].x, left[n].y - right[n].y) / 2;
  ctx.beginPath(); ctx.arc(samples[n].x, samples[n].y, rN, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
