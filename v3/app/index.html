<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen Pong v3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ── Tokens · DESIGN.md §2/§4/§5/§6 ── */
  :root {
    --color-bg:            #383838;
    --color-cta:           #464646;
    --color-disabled:      #777777;
    --color-lightest-grey: #C5C5C5;
    --color-canvas:        #FFF5E5;
    --color-canvas-border: #888888;
    --color-pink:          #FF68AE;
    --color-blue:          #689AFF;
    --color-green:         #8CFFB4;
    --color-orange:        #FFAE68;
    --color-cyan:          #68D7FF;

    /* DESIGN.md §2 flags --color-canvas-chalk UNRESOLVED (placeholder
       #383838, borrows the page bg). The real value is the chalkboard
       engine's own frozen ground constant (chalkboard.js CB_BASE,
       approved brief 17) — used here instead of the placeholder since
       the doodle draws the real engine texture, not a CSS approximation. */
    --color-canvas-chalk:  #1A1A1E;
    --color-chip-selected: #383838; /* DESIGN.md §2 proposed value */

    --space-xs: 4px;  --space-s: 8px;   --space-xxm: 12px; --space-xm: 16px;
    --space-m: 24px;  --space-l: 32px;  --space-xl: 40px;  --space-xxl: 48px;

    --radius:        48px;
    --radius-small:  12px;
    --radius-nested: 8px;

    --shadow-chip:   0 4px 24px rgba(0,0,0,0.29), inset 0 0 5px rgba(0,0,0,0.52);
    --shadow-canvas: 0 4px 24px rgba(0,0,0,0.28);
    --shadow-btn:    0 4px 24px rgba(0,0,0,0.16), inset 0 0 5px rgba(0,0,0,0.32);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--color-bg);
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Brief 20 Task 4: was top-anchored with asymmetric padding (32px
       top / 48px bottom), so the canvas cluster sat high with leftover
       space only below it on any viewport taller than the content.
       justify-content:center treats the whole visible .screen (tagline +
       canvas + palette dock, as one flex column) as a unit and centers
       it vertically; symmetric padding is just a minimum edge margin on
       short viewports, not a layout anchor. */
    justify-content: center;
    padding: var(--space-l) 0;
  }

  .screen { display: flex; flex-direction: column; align-items: center; }
  .screen[hidden] { display: none; }

  .mono {
    font-family: 'Space Mono', monospace; font-style: normal;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  }

  /* ── Header logo · playing/results stub screens · DESIGN.md §8 ── */
  .app-header { display: flex; justify-content: center; margin-bottom: var(--space-m); }
  .app-header svg { display: block; }

  /* ── Canvas · DESIGN.md §7 ── */
  .stage { position: relative; width: 1000px; height: 630px; max-width: 100%; }
  .canvas-wrap {
    position: absolute; inset: 0;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--color-canvas);
    box-shadow: var(--shadow-canvas);
  }
  .doodle-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 400ms linear; /* DESIGN.md §13 — surface switch cross-fade */
  }
  .frame {
    position: absolute; inset: 0;
    border-radius: var(--radius);
    border: 8px solid var(--color-canvas-border);
    pointer-events: none;
    z-index: 2;
  }

  /* ── Paddles · DESIGN.md §7/§8 — DOM divs, never canvas ── */
  .paddle { position: absolute; width: 8px; height: 64px; z-index: 3; }
  .paddle .bar { position: absolute; inset: 0; border-radius: 4px; }
  .paddle .dot { position: absolute; top: 26px; width: 12px; height: 12px; border-radius: 50%; }
  .paddle-left  { left: 0; }
  .paddle-left  .bar, .paddle-left  .dot { background: var(--color-pink); }
  .paddle-left  .dot { left: -20px; }
  .paddle-right { right: 0; }
  .paddle-right .bar, .paddle-right .dot { background: var(--color-blue); }
  .paddle-right .dot { right: -20px; }
  .you {
    position: absolute; right: calc(100% + 30px); top: 20px;
    white-space: nowrap;
    font-size: 12px; color: var(--color-pink);
  }

  /* ── Paddle-travel guardrails · brief 23 Task 1 ── Playing screen only:
     2px marks at PAD_MIN/PAD_MAX+PH on both canvas edges, telling the
     player where their reach ends and the wall begins. DOM chrome, same
     layer treatment as the paddles — above the canvas, below the frame
     ring — and positioned entirely by JS from physics.js's real constants
     (never hardcoded here). Never drawn into gamePersistCv: that canvas is
     the artwork, these are not marks the player made. */
  .guard {
    position: absolute; width: 16px; height: 2px;
    background: var(--color-canvas-border); /* #888888 — same grey as .frame */
    z-index: 1;
  }

  /* ── Control elevation · DESIGN.md §6/§10 ── */
  .ctrl-chip {
    height: var(--space-xxl);
    border-radius: var(--radius-small);
    background: var(--color-cta);
    box-shadow: var(--shadow-chip);
    display: flex;
    align-items: center;
  }

  .tagline { font-size: 14px; color: var(--color-lightest-grey); margin: 0; }
  .spacer-s { height: var(--space-s); }
  .spacer-m { height: var(--space-m); }

  /* ── Intro card · DESIGN.md §10 #intro-card (v3 opaque treatment) ── */
  .intro-stack {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: var(--space-xm);
  }
  #intro-card {
    width: 420px;
    background: var(--color-cta);
    border-radius: var(--radius-small);
    padding: var(--space-m) var(--space-xl);
    box-shadow: var(--shadow-chip);
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: var(--space-s);
  }
  #intro-card .sub { font-size: 14px; color: var(--color-disabled); margin: 0; }

  /* ── Surface selector · DESIGN.md §10 #surface-chip ──
     Absent in Step A (attract). Slides up on the first gesture, per
     brief 18 Task 3, and never leaves — that gesture also unlocks audio. */
  @keyframes zp-slide-up {
    from { transform: translateY(64px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }
  #surface-chip {
    width: 420px; padding: 0 var(--space-s); gap: var(--space-s);
    display: none;
  }
  [data-idle-step="armed"] #surface-chip {
    display: flex;
    animation: zp-slide-up 400ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  #surface-chip .tile {
    flex: 1; height: 32px;
    border: 0;
    border-radius: var(--radius-nested);
    background: transparent;
    display: flex; align-items: center; justify-content: center; gap: var(--space-s);
    cursor: pointer;
    transition: background 200ms linear;
    font-family: inherit;
  }
  #surface-chip .tile span { color: var(--color-lightest-grey); }
  #surface-chip .tile[aria-pressed="true"] { background: var(--color-chip-selected); }
  #surface-chip .tile[aria-pressed="true"] span { color: #FFFFFF; }
  #surface-chip .swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .sw-paper { background: var(--color-canvas); }
  .sw-chalk { background: var(--color-canvas-chalk); }
  .sw-paint { background: var(--color-orange); }

  /* ── Palette pill · DESIGN.md §10 #pal-pill ──
     Idle: static 5-dot display. Playing (brief 22): dots injected by JS,
     per-surface VARIABLE count — never assume five (5 paper / 3 chalk /
     3 paint, see #pg-pal-pill wiring). */
  .pal-pill { padding: 0 var(--space-xm); gap: var(--space-s); }
  .pal-pill .dot { width: 10px; height: 10px; border-radius: 50%; transition: transform 150ms; }
  .pal-pill .dot:hover { transform: scale(1.2); }
  .pal-pill .shuffle { margin-left: var(--space-s); cursor: pointer; }
  .pal-pill .shuffle:hover { stroke: #FFFFFF; }

  /* ── Playing screen control row · DESIGN.md §8 Screen 2 / §10 ──
     3-column grid, 1000px wide: pal-pill left, score-pill centred,
     restart+mute right. No surface selector, no density/timeline control —
     nothing about the painting is adjustable mid-rally. */
  #ctrl-row-playing {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 1000px;
    max-width: 100%;
  }
  #ctrl-row-playing > :first-child { justify-self: start; }
  #ctrl-row-playing > :last-child { justify-self: end; display: flex; gap: var(--space-xm); }
  #pg-score-pill {
    gap: var(--space-l);
    padding: 0 var(--space-m);
    min-width: 120px;
    justify-content: center;
  }
  #pg-score-pill span {
    font-family: 'Space Mono', monospace; font-style: normal; font-weight: 700;
    font-size: 18px; letter-spacing: 0.1em; color: #FFFFFF;
  }
  .icon-pill { padding: 0 14px; border: 0; cursor: pointer; }
  .icon-pill svg { opacity: 0.8; display: block; }
  .icon-pill:hover svg { opacity: 1; }

  /* Serve indicator · DESIGN.md §7 — grey ball outside the canvas
     top-left, shown between points while the next ball is pending. Never
     shown while a ball is in flight. */
  .serve-dot {
    position: absolute; left: -32px; top: -40px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--color-canvas-border);
    z-index: 3;
  }
  .serve-dot[hidden] { display: none; }

  /* ── Results stub (brief 23 builds this screen) ── */
  .stub-label { color: #FFFFFF; margin: 0 0 var(--space-m); }
  .stub-back {
    background: var(--color-cta);
    border: 0;
    border-radius: var(--radius-small);
    padding: var(--space-xxm) var(--space-m);
    color: #FFFFFF;
    box-shadow: var(--shadow-btn);
    cursor: pointer;
  }
  .stub-back:hover { opacity: 0.85; }
</style>
</head>

            <i class="swatch sw-paper"></i><span class="mono">paper</span>
          </button>
          <button class="tile" data-pick="chalk" aria-pressed="false">
            <i class="swatch sw-chalk"></i><span class="mono">chalkboard</span>
          </button>

      </div>

      <div class="paddle paddle-left" style="top:180px">
        <div class="bar"></div><div class="dot"></div><span class="you">you</span>
      </div>

        <div class="bar"></div><div class="dot"></div>
      </div>

    <div class="spacer-m"></div>

    <div class="ctrl-chip pal-pill" id="pal-pill">

        <polyline points="7,10 3,13.5 7,17"/><path d="M18 13.5H3"/>

<script type="module">
import { makeRng } from '../engine/rng.js';
import {
  W, H, BR, PH, PAD_MIN, PAD_MAX, WIN,
  mkBall, advanceBall, ballBall, levelUp, pickTargetY, updatePaddleAI,
} from '../engine/physics.js';
import { jitterPath, renderStroke, DEFAULT_STROKE_PARAMS } from '../engine/strokes.js';
import { buildSurface } from '../engine/surface.js';
import {
  buildChalkboardSurface, renderChalkStroke, CHALK_PALETTE,
  CHALK_DEFAULT_WIDTH_MULT,
} from '../engine/chalkboard.js';
import { buildPaintSurface, PAINT_WIDTH_BASE, PAINT_DEFAULT_WIDTH_VARIATION } from '../engine/paint.js';
import { buildPalette, GROUND_LIBRARY } from '../engine/palette.js';
import { DEFAULT_PALETTE } from '../engine/simulate.js';

/* ════════════════════════════════════════════════════════════════════
   TASK 1 — screen-state machine. Three states only: idle / playing /
   results (root game + DESIGN.md §8). idle carries its own Step A/B
   sub-state (brief 18 Task 3) which is independent of the screen state.
   ════════════════════════════════════════════════════════════════════ */
const screens = {
  idle: document.getElementById('screen-idle'),
  playing: document.getElementById('screen-playing'),
  results: document.getElementById('screen-results'),
};
let screenState = 'idle';
function setScreen(next) {
  screenState = next;
  Object.entries(screens).forEach(([k, el]) => { el.hidden = (k !== next); });
}
// Results stub transition (brief 23 builds the real reveal).
document.getElementById('btn-results-back').addEventListener('click', () => setScreen('idle'));

/* ════════════════════════════════════════════════════════════════════
   TASK 2 — engine integration. The three surface renderers, dispatched
   by key. This IS the "run a live simulation through each renderer"
   proof: the idle doodle below drives it continuously, live, per frame.
   ════════════════════════════════════════════════════════════════════ */
const idleEl = document.getElementById('screen-idle');

// ── Fixed seed (brief 19 Task 1) ──────────────────────────────────────
// The idle doodle is ambiance, not the artwork: one fixed seed, identical
// every load. This is what makes a surface switch a pure restyle of
// IDENTICAL stroke geometry (Task 2) instead of a fresh random simulation
// — every rng stream below is a deterministic salt off this one constant,
// never Math.random().
const DOODLE_SEED = 2026;

// One paint palette, built once from the fixed seed (buildPalette draws
// from palette.js's curated hue library — never arithmetic hue generation).
// Brief 21 Task 2: ground pinned to Cream (GROUND_LIBRARY[0], the approved
// lab default — PAINT-MODE.md / brief 16) instead of letting buildPalette
// draw a random ground (it had landed on Pale lavender). scheme/baseIndex
// are left undrawn so the three accents still come from the real scheme
// system (palette.js's curated hue library + harmony rules), same as the
// lab — only the ground is fixed, nothing is swapped in from DEFAULT_
// PALETTE (the unrelated 5-colour game/paddle palette).
const paintPalette = buildPalette(makeRng((DOODLE_SEED ^ 0x5EED1DEA) >>> 0), { groundHex: GROUND_LIBRARY[0].hex });

// Same weighted/shuffled flattening art-lab.html uses to turn a 3-accent
// weighted palette into a round-robin array (lab-only bookkeeping, not
// engine logic — the engine only exposes weights, not a cycle order).
function weightedPaletteArray(palette, seed) {
  const arr = [];
  palette.accents.forEach(a => {
    const n = Math.max(1, Math.round(a.weight * 20));
    for (let k = 0; k < n; k++) arr.push(a.hex);
  });
  const shuffleRng = makeRng((seed ^ 0x9E3779B9) >>> 0);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(shuffleRng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Per-surface colour cycle. Chalk is tri-colour (brief 19 Task 3) —
// CHALK_PALETTE, matching how chalk was approved in the lab — not the
// white-mode override brief 18 shipped.
const PALETTE_ARRAYS = {
  paper: DEFAULT_PALETTE,
  chalk: CHALK_PALETTE,
  paint: weightedPaletteArray(paintPalette, (DOODLE_SEED ^ 0x5EED1DEA) >>> 0),
};

function colourFor(surfaceKey, index) {
  const arr = PALETTE_ARRAYS[surfaceKey];
  return arr[index % arr.length];
}

// Fixed, distinct salts so each surface's ground texture is decorrelated
// from the others but still deterministic off DOODLE_SEED (Task 1).
const GROUND_SEEDS = {
  paper: (DOODLE_SEED ^ 0x1A2B3C4D) >>> 0,
  chalk: (DOODLE_SEED ^ 0x2B3C4D5E) >>> 0,
  paint: (DOODLE_SEED ^ 0x3C4D5E6F) >>> 0,
};

function buildGround(surfaceKey, rng) {
  if (surfaceKey === 'chalk') return buildChalkboardSurface(W, H, rng);
  if (surfaceKey === 'paint') return buildPaintSurface(W, H, rng, paintPalette.ground);
  return buildSurface(W, H, rng);
}

/* ════════════════════════════════════════════════════════════════════
   TASK 5 — live surface-aware idle doodle.
   ════════════════════════════════════════════════════════════════════ */

// Accumulate-then-hard-reset (brief 20 Task 2, replaces brief 18/19's
// rolling one-stroke-at-a-time eviction): a rally builds to this many
// committed strokes, then the canvas clears to bare ground and a new
// one begins — no per-stroke fade-out. Brief 21 Task 3: brief 20's value
// (8, inherited unchanged from brief 18's old ROLLING cap) read as a
// sparse loop for a build-then-clear cycle — raised so the canvas
// actually fills before it resets. Tuned by eye.
const DOODLE_RESET_THRESHOLD = 18;
const JITTER_AMPLITUDE = 0.5; // shared default — paper.js/paint.js both use it

const physRng = makeRng(DOODLE_SEED);
const groundCache = {}; // surfaceKey -> offscreen canvas, built once and reused

function getGround(surfaceKey) {
  if (!groundCache[surfaceKey]) {
    groundCache[surfaceKey] = buildGround(surfaceKey, makeRng(GROUND_SEEDS[surfaceKey]));
  }
  return groundCache[surfaceKey];
}

let currentSurface = 'paper';
let committedStrokes = []; // canonical, surface-agnostic: {pts, wt, op, index}
let strokeIndex = 0;

// persistCv accumulates ground + all committed strokes for currentSurface —
// same persistent-canvas architecture as root index.html's drawCv: never
// cleared except a full rebuild (surface switch, or eviction past the cap,
// since a canvas can't un-draw a single stroke).
const persistCv = document.createElement('canvas');
persistCv.width = W; persistCv.height = H;
const persistCx = persistCv.getContext('2d');

function rebuildPersist(surfaceKey) {
  persistCx.clearRect(0, 0, W, H);
  const ground = getGround(surfaceKey);
  if (surfaceKey === 'chalk') {
    // Brief 20 Task 3: buildChalkboardSurface's real texture (smudge
    // blobs, grain, vignette) is there but reads as flat near-black at
    // doodle scale — the same "tuned too faint to read" pattern BACKLOG.md
    // already logged once for this exact module. A presentational
    // brightness lift on THIS draw call only makes it legible; the
    // engine's own pixels (and its frozen constants) are untouched.
    // brightness() is a flat multiply, so it's the right tool for a
    // near-black image — contrast() pivots around mid-grey and CRUSHES
    // shadow detail further toward 0 for values this far below it,
    // which made an earlier attempt at this filter read even flatter.
    //
    // Brief 21 Task 1: that brightness lift is also what exposed a denim/
    // blue cast. CB_BASE (#1A1A1E) and the grain/smudge tint are only
    // faintly cool by design (chalkboard.js's own comment: "cool tint:
    // nudge blue a touch above red/green") — invisible at the engine's
    // native near-black brightness, and correctly so; approved and frozen
    // at brief 17. A flat brightness() MULTIPLY scales every channel by
    // the same factor, so it scales that small existing R/G-vs-B gap by
    // 2.4x too, turning an intentional whisper of cool into an obvious
    // blue cast. That's a doodle-side artifact of lifting brightness, not
    // a wrong value in chalkboard.js — grayscale() strips hue/chroma
    // entirely while leaving the (already brightness-lifted) per-pixel
    // luminance — i.e. the grain and smudge texture itself — untouched,
    // landing on neutral slate grey. chalkboard.js is not touched by this
    // fix; the lab (which never applies this doodle-only filter) is
    // unaffected by construction.
    persistCx.filter = 'brightness(2.4) grayscale(1)';
    persistCx.drawImage(ground, 0, 0);
    persistCx.filter = 'none';
  } else {
    persistCx.drawImage(ground, 0, 0);
  }
  committedStrokes.forEach(st => renderStrokeAs(persistCx, surfaceKey, st.pts, st.wt, st.op, st.index, { taperHead: st.taperHead, taperTail: st.taperTail }));
}

function commitStroke(rawPts, wt, op, taperOpts) {
  if (rawPts.length < 2) return;
  // Re-zip the baked-per-point .w (brief 19 Task 5) onto jitterPath's
  // output: jitterPath (engine fn) returns fresh {x,y} objects for every
  // interior point, dropping any extra fields, but it's a 1:1 same-
  // length map so index correspondence is exact. Without this, a
  // committed paint stroke would lose its baked widths on every point
  // except the two endpoints — precisely what caused brief 20 Task 1a's
  // pop (committed strokes fell back to the engine's OWN independent
  // width algorithm, which disagreed with the live-drawn shape).
  const jittered = jitterPath(rawPts, JITTER_AMPLITUDE);
  const pts = jittered.map((p, i) => ({ x: p.x, y: p.y, w: rawPts[i].w }));
  // Emergence-taper flags (brief 23 Task 3), stored on the committed stroke
  // so rebuildPersist can reproduce the exact same render later. Defaults
  // true; false only at the 500-point overflow seam (see stepDoodle).
  const to = taperOpts || {};
  const taperHead = to.taperHead !== false;
  const taperTail = to.taperTail !== false;
  const st = { pts, wt, op, index: strokeIndex++, taperHead, taperTail };

  if (committedStrokes.length >= DOODLE_RESET_THRESHOLD) {
    // Brief 20 Task 2: hard reset, not a rolling fade — the rally holds
    // at full density for one beat, then this new stroke starts a clean
    // cycle from bare ground.
    committedStrokes = [];
    rebuildPersist(currentSurface);
  }
  committedStrokes.push(st);
  renderStrokeAs(persistCx, currentSurface, st.pts, st.wt, st.op, st.index, { taperHead, taperTail }); // incremental
}

// Two stacked canvases so a surface switch can cross-fade (DESIGN.md §13:
// 400ms linear) instead of popping. Physics/stroke state below is never
// touched by a switch (brief 19 Task 2) — only which layer is live and
// what persistCv holds.
const layerEls = { A: document.getElementById('doodle-a'), B: document.getElementById('doodle-b') };
let activeKey = 'A', inactiveKey = 'B';
layerEls[activeKey].style.opacity = '1';

function switchSurface(newKey) {
  if (newKey === currentSurface) return;
  currentSurface = newKey;
  rebuildPersist(newKey); // re-render the SAME committed stroke data through the new renderer

  const newEl = layerEls[inactiveKey];
  const newCtx = newEl.getContext('2d');
  newCtx.clearRect(0, 0, W, H);
  newCtx.drawImage(persistCv, 0, 0);

  layerEls[inactiveKey].style.opacity = '1';
  layerEls[activeKey].style.opacity = '0';
  [activeKey, inactiveKey] = [inactiveKey, activeKey];
}

// Static paddles (idle screen never moves them, per design) double as
// real collision surfaces for the doodle ball — same sweptHit the live
// game uses, so the idle rally is genuine physics, not a canned path.
const paddleL = { y: 180 };
const paddleR = { y: 430 };

// ── Shared paint-ribbon machinery (brief 19 Task 5, revised brief 20 Task
// 1a, generalised brief 22 Task 1) ───────────────────────────────────────
// paint.js's renderPaintStroke computes each sample's width from the
// stroke's CURRENT total arc length and CURRENT endpoint (a hash of the
// last point) — correct for a finished stroke rendered once, but wrong for
// anything that grows or gets re-rendered against a different reference.
// Bake each point's width multiplier ONCE, at the moment it's appended,
// from the stroke's ABSOLUTE arc length so far (not normalized to an
// unknowable final total) and a phase/wavelength fixed at the stroke's
// first point. Never recomputed afterward.
//
// Brief 19 scoped this to the doodle's live/uncommitted stroke only, on
// the theory that a committed pts array never changes again so the
// engine's own renderPaintStroke was "already correct" for it — true in
// isolation, but wrong in practice: the engine's algorithm and this baked
// one are DIFFERENT formulas (independently-derived phase/frequency), so a
// stroke rendered live-then-committed visibly snapped to a different shape
// the instant it committed (brief 20 Task 1a's "pop"). Brief 20's fix: one
// renderer for a paint stroke's WHOLE life, live or committed, in the
// doodle. Brief 22 Task 1: the live game has the identical growing-stroke
// problem, plus DESIGN.md §13 forbids the reveal from re-drawing marks
// differently than the rally showed them — so this has to be the SAME
// mechanism, not a second copy of it. makePaintTracker below is that one
// mechanism, parameterised so the doodle and the game can use different
// width numbers while sharing the exact same bake-on-append math and the
// same drawPaintRibbon fill (further down, unchanged, already generic).
// The real engine renderPaintStroke is untouched and still used for the
// actual end-game artwork (brief 24's job — reveal/results); this stays
// app-side, per PORT-PLAN.md/BACKLOG.md's explicit deferral of promoting it
// into paint.js to the brief-26 integration pass.
// Brief 23 Task 4: every stroke used to get the same treatment (one sine
// undulation, seeded phase only) — variety was all in the offset, none in
// the character. Three profiles now, seeded per stroke: flat (0.40, one
// constant multiplier), ramp (0.35, monotonic thick<->thin across cfg.refLen
// px), wave (0.25, the original sine — unchanged). Weights/bands below are
// Shivang's calibration targets, shipped as given.
const PAINT_PROFILE_FLAT_WEIGHT = 0.40, PAINT_PROFILE_RAMP_WEIGHT = 0.35; // remainder (0.25) is 'wave'
const PAINT_FLAT_BAND_LO = 0.35, PAINT_FLAT_BAND_HI = 0.80; // middle band of [varMin,varMax] — an extreme is a hairline or a slab, not a stroke
const PAINT_RAMP_MIN_SEP = 0.4; // fraction of [varMin,varMax] — below this a ramp just reads as a flat

function makePaintTracker(rng, cfg) {
  // cfg: { varMin, varMax, undulationsMin, undulationsMax, refLen, widthVariation }
  // widthVariation mirrors paint.js's renderPaintStroke shape exactly
  // (`1 + (waveMult-1)*widthVariation`) — at widthVariation=1 (both the
  // doodle and the game use 1) this reduces to plain waveMult, so the
  // formula generalises brief 20's doodle-only version losslessly.
  const RANGE = cfg.varMax - cfg.varMin;

  function widthMultAt(arcLen, ball) {
    let waveMult;
    if (ball._paintProfile === 'flat') {
      waveMult = ball._paintFlatMult;
    } else if (ball._paintProfile === 'ramp') {
      const t = Math.min(1, arcLen / cfg.refLen); // clamped past refLen — brief 23 Task 4
      waveMult = ball._paintRampA + (ball._paintRampB - ball._paintRampA) * t;
    } else { // 'wave' — brief 19/20's original sine undulation, unchanged
      const wave = Math.sin((arcLen / ball._paintWavelength) * Math.PI * 2 + ball._paintPhase);
      waveMult = cfg.varMin + (wave * 0.5 + 0.5) * RANGE;
    }
    return 1 + (waveMult - 1) * cfg.widthVariation;
  }

  return {
    // Called once whenever a NEW stroke starts (any surface — cheap, and
    // keeps the rng stream surface-independent: see the doodle/game
    // instantiation comments for why that matters to each).
    //
    // Determinism invariant (brief 23 Task 4 — do not break this): draws a
    // FIXED number of rng values (7) on every call regardless of which
    // profile ends up selected — every draw happens unconditionally, the
    // profile only decides how the ALREADY-DRAWN numbers get used. A draw
    // made only inside one profile's branch would make the rng stream
    // depend on which profile got picked, which desyncs it from any other
    // path through the same seed (surface switches, replays) — the same
    // hazard the wavelength/phase draws already had to respect.
    startTrail(ball, x, y) {
      ball.pts = [{ x, y }];
      ball._paintArcLen = 0;
      ball._paintTaperHead = true; // brief 23 Task 3 — reset true; overflow continuations clear this explicitly

      const profileRoll = rng();
      ball._paintPhase = rng() * Math.PI * 2;
      const undulations = cfg.undulationsMin + rng() * (cfg.undulationsMax - cfg.undulationsMin);
      ball._paintWavelength = cfg.refLen / undulations;
      const flatRoll = rng();
      const rampARoll = rng();
      const rampBRoll = rng();
      const rampDirRoll = rng();

      if (profileRoll < PAINT_PROFILE_FLAT_WEIGHT) {
        ball._paintProfile = 'flat';
        ball._paintFlatMult = cfg.varMin + (PAINT_FLAT_BAND_LO + flatRoll * (PAINT_FLAT_BAND_HI - PAINT_FLAT_BAND_LO)) * RANGE;
      } else if (profileRoll < PAINT_PROFILE_FLAT_WEIGHT + PAINT_PROFILE_RAMP_WEIGHT) {
        ball._paintProfile = 'ramp';
        let lo = cfg.varMin + Math.min(rampARoll, rampBRoll) * RANGE;
        let hi = cfg.varMin + Math.max(rampARoll, rampBRoll) * RANGE;
        const minSep = PAINT_RAMP_MIN_SEP * RANGE;
        if (hi - lo < minSep) {
          // Push apart around the shared midpoint, then slide the whole
          // pair back inside [varMin, varMax] if that spilled over an edge
          // — never re-compresses the separation, unlike a plain clamp.
          const mid = (lo + hi) / 2;
          lo = mid - minSep / 2; hi = mid + minSep / 2;
          if (lo < cfg.varMin) { hi += cfg.varMin - lo; lo = cfg.varMin; }
          if (hi > cfg.varMax) { lo -= hi - cfg.varMax; hi = cfg.varMax; }
        }
        // Direction seeded 50/50 — thick→thin or thin→thick.
        ball._paintRampA = rampDirRoll < 0.5 ? hi : lo;
        ball._paintRampB = rampDirRoll < 0.5 ? lo : hi;
      } else {
        ball._paintProfile = 'wave';
      }

      ball.pts[0].w = widthMultAt(0, ball);
    },
    // Called once per frame when the current position is appended to the
    // trail — bakes that ONE new point's width and never touches earlier
    // points (the actual fix).
    appendPoint(ball, x, y) {
      const prev = ball.pts[ball.pts.length - 1];
      const pt = { x, y };
      ball._paintArcLen += Math.hypot(x - prev.x, y - prev.y);
      pt.w = widthMultAt(ball._paintArcLen, ball);
      ball.pts.push(pt);
    },
  };
}

// paint.js expresses undulation frequency as a cycle-COUNT over the
// finished stroke's total length — meaningless while growing, since the
// total isn't known yet. Converted to a fixed spatial wavelength (px) via
// one reference length, chosen to match a typical stroke's length so the
// live wave reads at a similar visual frequency to a committed stroke.
// Shared by doodle and game: the wavelength math is independent of width
// base, and no brief has asked for a different reference length or
// undulation range for the game.
const PAINT_UNDULATIONS_MIN = 0.5, PAINT_UNDULATIONS_MAX = 1.5; // mirrors paint.js's own (private) range
const PAINT_UNDULATION_REF_LEN = 500;

// Doodle instance — own rng stream, advanced by exactly 2 draws (phase,
// undulations) at EVERY new stroke start regardless of which surface is on
// screen, so the sequence never depends on the player's surface-switching
// path (would otherwise desync Task 1/2's "identical geometry" guarantee).
// Width range is doodle-scoped (brief 20 Task 1b: paint.js's frozen
// product values read cartoonish-huge against paper/chalk at ambient
// doodle scale) — NOT paint.js's PAINT_WIDTH_BASE/variation, which the
// GAME instance uses instead (see the game-state section below).
const paintWidthRng = makeRng((DOODLE_SEED ^ 0x50A17B17) >>> 0);
const DOODLE_PAINT_WIDTH_BASE = 3.0;
const doodlePaintTracker = makePaintTracker(paintWidthRng, {
  varMin: 0.15, varMax: 2.2,
  undulationsMin: PAINT_UNDULATIONS_MIN, undulationsMax: PAINT_UNDULATIONS_MAX,
  refLen: PAINT_UNDULATION_REF_LEN,
  widthVariation: 1.0, // doodle never scaled the wave down
});

// Emergence taper (brief 23 Task 3) — a second, DRAW-TIME width multiplier,
// separate from the baked-at-append .w above. Zero at a stroke's nearer end,
// full by PAINT_TAPER_LEN px along the polyline — so the ink comes OUT OF
// the ball instead of the ball sitting inside a blunt-ended ribbon several
// times its own diameter. Starting value, tune by eye against a recording.
const PAINT_TAPER_LEN = 28;

// smoothstep, not t*t: the brief's fallback if the ball still doesn't read
// as a solid dot against the ink. Shipped as smoothstep after review.
function paintTaper(distAlongPolyline) {
  const t = Math.max(0, Math.min(1, distAlongPolyline / PAINT_TAPER_LEN));
  return t * t * (3 - 2 * t);
}

// Ribbon fill for a paint stroke — live or committed, doodle or game, same
// function either way (brief 20 Task 1a, generalised brief 22 Task 1).
// Same tangent/normal/half-width/rounded-cap construction as paint.js's
// renderPaintStroke, but driven by each point's PRE-BAKED .w (never
// recomputed) TIMES the draw-time emergence taper above. Raw points only
// (no Catmull-Rom spine resampling) — this doesn't need the finished-
// artwork's exact sample density, only a shape that's stable across a
// stroke's whole life, growing or committed. This is the ONLY function in
// the app that fills paint-stroke pixels — verify by construction: grep
// finds exactly one definition, and the engine's own renderPaintStroke is
// never called anywhere in this file.
//
// taperOpts = { taperHead, taperTail }, both default true. Both false only
// at the 500-point overflow seam (brief 23 Task 3's "one seam, named"): the
// commit that gets cut off skips its tail taper, and the continuation that
// picks the line back up skips its head taper, so an arbitrary buffer-
// length boundary doesn't pinch a line that is visibly still travelling.
//
// Why this cannot reintroduce brief 20's commit-time pop: distHead/distTail
// are measured along the CURRENT pts array's own arc length. While a stroke
// is still growing, its last point IS the ball, so the tail-taper region
// travels with the ball frame to frame — that motion is the emergence
// effect, not a bug. The instant the stroke commits, that same last point
// becomes permanent and every later render (this function, on the exact
// same frozen array) reproduces the exact same pixels — live and committed
// are the same function over the same data at every frame, so there is no
// discontinuity AT the commit frame. The per-point .w baked at append time
// (brief 19/20's invariant) is still never recomputed; this taper bends
// "constant per-point width forever" only inside a bounded window that is
// live NOW and frozen forever after, which is not the same claim.
function drawPaintRibbon(ctx, pts, wt, col, taperOpts) {
  if (pts.length < 2) return;
  const taperHead = !taperOpts || taperOpts.taperHead !== false;
  const taperTail = !taperOpts || taperOpts.taperTail !== false;

  const n = pts.length;
  const cum = new Array(n);
  cum[0] = 0;
  for (let i = 1; i < n; i++) {
    cum[i] = cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  }
  const total = cum[n - 1];

  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const pPrev = pts[Math.max(i - 1, 0)], pNext = pts[Math.min(i + 1, n - 1)];
    let tx = pNext.x - pPrev.x, ty = pNext.y - pPrev.y;
    const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    const nx = -ty, ny = tx;

    let taper = 1;
    if (taperHead) taper = Math.min(taper, paintTaper(cum[i]));
    if (taperTail) taper = Math.min(taper, paintTaper(total - cum[i]));

    const halfW = 0.5 * wt * (p.w != null ? p.w : 1) * taper;
    left.push({ x: p.x + nx * halfW, y: p.y + ny * halfW });
    right.push({ x: p.x - nx * halfW, y: p.y - ny * halfW });
  }
  ctx.save();
  ctx.globalAlpha = 1.0;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();
  ctx.fill();
  const r0 = Math.hypot(left[0].x - right[0].x, left[0].y - right[0].y) / 2;
  ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, r0, 0, Math.PI * 2); ctx.fill();
  const last = n - 1;
  const rN = Math.hypot(left[last].x - right[last].x, left[last].y - right[last].y) / 2;
  ctx.beginPath(); ctx.arc(pts[last].x, pts[last].y, rN, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Single stroke renderer for both committed strokes (rebuildPersist,
// commitStroke) and the live/growing one (drawFrame) — the same function,
// same inputs in, same pixels out, at every point in a stroke's life.
// That equality is what makes brief 20 Task 1a's commit-time pop
// impossible by construction: there is no second algorithm to disagree.
function renderStrokeAs(ctx, surfaceKey, pts, wt, op, index, taperOpts) {
  const col = colourFor(surfaceKey, index);
  if (surfaceKey === 'chalk') {
    renderChalkStroke(ctx, pts, col, wt, op, CHALK_DEFAULT_WIDTH_MULT, 0);
  } else if (surfaceKey === 'paint') {
    drawPaintRibbon(ctx, pts, wt * DOODLE_PAINT_WIDTH_BASE, col, taperOpts);
  } else {
    renderStroke(ctx, pts, col, wt, op, DEFAULT_STROKE_PARAMS);
  }
}

let ball = mkBall(physRng, 1, null, [1.0, 2.4], [0.50, 0.68]);
doodlePaintTracker.startTrail(ball, ball.x, ball.y);

function stepDoodle() {
  // Faithful to simulate.js/root index.html's update(): advanceBall moves
  // the ball and resolves wall/paddle collisions FIRST; a commit fires
  // using the trail as it stood before this frame's point is appended (so
  // the committed stroke ends at the previous frame's position, and the
  // new stroke starts fresh at the post-bounce position) — only THEN does
  // this frame's position get pushed, unconditionally, exactly once.
  const events = advanceBall(ball, paddleL, paddleR, 0, physRng);

  events.forEach(() => {
    commitStroke(ball.pts, ball.wt, ball.op, { taperHead: ball._paintTaperHead, taperTail: true });
    doodlePaintTracker.startTrail(ball, ball.x, ball.y);
  });
  doodlePaintTracker.appendPoint(ball, ball.x, ball.y);

  if (ball.pts.length > 500) {
    // Overflow seam (brief 23 Task 3, "the one seam, named"): this commit's
    // tail is NOT tapered (the line keeps travelling past this arbitrary
    // buffer boundary), and the continuation's head is marked not to taper
    // either — arc-length/phase/profile stay untouched, only the taper
    // flag changes, so this is still the same stroke, not a new one.
    commitStroke(ball.pts, ball.wt, ball.op, { taperHead: ball._paintTaperHead, taperTail: false });
    ball.pts = ball.pts.slice(-4); // buffer trim only — same stroke continues, arc-length/phase untouched
    ball._paintTaperHead = false;
  }

  if (ball.x < -30 || ball.x > W + 30) {
    if (ball.pts.length >= 2) commitStroke(ball.pts, ball.wt, ball.op, { taperHead: ball._paintTaperHead, taperTail: true });
    ball = mkBall(physRng, 1, null, [1.0, 2.4], [0.50, 0.68]);
    doodlePaintTracker.startTrail(ball, ball.x, ball.y);
  }
}

function drawFrame() {
  const el = layerEls[activeKey];
  const ctx = el.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(persistCv, 0, 0);
  if (ball.pts.length > 1) {
    // in-flight stroke: raw (unjittered) pts, same as root's live-frame
    // overlay — jitter is a commit-time effect, not a per-frame one. Tail
    // always tapers live (the last point is the ball itself); head follows
    // ball._paintTaperHead so an overflow continuation doesn't show a pinch
    // where the previous piece was just cut off.
    renderStrokeAs(ctx, currentSurface, ball.pts, ball.wt, ball.op, strokeIndex, { taperHead: ball._paintTaperHead, taperTail: true });
  }
  // Task 4 — ball marker, always visible, every surface: the moving point
  // that makes the doodle legible as a rally, not just accumulating trails.
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = colourFor(currentSurface, strokeIndex);
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BR * 0.9, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function doodleLoop() {
  if (screenState === 'idle') {
    stepDoodle();
    drawFrame();
  }
  requestAnimationFrame(doodleLoop);
}
rebuildPersist(currentSurface);
requestAnimationFrame(doodleLoop);

/* ════════════════════════════════════════════════════════════════════════
   BRIEF 22 — THE PLAYING SCREEN. Everything below is game-scoped: its own
   persistent canvas, ground cache, committed strokes, palette state and
   paint tracker, separate from the doodle's (which keeps running, paused,
   in the background — screenState gates both loops so they never step
   concurrently). Surface is chosen at idle and locked for the rally: the
   game never calls switchSurface; it just reads currentSurface once.
   ════════════════════════════════════════════════════════════════════════ */

// ── Task 6 — per-game seed ────────────────────────────────────────────
// One seed per game; every other stream in this section is a fixed salt
// off it via makeRng, mirroring DOODLE_SEED's pattern exactly. This
// Math.random() call — inside startGame(), one line, commented — is the
// only one in the render/physics path for the whole game.
let gameSeed = 0;
let gamePhysRng, gameGroundSeeds, gamePaintWidthRng;

// ── Task 1's shared machinery, game-scoped config ─────────────────────
// PAINT_WIDTH_BASE / PAINT_DEFAULT_WIDTH_VARIATION are paint.js's real,
// frozen, approved-2026-07-21 product constants — imported above, used
// here, never re-declared. undulation range and reference length are
// shared with the doodle (no different numbers given for the game; that
// math doesn't depend on width scale).
//
// GAME_PAINT_WIDTH_VAR_MIN/MAX are NOT a mirror of anything in paint.js —
// that comment stood here through brief 22, but brief 23 Task 2 made it
// false, on purpose. paint.js's private WIDTH_VAR_MIN/MAX (0.15/4.0) were
// approved in the lab on twelve static seeded artworks; the first time that
// 4.0 was seen in a live rally at 1000×630 with a moving ball, it produced
// a 57.6px worst case — a bar, not a brush stroke. These are now the live
// PRODUCT'S OWN values, and paint.js's pair is the one that's stale and
// pending reconciliation (BACKLOG.md, extended brief 23) — not the reverse.
// Do NOT "fix" this back to match paint.js; if the numbers still disagree
// when that reconciliation happens, paint.js moves to these, not this file
// to paint.js's frozen pair.
const GAME_PAINT_WIDTH_VAR_MIN = 0.25, GAME_PAINT_WIDTH_VAR_MAX = 1.6; // was 0.15/4.0 — max cut 60% (brief 23 Task 2), min raised so the thin end reads as a hairline brush, not a single pixel
let gamePaintTracker; // built fresh each game — see startGame()

// ── Task 4 — per-surface ground, paint's neutral-substrate exception ──
const gameGroundCache = {};
function getGameGround(surfaceKey) {
  if (!gameGroundCache[surfaceKey]) {
    if (surfaceKey === 'chalk') {
      gameGroundCache[surfaceKey] = buildChalkboardSurface(W, H, makeRng(gameGroundSeeds.chalk));
    } else if (surfaceKey === 'paint') {
      // PAINT-MODE.md §4 (LOCKED): "The ground does not exist during
      // play. The player paints on a neutral substrate; at game end the
      // artwork re-renders with the ground composited beneath the marks."
      // The neutral substrate is --color-canvas-paint-base (DESIGN.md §2)
      // = #FFF5E5, i.e. the PAPER ground — so this deliberately calls
      // buildSurface (paper's real ground function), not buildPaintSurface.
      // The chosen paint ground (gamePaintPalette.ground, picked in
      // startGame()) composites in only at the reveal — brief 23's job.
      gameGroundCache[surfaceKey] = buildSurface(W, H, makeRng(gameGroundSeeds.paint));
    } else {
      gameGroundCache[surfaceKey] = buildSurface(W, H, makeRng(gameGroundSeeds.paper));
    }
  }
  return gameGroundCache[surfaceKey];
}

// Chalk brightness/grayscale lift decision (brief 22 Task 4 explicitly
// asks for one, stated, not silently inherited): the doodle's
// brightness(2.4) grayscale(1) filter (briefs 20/21) exists because the
// idle doodle sits at ambient scale behind a card, easy to glance past.
// The game is the foreground — DESIGN.md's own Verification for this
// brief asks for the real engine grounds with no mention of a lift — so
// NO filter is applied here. getGameGround's chalk branch returns
// buildChalkboardSurface's pixels completely as-drawn.

// ── Task 5 — per-surface palette state (game-scoped, independently
// shufflable — never touches the doodle's fixed PALETTE_ARRAYS) ────────
let gamePaperOrder;   // shuffled index map into DEFAULT_PALETTE (5)
let gameChalkOrder;   // shuffled index map into CHALK_PALETTE (3)
let gamePaintPalette; // buildPalette() result — ground fixed once per game, not touched by shuffle
let gamePaintArray;   // weightedPaletteArray(gamePaintPalette, ...) — a flattened, weighted 20-slot
                       // round-robin CYCLE used for stroke colour assignment, NOT the dot list —
                       // see gamePalPillHexesFor for the 3 distinct accents shown in the pill.

function gamePaletteArrayFor(surfaceKey) {
  if (surfaceKey === 'chalk') return gameChalkOrder.map(i => CHALK_PALETTE[i]);
  if (surfaceKey === 'paint') return gamePaintArray;
  return gamePaperOrder.map(i => DEFAULT_PALETTE[i]);
}
function gameColourFor(surfaceKey, index) {
  const arr = gamePaletteArrayFor(surfaceKey);
  return arr[index % arr.length];
}
// Task 5's own table: "Paint | the three accents from buildPalette | 3" —
// the pill shows distinct swatches, not the weighted cycling array above.
function gamePalPillHexesFor(surfaceKey) {
  if (surfaceKey === 'chalk') return gameChalkOrder.map(i => CHALK_PALETTE[i]);
  if (surfaceKey === 'paint') return gamePaintPalette.accents.map(a => a.hex);
  return gamePaperOrder.map(i => DEFAULT_PALETTE[i]);
}
function shuffleArrayInPlace(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ── Persistent canvas + stroke commit — same architecture as the doodle
// (and root index.html's drawCv): ground + all committed strokes, never
// cleared except a new game. One canvas only — unlike the doodle, the
// game's surface never switches mid-rally, so there's no cross-fade need.
const gamePersistCv = document.createElement('canvas');
gamePersistCv.width = W; gamePersistCv.height = H;
const gamePersistCx = gamePersistCv.getContext('2d');

let gameCommittedStrokes = [];
let gameStrokeIndex = 0;

// Single stroke renderer for the game, live or committed — same principle
// as the doodle's renderStrokeAs (Task 1): paint routes through the ONE
// shared drawPaintRibbon, at product width (PAINT_WIDTH_BASE), so a
// stroke can never be drawn two different ways at two points in its life,
// rally or reveal.
function renderGameStrokeAs(ctx, surfaceKey, pts, wt, op, index, taperOpts) {
  const col = gameColourFor(surfaceKey, index);
  if (surfaceKey === 'chalk') {
    renderChalkStroke(ctx, pts, col, wt, op, CHALK_DEFAULT_WIDTH_MULT, 0);
  } else if (surfaceKey === 'paint') {
    drawPaintRibbon(ctx, pts, wt * PAINT_WIDTH_BASE, col, taperOpts);
  } else {
    renderStroke(ctx, pts, col, wt, op, DEFAULT_STROKE_PARAMS);
  }
}

function rebuildGamePersist() {
  gamePersistCx.clearRect(0, 0, W, H);
  gamePersistCx.drawImage(getGameGround(currentSurface), 0, 0); // no filter — see chalk decision above
  gameCommittedStrokes.forEach(st => renderGameStrokeAs(gamePersistCx, currentSurface, st.pts, st.wt, st.op, st.index, { taperHead: st.taperHead, taperTail: st.taperTail }));
}

function commitGameStroke(rawPts, wt, op, eventType, taperOpts) {
  if (rawPts.length < 2) return;
  // Same re-zip as the doodle's commitStroke (Task 1/brief 20): jitterPath
  // returns fresh {x,y} objects for interior points, dropping the baked
  // .w — re-attach it by index so a committed paint stroke keeps the
  // exact widths it had live.
  const jittered = jitterPath(rawPts, JITTER_AMPLITUDE);
  const pts = jittered.map((p, i) => ({ x: p.x, y: p.y, w: rawPts[i].w }));
  // Emergence-taper flags (brief 23 Task 3) — see commitStroke's doodle
  // twin. Defaults true; false only at the 500-point overflow seam.
  const to = taperOpts || {};
  const taperHead = to.taperHead !== false;
  const taperTail = to.taperTail !== false;
  const st = { pts, wt, op, index: gameStrokeIndex++, event: eventType, taperHead, taperTail };
  gameCommittedStrokes.push(st);
  renderGameStrokeAs(gamePersistCx, currentSurface, st.pts, st.wt, st.op, st.index, { taperHead, taperTail }); // incremental — never cleared mid-game
  return st;
}

// ── Task 3 — the game loop ─────────────────────────────────────────────
let gameBall, gamePaddleL, gamePaddleR;
let gamePs = 0, gameAs = 0, gameLv = 1, gameAiSpd = 2.6;
let gameMouseY = H / 2, gamePrevMouseY = H / 2;
let gameServing = false; // true during the short beat between a miss and the next spawn
let gameLastEndedStrokes = null; // handoff for brief 23 — {strokes, seed, surface}

const gameCanvas = document.getElementById('game-canvas');
const gamePaddleLEl = document.getElementById('game-paddle-left');
const gamePaddleREl = document.getElementById('game-paddle-right');
const serveDotEl = document.getElementById('serve-dot');
const scorePEl = document.getElementById('pg-score-p');
const scoreAEl = document.getElementById('pg-score-a');
const pgPalPillEl = document.getElementById('pg-pal-pill');
const pgShuffleEl = document.getElementById('pg-shuffle');

// ── Task 1 (brief 23) — paddle-travel guardrails. Static DOM chrome, set
// once, never touched by the game loop. Positions derived from physics.js's
// real PAD_MIN/PAD_MAX/PH/W — not the brief's example numbers (38/590) —
// so this stays correct if those constants ever change.
(function placeGuardrails() {
  const topY = PAD_MIN - 2;  // flush above the paddle's highest position
  const botY = PAD_MAX + PH; // flush below the paddle's lowest bottom edge
  const rightX = W - 16;     // guard is 16px wide — flush to the right edge
  document.getElementById('guard-tl').style.cssText = `left:0px; top:${topY}px;`;
  document.getElementById('guard-bl').style.cssText = `left:0px; top:${botY}px;`;
  document.getElementById('guard-tr').style.cssText = `left:${rightX}px; top:${topY}px;`;
  document.getElementById('guard-br').style.cssText = `left:${rightX}px; top:${botY}px;`;
})();

// Root index.html's own pattern: listen on document (not just the canvas)
// so the cursor tracks correctly even over the paddles/frame, mapped into
// canvas coordinate space via getBoundingClientRect. Gated to the playing
// screen only.
document.addEventListener('mousemove', (e) => {
  if (screenState !== 'playing') return;
  const r = gameCanvas.getBoundingClientRect();
  gameMouseY = (e.clientY - r.top) * (H / r.height);
});

function updateGameScoreUI() {
  scorePEl.textContent = String(gamePs);
  scoreAEl.textContent = String(gameAs);
}

function updateGamePalPill() {
  pgPalPillEl.querySelectorAll('.dot').forEach(d => d.remove());
  gamePalPillHexesFor(currentSurface).forEach(hex => {
    const dot = document.createElement('i');
    dot.className = 'dot';
    dot.style.background = hex;
    pgPalPillEl.insertBefore(dot, pgShuffleEl);
  });
}

// Ported verbatim from simulate.js's checkLevel — every 2 total points,
// lv++, aiSpd = min(2.6 + lv*0.40, 7.5), levelUp(balls). One ball at a
// time (MAX_B = 1, as in the live build), so levelUp/pickTargetY are
// called with a 1-element array.
function checkGameLevel() {
  const tot = gamePs + gameAs;
  if (tot > 0 && tot % 2 === 0) {
    gameLv++;
    gameAiSpd = Math.min(2.6 + gameLv * 0.40, 7.5);
    levelUp([gameBall]);
  }
}

function spawnGameBall() {
  gameBall = mkBall(gamePhysRng, gameLv, null, [1.0, 2.4], [0.50, 0.68]);
  gamePaintTracker.startTrail(gameBall, gameBall.x, gameBall.y);
  gameServing = false;
  serveDotEl.hidden = true;
}

function startGame() {
  // Task 6 — the one permitted Math.random() call, generating this game's
  // single seed; every stream below is makeRng(seed ^ salt), never
  // Math.random() again.
  gameSeed = Math.floor(Math.random() * 1e9);
  gamePhysRng = makeRng(gameSeed);
  gameGroundSeeds = {
    paper: (gameSeed ^ 0x1A2B3C4D) >>> 0,
    chalk: (gameSeed ^ 0x2B3C4D5E) >>> 0,
    paint: (gameSeed ^ 0x3C4D5E6F) >>> 0,
  };
  gamePaintWidthRng = makeRng((gameSeed ^ 0x50A17B18) >>> 0); // distinct salt from the doodle's own 0x50A17B17
  gamePaintTracker = makePaintTracker(gamePaintWidthRng, {
    varMin: GAME_PAINT_WIDTH_VAR_MIN, varMax: GAME_PAINT_WIDTH_VAR_MAX,
    undulationsMin: PAINT_UNDULATIONS_MIN, undulationsMax: PAINT_UNDULATIONS_MAX,
    refLen: PAINT_UNDULATION_REF_LEN,
    widthVariation: PAINT_DEFAULT_WIDTH_VARIATION, // imported — paint.js's real frozen default (1.0)
  });

  // Palette: paper/chalk start in identity order (re-shuffled only via
  // Task 5's shuffle control — PAINT-MODE.md §2 is LOCKED, never generate
  // a colour); paint draws a real scheme via the curated hue library.
  gamePaperOrder = DEFAULT_PALETTE.map((_, i) => i);
  gameChalkOrder = CHALK_PALETTE.map((_, i) => i);
  gamePaintPalette = buildPalette(makeRng((gameSeed ^ 0x6A2F1C9E) >>> 0));
  gamePaintArray = weightedPaletteArray(gamePaintPalette, (gameSeed ^ 0x6A2F1C9E) >>> 0);

  Object.keys(gameGroundCache).forEach(k => delete gameGroundCache[k]);
  gameCommittedStrokes = [];
  gameStrokeIndex = 0;
  gamePs = 0; gameAs = 0; gameLv = 1; gameAiSpd = 2.6;
  gamePaddleL = { y: (PAD_MIN + PAD_MAX) / 2 };
  gamePaddleR = { y: (PAD_MIN + PAD_MAX) / 2 };
  gamePrevMouseY = gameMouseY;

  rebuildGamePersist();
  updateGameScoreUI();
  updateGamePalPill();
  spawnGameBall();
}

function stepGame() {
  if (gameServing) return; // short beat — ball not moving yet, nothing to advance

  // Left paddle: mouse-driven. padVelL is this frame's RAW mouse-Y delta
  // (before clamping) — matching root index.html's update(), not
  // simulate.js's tVirtual stand-in — because sweptHit's paddle-velocity
  // spin transfer is a core physics behaviour, not a detail.
  const padVelL = gameMouseY - gamePrevMouseY;
  gamePrevMouseY = gameMouseY;
  gamePaddleL.y = Math.max(PAD_MIN, Math.min(PAD_MAX, gameMouseY - PH / 2));

  // Right paddle: AI, via the engine's real updatePaddleAI, fed REAL
  // wall-clock time (Date.now()) rather than simulate.js's tVirtual —
  // tVirtual/PHASE_OFFSET_L/REACTION_DELAY_FRAMES exist only for
  // simulate.js's headless player STAND-IN (no wall clock, no human
  // input) and do not belong in the live game, which has both. Not "fixed"
  // to tVirtual — this is the deliberate, documented choice.
  const targetR = pickTargetY([gameBall], 'R');
  updatePaddleAI(gamePaddleR, targetR, gameAiSpd, Date.now(), 0);

  const events = advanceBall(gameBall, gamePaddleL, gamePaddleR, padVelL, gamePhysRng);
  events.forEach(ev => {
    commitGameStroke(gameBall.pts, gameBall.wt, gameBall.op, ev.type, { taperHead: gameBall._paintTaperHead, taperTail: true });
    gamePaintTracker.startTrail(gameBall, gameBall.x, gameBall.y);
  });
  gamePaintTracker.appendPoint(gameBall, gameBall.x, gameBall.y);

  if (gameBall.pts.length > 500) {
    // Overflow seam (brief 23 Task 3) — see stepDoodle's twin for the full
    // rationale. Tail not tapered on this piece, head not tapered on the
    // continuation; geometry/arc-length/profile otherwise untouched.
    commitGameStroke(gameBall.pts, gameBall.wt, gameBall.op, 'overflow', { taperHead: gameBall._paintTaperHead, taperTail: false });
    gameBall.pts = gameBall.pts.slice(-4);
    gameBall._paintTaperHead = false;
  }

  ballBall([gameBall], gamePhysRng); // one ball: a no-op today, kept for engine-call parity with simulate.js

  if (gameBall.x < -30 || gameBall.x > W + 30) {
    const rightMissed = gameBall.x < -30; // ball passed the left edge -> right/AI scores
    const isGameEnd = rightMissed ? (gameAs + 1 >= WIN) : (gamePs + 1 >= WIN);
    if (gameBall.pts.length >= 2) {
      commitGameStroke(gameBall.pts, gameBall.wt, gameBall.op, isGameEnd ? 'gameEnd' : 'score', { taperHead: gameBall._paintTaperHead, taperTail: true });
    }
    if (rightMissed) gameAs++; else gamePs++;
    updateGameScoreUI();
    checkGameLevel();

    if (gamePs >= WIN || gameAs >= WIN) {
      gameLastEndedStrokes = { strokes: gameCommittedStrokes.slice(), seed: gameSeed, surface: currentSurface };
      setScreen('results'); // brief 23 builds the real reveal on top of this handoff
      return;
    }

    gameServing = true;
    serveDotEl.hidden = false;
    setTimeout(() => { if (screenState === 'playing') spawnGameBall(); }, 550); // brief serve beat — a rally game, not a menu
  }
}

function updateGamePaddleDOM() {
  gamePaddleLEl.style.top = gamePaddleL.y + 'px';
  gamePaddleREl.style.top = gamePaddleR.y + 'px';
}

function drawGameFrame() {
  const ctx = gameCanvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(gamePersistCv, 0, 0);
  if (!gameServing && gameBall.pts.length > 1) {
    // in-flight stroke: raw (unjittered) pts — jitter is a commit-time
    // effect, same as the doodle. Taper opts mirror drawFrame's doodle
    // twin — see stepGame's overflow branch for when taperHead goes false.
    renderGameStrokeAs(ctx, currentSurface, gameBall.pts, gameBall.wt, gameBall.op, gameStrokeIndex, { taperHead: gameBall._paintTaperHead, taperTail: true });
  }
  if (!gameServing) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = gameColourFor(currentSurface, gameStrokeIndex);
    ctx.beginPath();
    ctx.arc(gameBall.x, gameBall.y, BR * 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  updateGamePaddleDOM();
}

function gameLoop() {
  if (screenState === 'playing') {
    stepGame();
    drawGameFrame();
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// ── Task 5 — shuffle. Re-rolls the palette AND re-renders the whole
// painting through the new colours (never just the next stroke onward —
// that produces a two-palette painting and reads as broken). Paint draws
// a genuinely new scheme; paper/chalk re-roll the assignment ORDER, never
// the hexes (PAINT-MODE.md §2, LOCKED). Entropy comes from Date.now(), not
// Math.random() — Task 6 keeps that to exactly the one line in
// startGame(); a shuffle click is a live UI action, not part of the
// reproducible physics/render stream, but it still doesn't need a second
// raw-random call to get fresh entropy each click. Measured cost is
// logged to the console — see the session report for the number.
let shuffleNonce = 0;
pgShuffleEl.addEventListener('click', (e) => {
  e.stopPropagation();
  const shuffleSeed = (Date.now() ^ (shuffleNonce++)) >>> 0;
  const shuffleRng = makeRng(shuffleSeed);
  const t0 = performance.now();
  if (currentSurface === 'paint') {
    gamePaintPalette = buildPalette(shuffleRng, { groundHex: gamePaintPalette.ground }); // ground fixed — not part of shuffle
    gamePaintArray = weightedPaletteArray(gamePaintPalette, shuffleSeed);
  } else if (currentSurface === 'chalk') {
    shuffleArrayInPlace(gameChalkOrder, shuffleRng);
  } else {
    shuffleArrayInPlace(gamePaperOrder, shuffleRng);
  }
  rebuildGamePersist(); // restyle the WHOLE painting — committed strokes keep geometry, only colour changes
  updateGamePalPill();
  const ms = performance.now() - t0;
  console.log(`[brief 22 Task 5] pal-pill shuffle re-render: ${ms.toFixed(1)}ms — ${gameCommittedStrokes.length} strokes, ${currentSurface}`);
});

// ── Task 7 — restart and mute ──────────────────────────────────────────
document.getElementById('pg-restart').addEventListener('click', () => {
  // Fresh seed, cleared canvas, score 0-0, level 1, SAME surface — does
  // not return to idle. startGame() already does exactly this.
  startGame();
});
document.getElementById('pg-mute').addEventListener('click', () => {
  muted = !muted;
  if (muted) stopBGM(); else startBGM();
});

/* ════════════════════════════════════════════════════════════════════
   TASK 4 — surface selector. Ships as product UI (brief 18 Task 4).
   ════════════════════════════════════════════════════════════════════ */
document.querySelectorAll('#surface-chip .tile').forEach(tile => {
  tile.addEventListener('click', (e) => {
    e.stopPropagation(); // must not also trigger the idle->playing gesture below
    document.querySelectorAll('#surface-chip .tile').forEach(t => {
      t.setAttribute('aria-pressed', String(t === tile));
    });
    switchSurface(tile.dataset.pick);
  });
});

/* ════════════════════════════════════════════════════════════════════
   TASK 3 — idle two-step + audio unlock.
   Step A (attract): card only. First gesture (space/click/touchstart)
   arms Step B (surface selector slides up) AND is the audio-unlock
   gesture — root CLAUDE.md §4: AudioContext can only unlock on a real
   gesture, never mousemove. A second gesture while armed starts the game
   (idle -> playing, per DESIGN.md §5's state table).
   ════════════════════════════════════════════════════════════════════ */

// ── BGM — Oolong.mp3, root CLAUDE.md §4's protected pattern verbatim.
// new Audio() + createMediaElementSource(), never fetch/decodeAudioData.
let actx = null, muted = false;
let ooAudio = null, ooGain = null, ooSrc = null;

function initOolong() {
  if (ooAudio) return;
  ooAudio = new Audio('../../Oolong.mp3');
  ooAudio.loop = true;
  ooAudio.crossOrigin = 'anonymous';
  ooSrc = actx.createMediaElementSource(ooAudio);
  ooGain = actx.createGain();
  ooGain.gain.value = 0;
  ooSrc.connect(ooGain);
  ooGain.connect(actx.destination);
}

async function startBGM() {
  if (muted) return;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  await actx.resume();
  initOolong();
  ooAudio.currentTime = 0;
  ooAudio.play().catch(() => {});
  ooGain.gain.cancelScheduledValues(actx.currentTime);
  ooGain.gain.setValueAtTime(0, actx.currentTime);
  ooGain.gain.linearRampToValueAtTime(0.72, actx.currentTime + 2.5);
}

function stopBGM() {
  if (!ooGain || !ooAudio || !actx) return;
  const t = actx.currentTime;
  ooGain.gain.cancelScheduledValues(t);
  ooGain.gain.setValueAtTime(ooGain.gain.value, t);
  ooGain.gain.linearRampToValueAtTime(0, t + 2.5);
  setTimeout(() => { ooAudio.pause(); }, 2600);
}

const idleSub = document.getElementById('idle-sub');

function armIdle() {
  if (idleEl.dataset.idleStep === 'armed') return;
  idleEl.dataset.idleStep = 'armed';
  idleSub.textContent = 'choose a surface, then space to serve';
  startBGM(); // fire-and-forget: startBGM is itself async/awaits actx.resume()
}

function beginGame() {
  if (idleEl.dataset.idleStep !== 'armed') return;
  setScreen('playing');
  startGame(); // brief 22 Task 3 — real game, replacing the brief-18/19/20/21 stub
}

function onGesture(e) {
  if (screenState !== 'idle') return;
  if (idleEl.dataset.idleStep !== 'armed') armIdle();
  else beginGame();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); onGesture(e); }
});
document.getElementById('screen-idle').addEventListener('click', onGesture);
document.getElementById('screen-idle').addEventListener('touchstart', onGesture, { passive: true });

// Brief 22 Task 7: BGM continues across idle -> playing uninterrupted —
// armIdle() (above) already started it on the idle screen's first gesture.
// Brief 18's stub had a fade-down-on-leaving-idle hook here; removed per
// this brief's explicit instruction (scaffolding, not a real audio rule).
document.getElementById('btn-results-back').addEventListener('click', () => stopBGM());
</script>
