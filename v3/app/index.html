// ── BGM — Oolong.mp3, root CLAUDE.md §4's protected pattern verbatim.
// new Audio() + createMediaElementSource(), never fetch/decodeAudioData.
let actx = null, muted = false;
updateMuteButton(); // brief 25 Task 2 — sync icon/aria to the actual default state
let ooAudio = null, ooGain = null, ooSrc = null;

function initOolong() {
  if (ooAudio) return;
  ooAudio = new Audio('../../Oolong.mp3');
  ooAudio.loop = true;
  ooAudio.crossOrigin = 'anonymous';
  ooSrc = actx.createMediaElementSource(ooAudio);
  ooGain = actx.createGain();
  ooGain.gain.value = 0;
  ooSrc.connect(ooGain);
  ooGain.connect(actx.destination);
}

// Brief 28 Task 5b — 0.72 at rest (idle); ducked 20% while the player is in
// the game AND held through results (sndGameOver needs the room) so it
// never swells back up while the bell is still ringing. Restored only on
// an explicit return to idle (goToIdleArmed, Task 2/3).
const BGM_LEVEL_IDLE = 0.72;
const BGM_LEVEL_DUCKED = 0.58;
function setBGMLevel(level, rampMs = 600) {
  if (!ooGain || !actx) return;
  const t = actx.currentTime;
  ooGain.gain.cancelScheduledValues(t);
  ooGain.gain.setValueAtTime(ooGain.gain.value, t);
  ooGain.gain.linearRampToValueAtTime(level, t + rampMs / 1000); // ~600ms — a step reads as a glitch
}

async function startBGM() {
  if (muted) return;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  initSfxBus(); // brief 28 Task 5a — created alongside actx, the only place actx itself is created
  await actx.resume();
  initOolong();
  ooAudio.currentTime = 0;
  ooAudio.play().catch(() => {});
  ooGain.gain.cancelScheduledValues(actx.currentTime);
  ooGain.gain.setValueAtTime(0, actx.currentTime);
  ooGain.gain.linearRampToValueAtTime(BGM_LEVEL_IDLE, actx.currentTime + 2.5); // root CLAUDE.md §4's own fade-in timing — unrelated to the 600ms duck ramps above, untouched
}

function stopBGM() {
  if (!ooGain || !ooAudio || !actx) return;
  const t = actx.currentTime;
  ooGain.gain.cancelScheduledValues(t);
  ooGain.gain.setValueAtTime(ooGain.gain.value, t);
  ooGain.gain.linearRampToValueAtTime(0, t + 2.5);
  setTimeout(() => { ooAudio.pause(); }, 2600);
}

/* ════════════════════════════════════════════════════════════════════════
   BRIEF 27 — SFX. Ported VERBATIM from root index.html (~line 651-789):
   same oscillator types, frequencies, ramps, durations, gains — tuned by
   ear over the live build's whole history, not re-derived here. root
   CLAUDE.md §4 is binding: all seven functions always present, never
   removed or merged, wrapped in try/catch so a failed oscillator can never
   take down the game loop (kept from root, unchanged).

   The one deliberate adaptation: root's ac() lazily CREATES an
   AudioContext on any call, from anywhere. Here every function early-
   returns if actx is null instead — actx only exists after the idle
   screen's first real gesture (brief 18 Task 3, root CLAUDE.md §4: a
   gesture is what's allowed to unlock Web Audio, and a stray SFX call
   during idle is not one). Never creating a second context, never a
   console error from calling into a null one.

   Brief 28 Task 5a — every SFX now routes through ONE shared bus instead
   of straight to actx.destination. Root's individual gains (sndScratch's
   click at 0.49, and so on) are tuned relative to EACH OTHER, not to an
   absolute loudness target — multiplying every literal by ~2.5 to make
   the whole layer louder would push several past 1.0, clip on the
   destination's summing, and destroy exactly the relative mix that makes
   scratch/thud/chalk read as distinct objects. One gain node instead:
   every literal stays at root's tuned value, SFX_BUS_GAIN is the only
   knob, and a limiter catches whatever peaks the boost creates. */
const SFX_BUS_GAIN = 2.5; // the target from the brief — see PROJECT-LOG for whether the limiter had to work for it
let sfxBus = null, sfxLimiter = null;
function initSfxBus() {
  if (sfxBus) return;
  sfxBus = actx.createGain();
  sfxBus.gain.value = SFX_BUS_GAIN;
  sfxLimiter = actx.createDynamicsCompressor();
  sfxLimiter.threshold.value = -6;
  sfxLimiter.knee.value = 6;
  sfxLimiter.ratio.value = 12;
  sfxLimiter.attack.value = 0.003;
  sfxLimiter.release.value = 0.15;
  sfxBus.connect(sfxLimiter);
  sfxLimiter.connect(actx.destination);
}

function tone(p = {}) {
  if (muted || !actx || !sfxBus) return;
  const { freq = 440, type = 'sine', gain = 0.1, dur = 0.1, freqEnd = null, attack = 0.003, detune = 0 } = p;
  try {
    const a = actx, o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(sfxBus); o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime); o.detune.setValueAtTime(detune, a.currentTime);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, a.currentTime + dur);
    g.gain.setValueAtTime(0, a.currentTime); g.gain.linearRampToValueAtTime(gain, a.currentTime + attack);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.start(a.currentTime); o.stop(a.currentTime + dur + 0.02);
  } catch (e) {}
}

function nz(p = {}) {
  if (muted || !actx || !sfxBus) return;
  const { gain = 0.06, dur = 0.04, freq = 800, q = 10 } = p;
  try {
    const a = actx, buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = a.createGain(); src.connect(f); f.connect(g); g.connect(sfxBus);
    g.gain.setValueAtTime(gain, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    src.start(); src.stop(a.currentTime + dur + 0.02);
  } catch (e) {}
}

// Shared bell-partial helpers — brief 28 Tasks 5c/5d. A struck bell/bowl is
// an INHARMONIC partial stack: a short noise strike transient plus several
// sine partials at non-integer frequency ratios, each with its own
// exponential decay, plus one partial detuned ~0.3-0.4% from its own
// fundamental (the "beat partner") — two very-close-but-not-identical
// sines produce the slow amplitude beating real struck metal has, which a
// single clean sine can never sound like. Integer ratios would make an
// organ, not a bell; skipping the beat partner would make a synth pad, not
// a bowl. One shared pair of helpers so sndPoint and sndGameOver are
// verifiably the same RECIPE at different numbers, not two hand-written
// near-duplicates that quietly drift apart later.
function bellPartial(a, freq, gain, decay, attack, startAt) {
  const o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(sfxBus);
  o.type = 'sine';
  const t = a.currentTime + startAt;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  o.start(t); o.stop(t + decay + 0.02);
}
function bellStrike(a, freq, q, gain, dur, startAt) {
  const t = a.currentTime + startAt;
  const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfxBus);
  src.start(t); src.stop(t + dur + 0.005);
}

// Paddle hit — sharp click transient + wooden body resonance.
function sndScratch() {
  if (muted || !actx || !sfxBus) return;
  try {
    const a = actx;
    const clickDur = 0.018;
    const cbuf = a.createBuffer(1, Math.ceil(a.sampleRate * clickDur), a.sampleRate);
    const cd = cbuf.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * 0.7;
    const csrc = a.createBufferSource(); csrc.buffer = cbuf;
    const cf = a.createBiquadFilter(); cf.type = 'bandpass';
    cf.frequency.value = 1800; cf.Q.value = 0.8;
    const cg = a.createGain();
    cg.gain.setValueAtTime(0.49, a.currentTime);
    cg.gain.exponentialRampToValueAtTime(0.001, a.currentTime + clickDur);
    csrc.connect(cf); cf.connect(cg); cg.connect(sfxBus);
    csrc.start(); csrc.stop(a.currentTime + clickDur + 0.005);
    const o = a.createOscillator(), og = a.createGain();
    o.connect(og); og.connect(sfxBus);
    o.type = 'sine';
    o.frequency.setValueAtTime(420, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(180, a.currentTime + 0.06);
    og.gain.setValueAtTime(0.36, a.currentTime);
    og.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.08);
    o.start(a.currentTime); o.stop(a.currentTime + 0.09);
  } catch (e) {}
}

// Wall bounce — plastic click + short plastic body thump.
function sndThud() {
  if (muted || !actx || !sfxBus) return;
  try {
    const a = actx;
    const dur = 0.038;
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.6;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 2200; f.Q.value = 0.9;
    const g = a.createGain();
    g.gain.setValueAtTime(0.29, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(); src.stop(a.currentTime + dur + 0.005);
    const o = a.createOscillator(), og = a.createGain();
    o.connect(og); og.connect(sfxBus);
    o.type = 'sine';
    o.frequency.setValueAtTime(160, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, a.currentTime + 0.035);
    og.gain.setValueAtTime(0.21, a.currentTime);
    og.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.04);
    o.start(a.currentTime); o.stop(a.currentTime + 0.045);
  } catch (e) {}
}

// Ball-to-ball collision. DORMANT in v3: physics.js's ballBall only ever
// receives stepGame's single-element [gameBall] array (MAX_B is 1 here,
// same as the live build), so its collide-event branch can never fire and
// this function is never actually called. Ported and wired anyway per
// root CLAUDE.md §4 — do not delete this as dead code.
function sndCollide() {
  if (muted || !actx || !sfxBus) return;
  nz({ gain: 0.33, dur: 0.035, freq: 1800, q: 5 });
  tone({ freq: 300, freqEnd: 185, type: 'triangle', gain: 0.23, dur: 0.06 });
}

// Point scored — brief 28 Task 5c rebuilds this from a bare 320Hz sine
// (no attack, disappeared under BGM) into a struck bell/rin. Numbers are
// the brief's starting recipe, shipped unchanged — see bellPartial's
// comment for why the stack is shaped this way.
function sndPoint() {
  if (muted || !actx || !sfxBus) return;
  try {
    const a = actx;
    const fundamental = 660;
    bellStrike(a, 3000, 1.5, 0.10, 0.012, 0);
    bellPartial(a, fundamental, 0.30, 3.0, 0.004, 0);
    bellPartial(a, fundamental * 2.72, 0.16, 2.0, 0.004, 0);
    bellPartial(a, fundamental * 5.06, 0.08, 1.2, 0.004, 0);
    bellPartial(a, fundamental * 8.7, 0.04, 0.6, 0.004, 0);
    bellPartial(a, fundamental * 1.003, 0.12, 3.0, 0.004, 0); // beat partner — don't skip, see bellPartial's comment
  } catch (e) {}
}

// Level up — every 2 total points (checkGameLevel). Not rebuilt as a bell
// (brief 28 Task 5 only respecs sndPoint/sndGameOver) — same simple sine
// as root, just rerouted onto sfxBus like everything else.
function sndLevelUp() {
  if (muted || !actx || !sfxBus) return;
  try {
    const a = actx;
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(sfxBus);
    o.type = 'sine';
    o.frequency.setValueAtTime(440, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(438, a.currentTime + 1.0);
    g.gain.setValueAtTime(0, a.currentTime);
    g.gain.linearRampToValueAtTime(0.33, a.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 1.2);
    o.start(a.currentTime); o.stop(a.currentTime + 1.3);
  } catch (e) {}
}

// Protected spec — root CLAUDE.md §4 / v3/CLAUDE.md: fires EXACTLY ONCE
// per paddle hit, called from inside the paddleHit branch of stepGame's
// events.forEach (see below) — never on a frame clock, never behind a
// cooldown timer. advanceBall's typed event array is what makes "exactly
// once" free: the event only exists on the frame a hit actually happened.
function sndChalk() {
  if (muted || !actx || !sfxBus) return;
  try {
    const a = actx;
    const dur = 0.055;
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.018;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 2800; f.Q.value = 2.5;
    const g = a.createGain();
    g.gain.setValueAtTime(0.028, a.currentTime);
    g.gain.linearRampToValueAtTime(0.001, a.currentTime + 0.055);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(); src.stop(a.currentTime + 0.06);
  } catch (e) {}
}

// Game over — brief 31 Task 3 rebuilds brief 28's single-fundamental
// two-strike version ("same 220Hz bell, second hit at 45% gain") into an
// actual "da-DUM": two DIFFERENT pitches, D4 then G3, a falling perfect
// fourth. Unambiguous as two notes without becoming a melody — still one
// bell answering itself, just at a different pitch, which is what makes it
// read as an ending rather than a phrase.
//
// Everything else from brief 28's bell recipe carries over unchanged in
// SHAPE, scaled per strike from the brief's own table (gain 0.72x / 1.15x,
// decay 1.8s / 5.0s): the same inharmonic partials at ×2.74/×5.4, the
// ×1.004 beat partner, the noise strike transient, and a sub. Partial/
// beat/sub decays scale by the same ratio the fundamental's own decay
// moves by (k = new decay / 4.5, brief 28's fundamental decay) — this
// preserves brief 28's approved "brightness fades faster than the
// fundamental" spectral shape at the new target decays, rather than
// inventing a new shape per strike. The sub is pitched an octave below
// each strike's OWN fundamental (was a fixed 110Hz under a fixed 220Hz
// fundamental) — a fixed sub under two different fundamentals would blur
// exactly the falling-fourth character the two pitches exist to create.
// The strike transient stays fixed at 1400Hz/Q2 for both — that is the
// mallet/board's own resonance, not a pitched partial, so it does not
// move with the note being struck, same as a real instrument.
//
// The second strike's 5s decay means it is still ringing under the
// brief-26 reveal's ground wipe (900ms) and into the haiku (1300ms) —
// deliberately, brief 28's original reasoning carries over unchanged. Do
// not shorten it to fit.
function sndGameOver() {
  if (muted || !actx || !sfxBus) return;
  try {
    const a = actx;
    const strike = (fundamental, decay, gainMult, startAt) => {
      const k = decay / 4.5; // brief 28's own fundamental decay — the scale reference
      bellStrike(a, 1400, 2, 0.12 * gainMult, 0.020, startAt);
      bellPartial(a, fundamental, 0.34 * gainMult, decay, 0.015, startAt);
      bellPartial(a, fundamental * 2.74, 0.18 * gainMult, 3.0 * k, 0.015, startAt);
      bellPartial(a, fundamental * 5.4, 0.08 * gainMult, 1.6 * k, 0.015, startAt);
      bellPartial(a, fundamental * 1.004, 0.14 * gainMult, decay, 0.015, startAt); // beat partner
      bellPartial(a, fundamental / 2, 0.12 * gainMult, 3.0 * k, 0.015, startAt); // sub, an octave down from THIS strike's fundamental
    };
    strike(293.66, 1.8, 0.72, 0);     // D4 — "da"
    strike(196.00, 5.0, 1.15, 0.380); // G3 — "DUM", a falling perfect fourth below
  } catch (e) {}
}

const idleSub = document.getElementById('idle-sub');

function armIdle() {
  if (idleEl.dataset.idleStep === 'armed') return;
  idleEl.dataset.idleStep = 'armed';
  idleSub.textContent = 'Choose a surface, then press space or click to begin';
  startBGM(); // fire-and-forget: startBGM is itself async/awaits actx.resume()
}

function beginGame() {
  if (idleEl.dataset.idleStep !== 'armed') return;
  setScreen('playing');
  startGame(); // brief 22 Task 3 — real game, replacing the brief-18/19/20/21 stub
  setBGMLevel(BGM_LEVEL_DUCKED); // brief 28 Task 5b
}

// Brief 28 Tasks 2/3 — shared destination for the playing screen's new
// home button and results' PLAY AGAIN: idle, ALREADY armed (surface
// selector showing, CSS's zp-slide-up plays automatically the instant
// data-idle-step starts matching "armed" — same mechanism armIdle() uses,
// just entered directly instead of via a gesture). Deliberately does NOT
// call armIdle() itself — armIdle() early-returns once already armed, but
// more importantly its startBGM() call restarts Oolong.mp3 from t=0 with
// a fresh 2.5s fade-in, which is wrong here: BGM is already playing
// (ducked, brief 22 Task 7's "continues uninterrupted" still holds), it
// only needs to come back up to its resting level.
// No confirmation prompt; the abandoned game's strokes are simply never
// shown again — gameCommittedStrokes/gameStrokesCv get overwritten by the
// next startGame() call regardless of how idle was reached.
function goToIdleArmed() {
  setScreen('idle');
  idleEl.dataset.idleStep = 'armed';
  idleSub.textContent = 'Choose a surface, then press space or click to begin';
  setBGMLevel(BGM_LEVEL_IDLE); // brief 28 Task 5b — back to rest
}

function onGesture(e) {
  if (screenState !== 'idle') return;
  if (idleEl.dataset.idleStep !== 'armed') armIdle();
  else beginGame();
}

window.addEventListener('keydown', (e) => {
  // Brief 30 Task 3 — #mobile-overlay's pointer-events:all already stops
  // every click/tap from reaching the game underneath it, but CSS
  // pointer-events has no effect on keyboard events at all (they ignore
  // stacking order entirely) — a real gap on the desktop-narrow-resize
  // edge case (no physical spacebar exists on an actual phone, so this
  // never matters there) without this explicit gate.
  if (isMobileBlocked()) return;
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); onGesture(e); }
});
document.getElementById('screen-idle').addEventListener('click', onGesture);
document.getElementById('screen-idle').addEventListener('touchstart', onGesture, { passive: true });

// Brief 22 Task 7: BGM continues across idle -> playing uninterrupted —
// armIdle() (above) already started it on the idle screen's first gesture.
// Brief 18's stub had a fade-down-on-leaving-idle hook tied to a results
// stub button that no longer exists in that form. Results DOES have a
// route back to idle again as of brief 28 Task 3 — PLAY AGAIN now goes to
// idle-armed (goToIdleArmed) rather than restarting in place, same as the
// playing screen's new home button (Task 2). That is also where BGM
// returns to its resting 0.72 level; see setBGMLevel/BGM_LEVEL_IDLE.

// Brief 29 Task 3 — landing with a fragment. The synchronous flash-guard
// at the very top of this script (landingWithSharePayload,
// SHARE_HASH_PREFIX) already hid the idle screen the instant this script
// started running, well before this promise chain has any chance to
// settle — this is that decode's async completion. Success shows Screen 4
// directly, matching a real recipient's first paint. Failure is Task 4's
// "quiet fall-through": exactly one console.warn, then a normal setScreen
// to idle un-hides it. Landing WITHOUT a fragment is untouched — line 830
// already sets the idle state directly, with no setScreen() call at all,
// exactly as before this brief.
if (landingWithSharePayload) {
  decodeFromFragment(location.hash.slice(SHARE_HASH_PREFIX.length))
    .then(rawBytes => rawBytes ? decodeArtworkPayload(rawBytes) : null)
    .then(decoded => {
      if (decoded) {
        setScreen('share');
        renderSharePage(decoded);
      } else {
        console.warn('[share] link payload could not be decoded — falling through to idle');
        setScreen('idle');
      }
    });
}
</script>
