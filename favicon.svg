<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Brief 30 Task 4: derived from the logo SVG's own dot mark (the "dot"
       in ZEN dot PONG, v3/app/index.html's circle cx=60 cy=14 r=3
       fill=FFF5E5), not a new symbol. Page-background-color square
       (rounded to match the app's own radius language) behind the same
       cream dot, scaled up so it reads clearly at 16px, where the full
       wordmark would not. -->
  <rect width="32" height="32" rx="8" fill="#383838"/>
  <circle cx="16" cy="16" r="6" fill="#FFF5E5"/>
</svg>
