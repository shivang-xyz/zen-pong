<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zen Pong — playing</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Colour · DESIGN.md §2 ── */
    --color-bg:            #383838;
    --color-cta:           #464646;
    --color-disabled:      #777777;
    --color-lightest-grey: #C5C5C5;
    --color-canvas:        #FFF5E5;
    --color-canvas-border: #888888;
    --color-pink:          #FF68AE;
    --color-blue:          #689AFF;
    --color-green:         #8CFFB4;
    --color-orange:        #FFAE68;
    --color-cyan:          #68D7FF;

    /* NEW — DESIGN-DELTA.md §1. UNRESOLVED: chalkboard ground borrows the
       page background, so the canvas loses its edge against the page. */
    --color-canvas-chalk:  #383838;
    --color-chip-selected: #383838;

    /* ── Spacing · DESIGN.md §4 ── */
    --space-xs: 4px;  --space-s: 8px;   --space-xxm: 12px; --space-xm: 16px;
    --space-m: 24px;  --space-l: 32px;  --space-xl: 40px;  --space-xxl: 48px;

    /* ── Radius · DESIGN.md §5 ── */
    --radius:        48px;
    --radius-small:  12px;
    --radius-nested: 8px;   /* NEW — UNRESOLVED, third radius value */

    /* ── Elevation · DESIGN.md §6 ── */
    --shadow-chip:   0 4px 24px rgba(0,0,0,0.29), inset 0 0 5px rgba(0,0,0,0.52);
    --shadow-canvas: 0 4px 24px rgba(0,0,0,0.28);
    --shadow-btn:    0 4px 24px rgba(0,0,0,0.16), inset 0 0 5px rgba(0,0,0,0.32);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--color-bg);
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-l) 0 var(--space-xxl);
  }

  /* ── Canvas · DESIGN.md §7 ── */
  .stage { position: relative; width: 1000px; height: 630px; }
  .canvas {
    position: absolute; inset: 0;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--color-canvas);
    box-shadow: var(--shadow-canvas);
    transition: background 400ms linear;
  }
  .frame {
    position: absolute; inset: 0;
    border-radius: var(--radius);
    border: 8px solid var(--color-canvas-border);
    pointer-events: none;
    z-index: 2;
  }
  .grain, .trails { position: absolute; inset: 0; }
  .trails polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Paddles · DESIGN.md §7 + DESIGN-DELTA.md §2b ──
     DOM divs, never drawn on canvas. The handle is DETACHED from the
     bar: 12px dot sitting 8px clear; label right-anchored 10px clear of the dot. */
  .paddle { position: absolute; width: 8px; height: 64px; z-index: 3; }
  .paddle .bar { position: absolute; inset: 0; border-radius: 4px; }
  .paddle .dot { position: absolute; top: 26px; width: 12px; height: 12px; border-radius: 50%; }
  .paddle-left  { left: 0; }
  .paddle-left  .bar, .paddle-left  .dot { background: var(--color-pink); }
  .paddle-left  .dot { left: -20px; }
  .paddle-right { right: 0; }
  .paddle-right .bar, .paddle-right .dot { background: var(--color-blue); }
  .paddle-right .dot { right: -20px; }
  /* Right-anchored, not left-offset: the 10px gap to the dot must not
     drift with glyph width or a font fallback. */
  .you {
    position: absolute; right: calc(100% + 30px); top: 20px;
    white-space: nowrap;
    font-size: 12px; color: var(--color-pink);
  }

  /* ── Control elevation · DESIGN.md §6/§10 ── */
  .ctrl-chip {
    height: var(--space-xxl);
    border-radius: var(--radius-small);
    background: var(--color-cta);
    box-shadow: var(--shadow-chip);
    display: flex;
    align-items: center;
  }

  /* ── Palette chip · DESIGN.md §10 + DESIGN-DELTA.md §4 ──
     Dot count is per-surface and VARIABLE — never assume five. */
  .pal-pill { padding: 0 var(--space-xm); gap: var(--space-s); }
  .pal-pill .dot { width: 10px; height: 10px; border-radius: 50%; }
  .pal-pill .shuffle { margin-left: var(--space-s); cursor: pointer; }
  .pal-pill .shuffle:hover { stroke: #FFFFFF; }

  /* ── Type · DESIGN.md §3 ── */
  .tagline { font-size: 14px; color: var(--color-lightest-grey); margin: 0; }
  .haiku   { font-size: 14px; color: var(--color-lightest-grey); margin: 0; }
  .mono {
    font-family: 'Space Mono', monospace; font-style: normal;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  }

  /* ── Buttons · DESIGN.md §10 ── */
  .rbtn {
    background: var(--color-cta);
    border: 0;
    border-radius: var(--radius-small);
    padding: var(--space-xxm) var(--space-m);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #FFFFFF;
    box-shadow: var(--shadow-btn);
    cursor: pointer;
  }
  .rbtn:hover { opacity: 0.85; }

  .spacer-s { height: var(--space-s); }
  .spacer-m { height: var(--space-m); }
  .spacer-l { height: var(--space-l); }

  /* Placeholder trails — accumulated rally. Engine owns real rendering. */
  .trails polyline { stroke-width: 1.5px; opacity: 0.7; }
  .t-pink { stroke: var(--color-pink); }
  .t-blue { stroke: var(--color-blue); }
  .ball {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: var(--color-pink); z-index: 3;
  }
  /* Serving indicator — grey ball outside the canvas, DESIGN.md §7 */
  .serve-dot {
    position: absolute; left: -32px; top: -40px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--color-canvas-border);
  }

  /* ── Control row · DESIGN.md §8 Screen 2 — unchanged ──
     Nothing about the painting is adjustable mid-rally. The timeline
     scrubber lives on results, not here. */
  #ctrl-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 1000px;
  }
  #ctrl-row > :nth-child(1) { justify-self: start; }
  #ctrl-row > :nth-child(3) { justify-self: end; display: flex; gap: var(--space-xm); }
  #score-pill {
    gap: var(--space-l);
    padding: 0 var(--space-m);
    min-width: 120px;
    justify-content: center;
  }
  #score-pill span {
    font-family: 'Space Mono', monospace; font-style: normal; font-weight: 700;
    font-size: 18px; letter-spacing: 0.1em; color: #FFFFFF;
  }
  .icon-pill { padding: 0 var(--space-xm); border: 0; cursor: pointer; }
  .icon-pill svg { opacity: 0.8; }
  .icon-pill:hover svg { opacity: 1; }
</style>
</head>
<body>

  <div class="spacer-m"></div>

  <div class="stage">
    <div class="serve-dot"></div>
    <div class="canvas">
      <svg class="grain" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
        <filter id="grain-play"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/></filter>
        <rect width="100%" height="100%" filter="url(#grain-play)" opacity="0.12"/>
      </svg>
      <svg class="trails" viewBox="0 0 1000 630" preserveAspectRatio="none" aria-hidden="true">
        <polyline class="t-pink" points="10,420 355,95"/>
        <polyline class="t-pink" points="355,95 660,600 900,505"/>
        <polyline class="t-pink" points="0,355 895,415"/>
        <polyline class="t-pink" points="30,120 940,560"/>
        <polyline class="t-blue" points="355,560 640,105"/>
        <polyline class="t-blue" points="640,105 900,320"/>
        <polyline class="t-blue" points="360,600 1000,250"/>
        <polyline class="t-blue" points="20,540 620,60"/>
      </svg>
      <div class="ball" style="left:695px; top:325px"></div>
    </div>
    <div class="frame"></div>

    <div class="paddle paddle-left" style="top:260px">
      <div class="bar"></div><div class="dot"></div><span class="you">you</span>
    </div>
    <div class="paddle paddle-right" style="top:380px">
      <div class="bar"></div><div class="dot"></div>
    </div>
  </div>

  <div class="spacer-m"></div>

  <div id="ctrl-row">
    <div class="ctrl-chip pal-pill">
      <i class="dot" style="background:var(--color-pink)"></i>
      <i class="dot" style="background:var(--color-blue)"></i>
      <i class="dot" style="background:var(--color-green)"></i>
      <i class="dot" style="background:var(--color-orange)"></i>
      <i class="dot" style="background:var(--color-cyan)"></i>
      <svg class="shuffle" width="20" height="20" viewBox="0 0 20 20" fill="none"
           stroke="#C5C5C5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="13,3 17,6.5 13,10"/><path d="M2 6.5h15"/>
        <polyline points="7,10 3,13.5 7,17"/><path d="M18 13.5H3"/>
      </svg>
    </div>

    <div id="score-pill" class="ctrl-chip"><span>0</span><span>3</span></div>

    <div>
      <button class="ctrl-chip icon-pill" aria-label="Restart">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#C5C5C5" stroke-width="1.5">
          <path d="M15 9a6 6 0 1 1-2-4.5"/><polyline points="15,2 15,5 12,5"/>
        </svg>
      </button>
      <button class="ctrl-chip icon-pill" aria-label="Mute">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#C5C5C5" stroke-width="1.5">
          <polygon points="2,7 5,7 9,3 9,15 5,11 2,11"/><line x1="12" y1="6" x2="16" y2="12"/><line x1="16" y1="6" x2="12" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

</body>
