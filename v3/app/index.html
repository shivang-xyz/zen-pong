function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundedRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

document.getElementById('btn-save').addEventListener('click', async () => {
  if (!resultsData) return;
  const S = 2, PAD = 32, quoteH = 100;
  const outW = (W + PAD * 2) * S, outH = (H + PAD * 2 + quoteH) * S;
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  const oc = out.getContext('2d');

  oc.fillStyle = '#383838';
  oc.fillRect(0, 0, outW, outH);

  const sx = PAD * S, sy = PAD * S, sw = W * S, sh = H * S, r = 48 * S; // border-radius x2, DESIGN.md §11
  oc.save();
  roundedRectPath(oc, sx, sy, sw, sh, r);
  oc.fillStyle = '#FFF5E5'; oc.fill(); // cream fallback beneath the ground/artwork, matches canvas-area base
  oc.clip();
  oc.drawImage(resultsGroundCanvas, sx, sy, sw, sh); // whatever the scrubber currently shows (Task 6)

document.querySelectorAll('#surface-chip .tile').forEach(tile => {
  tile.addEventListener('click', (e) => {
    e.stopPropagation(); // must not also trigger the idle->playing gesture below
    document.querySelectorAll('#surface-chip .tile').forEach(t => {
      t.setAttribute('aria-pressed', String(t === tile));
    });
    switchSurface(tile.dataset.pick);
  });
});

/* ════════════════════════════════════════════════════════════════════
   TASK 3 — idle two-step + audio unlock.
   Step A (attract): card only. First gesture (space/click/touchstart)
   arms Step B (surface selector slides up) AND is the audio-unlock
   gesture — root CLAUDE.md §4: AudioContext can only unlock on a real
   gesture, never mousemove. A second gesture while armed starts the game
   (idle -> playing, per DESIGN.md §5's state table).
   ════════════════════════════════════════════════════════════════════ */

// ── BGM — Oolong.mp3, root CLAUDE.md §4's protected pattern verbatim.
// new Audio() + createMediaElementSource(), never fetch/decodeAudioData.
let actx = null, muted = false;
updateMuteButton(); // brief 25 Task 2 — sync icon/aria to the actual default state
let ooAudio = null, ooGain = null, ooSrc = null;

function initOolong() {
  if (ooAudio) return;
  ooAudio = new Audio('../../Oolong.mp3');
  ooAudio.loop = true;
  ooAudio.crossOrigin = 'anonymous';
  ooSrc = actx.createMediaElementSource(ooAudio);
  ooGain = actx.createGain();
  ooGain.gain.value = 0;
  ooSrc.connect(ooGain);
  ooGain.connect(actx.destination);
}

async function startBGM() {
  if (muted) return;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  await actx.resume();
  initOolong();
  ooAudio.currentTime = 0;
  ooAudio.play().catch(() => {});
  ooGain.gain.cancelScheduledValues(actx.currentTime);
  ooGain.gain.setValueAtTime(0, actx.currentTime);
  ooGain.gain.linearRampToValueAtTime(0.72, actx.currentTime + 2.5);
}

function stopBGM() {
  if (!ooGain || !ooAudio || !actx) return;
  const t = actx.currentTime;
  ooGain.gain.cancelScheduledValues(t);
  ooGain.gain.setValueAtTime(ooGain.gain.value, t);
  ooGain.gain.linearRampToValueAtTime(0, t + 2.5);
  setTimeout(() => { ooAudio.pause(); }, 2600);
}

/* ════════════════════════════════════════════════════════════════════════
   BRIEF 27 — SFX. Ported VERBATIM from root index.html (~line 651-789):
   same oscillator types, frequencies, ramps, durations, gains — tuned by
   ear over the live build's whole history, not re-derived here. root
   CLAUDE.md §4 is binding: all seven functions always present, never
   removed or merged, wrapped in try/catch so a failed oscillator can never
   take down the game loop (kept from root, unchanged).

   The one deliberate adaptation: root's ac() lazily CREATES an
   AudioContext on any call, from anywhere. Here every function early-
   returns if actx is null instead — actx only exists after the idle
   screen's first real gesture (brief 18 Task 3, root CLAUDE.md §4: a
   gesture is what's allowed to unlock Web Audio, and a stray SFX call
   during idle is not one). Never creating a second context, never a
   console error from calling into a null one. */
function tone(p = {}) {
  if (muted || !actx) return;
  const { freq = 440, type = 'sine', gain = 0.1, dur = 0.1, freqEnd = null, attack = 0.003, detune = 0 } = p;
  try {
    const a = actx, o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime); o.detune.setValueAtTime(detune, a.currentTime);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, a.currentTime + dur);
    g.gain.setValueAtTime(0, a.currentTime); g.gain.linearRampToValueAtTime(gain, a.currentTime + attack);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.start(a.currentTime); o.stop(a.currentTime + dur + 0.02);
  } catch (e) {}
}

function nz(p = {}) {
  if (muted || !actx) return;
  const { gain = 0.06, dur = 0.04, freq = 800, q = 10 } = p;
  try {
    const a = actx, buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = a.createGain(); src.connect(f); f.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(gain, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    src.start(); src.stop(a.currentTime + dur + 0.02);
  } catch (e) {}
}

// Paddle hit — sharp click transient + wooden body resonance.
function sndScratch() {
  if (muted || !actx) return;
  try {
    const a = actx;
    const clickDur = 0.018;
    const cbuf = a.createBuffer(1, Math.ceil(a.sampleRate * clickDur), a.sampleRate);
    const cd = cbuf.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * 0.7;
    const csrc = a.createBufferSource(); csrc.buffer = cbuf;
    const cf = a.createBiquadFilter(); cf.type = 'bandpass';
    cf.frequency.value = 1800; cf.Q.value = 0.8;
    const cg = a.createGain();
    cg.gain.setValueAtTime(0.49, a.currentTime);
    cg.gain.exponentialRampToValueAtTime(0.001, a.currentTime + clickDur);
    csrc.connect(cf); cf.connect(cg); cg.connect(a.destination);
    csrc.start(); csrc.stop(a.currentTime + clickDur + 0.005);
    const o = a.createOscillator(), og = a.createGain();
    o.connect(og); og.connect(a.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(420, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(180, a.currentTime + 0.06);
    og.gain.setValueAtTime(0.36, a.currentTime);
    og.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.08);
    o.start(a.currentTime); o.stop(a.currentTime + 0.09);
  } catch (e) {}
}

// Wall bounce — plastic click + short plastic body thump.
function sndThud() {
  if (muted || !actx) return;
  try {
    const a = actx;
    const dur = 0.038;
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.6;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 2200; f.Q.value = 0.9;
    const g = a.createGain();
    g.gain.setValueAtTime(0.29, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(); src.stop(a.currentTime + dur + 0.005);
    const o = a.createOscillator(), og = a.createGain();
    o.connect(og); og.connect(a.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(160, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, a.currentTime + 0.035);
    og.gain.setValueAtTime(0.21, a.currentTime);
    og.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.04);
    o.start(a.currentTime); o.stop(a.currentTime + 0.045);
  } catch (e) {}
}

// Ball-to-ball collision. DORMANT in v3: physics.js's ballBall only ever
// receives stepGame's single-element [gameBall] array (MAX_B is 1 here,
// same as the live build), so its collide-event branch can never fire and
// this function is never actually called. Ported and wired anyway per
// root CLAUDE.md §4 — do not delete this as dead code.
function sndCollide() {
  if (muted || !actx) return;
  nz({ gain: 0.33, dur: 0.035, freq: 1800, q: 5 });
  tone({ freq: 300, freqEnd: 185, type: 'triangle', gain: 0.23, dur: 0.06 });
}

// Point scored.
function sndPoint() {
  if (muted || !actx) return;
  try {
    const a = actx;
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(320, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(318, a.currentTime + 1.2);
    g.gain.setValueAtTime(0, a.currentTime);
    g.gain.linearRampToValueAtTime(0.23, a.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 1.4);
    o.start(a.currentTime); o.stop(a.currentTime + 1.5);
  } catch (e) {}
}

// Level up — every 2 total points (checkGameLevel).
function sndLevelUp() {
  if (muted || !actx) return;
  try {
    const a = actx;
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(440, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(438, a.currentTime + 1.0);
    g.gain.setValueAtTime(0, a.currentTime);
    g.gain.linearRampToValueAtTime(0.33, a.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 1.2);
    o.start(a.currentTime); o.stop(a.currentTime + 1.3);
  } catch (e) {}
}

// Protected spec — root CLAUDE.md §4 / v3/CLAUDE.md: fires EXACTLY ONCE
// per paddle hit, called from inside the paddleHit branch of stepGame's
// events.forEach (see below) — never on a frame clock, never behind a
// cooldown timer. advanceBall's typed event array is what makes "exactly
// once" free: the event only exists on the frame a hit actually happened.
function sndChalk() {
  if (muted || !actx) return;
  try {
    const a = actx;
    const dur = 0.055;
    const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.018;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 2800; f.Q.value = 2.5;
    const g = a.createGain();
    g.gain.setValueAtTime(0.028, a.currentTime);
    g.gain.linearRampToValueAtTime(0.001, a.currentTime + 0.055);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(); src.stop(a.currentTime + 0.06);
  } catch (e) {}
}

// Game over — 2.5s decaying tone, deliberately still sounding as the
// brief-26 reveal's ground wipe (900ms) settles under the haiku (1300ms).
// Task 6: do not shorten this to fit the reveal, do not add a second sound.
function sndGameOver() {
  if (muted || !actx) return;
  try {
    const a = actx;
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(220, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(218, a.currentTime + 2.2);
    g.gain.setValueAtTime(0, a.currentTime);
    g.gain.linearRampToValueAtTime(0.23, a.currentTime + 0.010);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 2.5);
    o.start(a.currentTime); o.stop(a.currentTime + 2.6);
  } catch (e) {}
}

const idleSub = document.getElementById('idle-sub');

function armIdle() {
  if (idleEl.dataset.idleStep === 'armed') return;
  idleEl.dataset.idleStep = 'armed';
  idleSub.textContent = 'choose a surface, then space to serve';
  startBGM(); // fire-and-forget: startBGM is itself async/awaits actx.resume()
}

function beginGame() {
  if (idleEl.dataset.idleStep !== 'armed') return;
  setScreen('playing');
  startGame(); // brief 22 Task 3 — real game, replacing the brief-18/19/20/21 stub
}

function onGesture(e) {
  if (screenState !== 'idle') return;
  if (idleEl.dataset.idleStep !== 'armed') armIdle();
  else beginGame();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); onGesture(e); }
});
document.getElementById('screen-idle').addEventListener('click', onGesture);
document.getElementById('screen-idle').addEventListener('touchstart', onGesture, { passive: true });

// armIdle() (above) already started it on the idle screen's first gesture.
